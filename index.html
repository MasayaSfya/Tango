 qualified candidate was not accepted for the job.", "ex_trans": "最も適任の候補者がその職に採用されなかったとき, 誰もが驚いた。"}, {"num": "1289", "word": "slack", "phonetic": "[slǽk]", "trans": "緩んだ, たるんだ [＝loose] , 怠慢な [＝careless] 　急げる", "ex_eng": "She pounded her hammer on the slack nails in order to secure the roof of her house.", "ex_trans": "彼女は自宅の屋根を固定するため, 緩んだくぎにハンマーを打ち下ろした。"}, {"num": "1290", "word": "unconstitutional", "phonetic": "[ʌnkὰn(ː)stətjúːʃənl]", "trans": "違憲の, 憲法違反の (⇔constitutional)", "ex_eng": "The judge declared the new law unconstitutional because it restricted freedom of speech.", "ex_trans": "新法は言論の自由を制限しているので違憲だと, と裁判官は宣告した。"}, {"num": "1291", "word": "unilateral", "phonetic": "[jùːnilǽtərəl]", "trans": "(決定などが) 一方的な", "ex_eng": "At one point, Britain came close to a unilateral renunciation of its nuclear weapons.", "ex_trans": "ある時点で, イギリスは自国の核兵器を一方的に放棄する一歩手前まで行った。"}, {"num": "1292", "word": "autonomous", "phonetic": "[ɔːtɑ́nəməs]", "trans": "自律的な，自立した [=independent, self-sufficient] ，（車が）自動運転の [=self-driving] autonomy 名", "ex_eng": "We aim to educate our students to be autonomous individuals who are capable of thinking for themselves.", "ex_trans": "当校の目標は，生徒たちが自ら考えることのできる自律的な個人になるよう教育することである。"}, {"num": "1293", "word": "arid", "phonetic": "[ˈærɪd]", "trans": "ひどく乾燥した [=very dry]", "ex_eng": "Little grew in the arid desert, so local people had to find other ways of making a living besides farming.", "ex_trans": "乾き切った砂漠ではほとんど何も育たなかったので，地元民は農業以外の方法で生計を立てる必要があった。"}, {"num": "1294", "word": "asexual", "phonetic": "[eɪsékʃuəl]", "trans": "無性の，生殖器のない", "ex_eng": "Although we think of reproduction as involving two sexes, asexual reproduction does occur in nature.", "ex_trans": "生殖には2つの性が関与すると私たちは思うけれど，自然においては無性生殖が実際に生じる。"}, {"num": "1295", "word": "astounding", "phonetic": "[əstáʊndɪŋ]", "trans": "仰天するような [=amazing, astonishing]", "ex_eng": "The astounding cost of houses in the capital was the result of an influx of wealthy foreigners.", "ex_trans": "首都の仰天するような住宅価格は，裕福な外国人の流入によるものだった。"}, {"num": "1296", "word": "benevolent", "phonetic": "[bənévələnt]", "trans": "善意の (⇔malevolent)", "ex_eng": "The government's intentions were benevolent, but the policy had a terrible effect on many people.", "ex_trans": "政府の意図は善意から出たものだったが，その政策は多くの人にひどい影響を与えた。"}, {"num": "1297", "word": "canine", "phonetic": "[kéinàin]", "trans": "犬の", "ex_eng": "Some canine diseases are actually very similar to those which afflict human beings.", "ex_trans": "犬の病気の中には, 人間を悩ます病気に実際よく似たものもある。"}, {"num": "1298", "word": "cardiopulmonary", "phonetic": "[kὰɚdioupʌ́lmənèri]", "trans": "心肺の", "ex_eng": "Cardiopulmonary diseases are especially common among smokers.", "ex_trans": "心肺の病気は喫煙者に特によく見られる。"}, {"num": "1299", "word": "conscientious", "phonetic": "[kὰ(:)nʃiénʃəs]", "trans": "誠実な, 念入りな", "ex_eng": "She was a conscientious worker who always carried out her duties on time.", "ex_trans": "彼女は常に任務を時間どおりに実行する誠実な働き手だった。"}, {"num": "1300", "word": "radically", "phonetic": "[rǽdɪkəli]", "trans": "根本的に, 徹底的に", "ex_eng": "The new boss radically changed the company's approach to selling its products.", "ex_trans": "新しい上司は製品を売る会社の手法を根本的に変えた。"}, {"num": "1301", "word": "persist", "phonetic": "[pərsíst]", "trans": "やり抜く, 持続する, 固執する", "ex_eng": "Despite numerous disappointments, the scientist persisted until he found a cure.", "ex_trans": "何度となく失敗したにもかかわらず, その科学者は治療法を見つけるまでやり抜いた。"}, {"num": "1302", "word": "undertake", "phonetic": "[ʌndərtéik]", "trans": "を引き受ける (⇔refuse を断る)", "ex_eng": "The soldiers undertook the responsibility to defend their country.", "ex_trans": "兵士たちは母国を守る責任を引き受けた。"}, {"num": "1303", "word": "confiscate", "phonetic": "[kɑ́(:)nfiskèit]", "trans": "を没収する [=impound, seize]", "ex_eng": "Any cellphone found on school premises was automatically confiscated.", "ex_trans": "学校の構内で見つかったすべての携帯電話は自動的に没収された。"}, {"num": "1304", "word": "mock", "phonetic": "[ma(:)k]", "trans": "（仕草）をまねる, をからかう [=ridicule, scoff at]", "ex_eng": "The comedian made his name by mocking politicians and other powerful figures.", "ex_trans": "そのコメディアンは, 政治家やほかの影響力のある人物の物まねで有名になった。"}, {"num": "1305", "word": "epitomize", "phonetic": "[ɪˈpɪtəmɑɪz]", "trans": "の典型である", "ex_eng": "For many people, the band's music epitomized the spirit of the 1960s.", "ex_trans": "多くの人々にとって, そのバンドの音楽は1960年代の精神の典型だった。"}, {"num": "1306", "word": "expedite", "phonetic": "[ˈɛkspədɑɪt]", "trans": "をはかどらせる, を促進する", "ex_eng": "The company had to expedite the development of the new product to meet demand.", "ex_trans": "その会社は, 需要に対処するために新製品の開発をはかどらせる必要があった。"}, {"num": "1307", "word": "facilitate", "phonetic": "[fəsɪˈlɪtèɪt]", "trans": "を容易にする, を助長する", "ex_eng": "I recently found a new book that facilitated my grasp of quantum mechanics.", "ex_trans": "私は最近, 量子力学についての私の理解を助けてくれる新しい本を見つけた。"}, {"num": "1308", "word": "disseminate", "phonetic": "[dɪsémɪnèɪt]", "trans": "を普及させる", "ex_eng": "The first printing press allowed people to easily disseminate the written word.", "ex_trans": "印刷機が作られて初めて, 人々は書かれた言葉を容易に流布させることができるようになった。"}, {"num": "1309", "word": "corroborate", "phonetic": "[kərɑ́bərèit]", "trans": "を確証する [=confirm] corroboration 名 ▶ corroborating evidence 補強証拠", "ex_eng": "The detective tried to gather more evidence to corroborate the woman's accusations.", "ex_trans": "刑事はその女性の訴えを確証するため，もっと証拠を集めようとした。"}, {"num": "1310", "word": "curb", "phonetic": "[kə́ːrb]", "trans": "を抑制する, 抑制, 縁石", "ex_eng": "The mayor announced that he intended to curb spending on the city's parks.", "ex_trans": "市長は市立公園への支出を抑制するつもりだと発表した。"}, {"num": "1311", "word": "oppress", "phonetic": "[əprés]", "trans": "を抑圧する, を虐げる", "ex_eng": "For years, the regime had oppressed the people, denying them their freedom.", "ex_trans": "何年にもわたってその政権は民衆を抑圧し, 自由を与えなかった。"}, {"num": "1312", "word": "retard", "phonetic": "[rɪtάːrd]", "trans": "を遅らせる, を妨げる", "ex_eng": "Government red tape has retarded progress on economic reform.", "ex_trans": "政府の官僚的な形式主義は経済改革の進行を遅らせてきた。"}, {"num": "1313", "word": "avert", "phonetic": "[əvə́ːrt]", "trans": "(視線・考えなど)をそらす", "ex_eng": "In her embarrassment, she averted her eyes from my gaze.", "ex_trans": "彼女は当惑のあまり私の視線から目をそらした。"}, {"num": "1314", "word": "curtail", "phonetic": "[kəːrtéil]", "trans": "を切り詰める", "ex_eng": "We were forced to curtail our trip due to a family emergency.", "ex_trans": "家族に緊急事態が発生したため, 私たちは旅行日程を切り詰めねばならなかった。"}, {"num": "1315", "word": "demean", "phonetic": "[dimíːn]", "trans": "の品位を下げる [=debase]", "ex_eng": "The feminist group complained that the advertisements demeaned women.", "ex_trans": "その広告は女性の品位を下げている, とそのフェミニスト団体は苦情を述べた。"}, {"num": "1316", "word": "circumvent", "phonetic": "[sɜ̀ːrkəmvént]", "trans": "の抜け道を見つける, を回避する [=avoid, eschew]", "ex_eng": "He accused the company of trying to circumvent their earlier agreement.", "ex_trans": "以前の取り決めの抜け道を見つけようとしているとして, 彼はその会社を非難した。"}, {"num": "1317", "word": "dissect", "phonetic": "[disékt]", "trans": "を分析する [=analyze] , を解剖する [=anatomize]", "ex_eng": "The philosopher carefully dissected the scientist's argument in order to disprove it.", "ex_trans": "その哲学者は, その科学者の論証が誤りであることを証明するために注意深く分析した。"}, {"num": "1318", "word": "renounce", "phonetic": "[rináuns]", "trans": "を放棄する [=abandon] , と関係を絶つ [=disown]", "ex_eng": "At an early age, the king renounced his throne and retreated into private life.", "ex_trans": "若いころにその王は王位を放棄し, 私人としてひっそりと暮らした。"}, {"num": "1319", "word": "cajole", "phonetic": "[kədʒóul]", "trans": "（人）を言いくるめる [=coax, wheedle]", "ex_eng": "When at first I refused to help, she began to cajole me in a sweet tone of voice.", "ex_trans": "最初助けることを拒絶したら，彼女は甘い口調で私を言いくるめようとし始めた。"}, {"num": "1320", "word": "blur", "phonetic": "[blə:r]", "trans": "を不明瞭にさせる (= make vague)", "ex_eng": "The drizzling rain blurred my vision, making it dangerous to drive further.", "ex_trans": "そば降る雨で視界がぼやけ,それ以上車で進むのは危険になった。"}, {"num": "1321", "word": "dispatch", "phonetic": "[dispǽtʃ]", "trans": "を急送する, を急派する (= expedite)", "ex_eng": "The company promises to dispatch all orders on the day that they are received.", "ex_trans": "注文を受けたその日にすべての注文品を急送する,と,その会社は約束している。"}, {"num": "1322", "word": "dissuade", "phonetic": "[diswéid]", "trans": "に思いとどまらせる <from ～を> (= discourage) (⇔persuade)", "ex_eng": "A social worker managed to dissuade the man from jumping to his death.", "ex_trans": "ソーシャルワーカーがその男性の飛び降り自殺をどうにか思いとどまらせることができた。"}, {"num": "1323", "word": "admonish", "phonetic": "[ædmá(:)nɪʃ]", "trans": "を諭す <for ～の理由で>, をたしなめる (= reprimand)", "ex_eng": "When the man admonished the teenagers for smoking, they just laughed.", "ex_trans": "男性が10代の若者たちに喫煙を注意したとき,彼らは笑っただけだった。"}, {"num": "1324", "word": "traverses", "phonetic": "trævə́ːrsɪz", "trans": "を横断する", "ex_eng": "It took the explorers longer than expected to traverse the terrain.", "ex_trans": "探検家たちがその地域を横断するのに, 予想よりも長く時間がかかった。"}, {"num": "1325", "word": "veto", "phonetic": "[víːtou]", "trans": "(法案など) に拒否権を行使する", "ex_eng": "The president vetoed the Congressional bill cutting welfare to the poor.", "ex_trans": "大統領は貧困層への福祉を削減する議会法案に拒否権を行使した。"}, {"num": "1326", "word": "linger", "phonetic": "[lɪ́ŋgər]", "trans": "ぶらぶらする, ぐずぐずする", "ex_eng": "Even after school is over, that group of students likes to linger around.", "ex_trans": "放課後になっても, あの生徒たちのグループはぶらぶら残っていたがる。"}, {"num": "1327", "word": "replenish", "phonetic": "[rɪplénɪʃ]", "trans": "を補充する", "ex_eng": "Once a week the farmers drive to town to replenish their supplies.", "ex_trans": "週に1度, 農場主たちは生活必需品を補充するために車で町へ出る。"}, {"num": "1328", "word": "disparage", "phonetic": "[dɪspǽrɪdʒ]", "trans": "を見くびる", "ex_eng": "Even members of the scientific community disparaged the cloning of a sheep.", "ex_trans": "科学界の人々でさえ, 羊のクローン化を見くびっていた。"}, {"num": "1329", "word": "stray", "phonetic": "[strei]", "trans": "はぐれる、迷った", "ex_eng": "Visitors who stray from the path sometimes get lost in the woods.", "ex_trans": "道から外れた観光客が時々森の中で迷子になる。"}, {"num": "1330", "word": "accentuate", "phonetic": "[əkséntʃuə̀rt]", "trans": "を強調する", "ex_eng": "The politician tried to accentuate the positive achievements of the government.", "ex_trans": "その政治家は政府のよい成果を強調しようとした。"}, {"num": "1331", "word": "exterminate", "phonetic": "[ɪkstə́ːrmɪnèɪt]", "trans": "を絶滅させる", "ex_eng": "The wolves were eventually exterminated by settlers in the area.", "ex_trans": "オオカミはその地域の入植者によってついに絶滅させられた。"}, {"num": "1332", "word": "retort", "phonetic": "[rɪtɔ́ːrt]", "trans": "言い返す, に反論する", "ex_eng": "The comedian could always retort in a witty way to any comment.", "ex_trans": "その喜劇役者はいつも, どんなコメントにも機知に富んだ答えを返すことができた。"}, {"num": "1333", "word": "encapsulate", "phonetic": "[ɪnkǽpsəlèɪt]", "trans": "を要約する, をカプセルに入れる", "ex_eng": "The professor began by encapsulating his previous lectures on the subject.", "ex_trans": "教授はそのテーマに関する以前の講義を要約することから始めた。"}, {"num": "1334", "word": "evacuate", "phonetic": "[ivǽkjuèit]", "trans": "を避難させる, を立ち退かせる", "ex_eng": "People were evacuated from their homes because of the danger of an eruption.", "ex_trans": "噴火の危険があるので, 人々は自宅から避難させられた。"}, {"num": "1335", "word": "monastery", "phonetic": "[mάn(ə)stèri]", "trans": "(男子の)僧院, 修道院", "ex_eng": "Many Buddhist monasteries in China were built high up on the sides of mountains.", "ex_trans": "中国の多くの仏教僧院は山の斜面の高い所に建てられた。"}, {"num": "1336", "word": "obedience", "phonetic": "[oubíːdiəns]", "trans": "服従 〈to ～への〉, 従順", "ex_eng": "As history shows, blind obedience to authority can lead to terrible crimes.", "ex_trans": "歴史が示すように, 権威への盲従は恐ろしい犯罪を招くことがある。"}, {"num": "1337", "word": "occupant", "phonetic": "[άkjupənt]", "trans": "(土地・家屋などの) 居住者, 占有者, (乗り物に) 乗っている人", "ex_eng": "The occupant of the apartment behaved in an eccentric way, shouting out comments to passing strangers.", "ex_trans": "アパートのその居住者は, 通りかかる知らない人に大声で言葉をかけ, 奇矯な振る舞いをした。"}, {"num": "1338", "word": "offense", "phonetic": "[əféns]", "trans": "犯罪 [=crime], 違反 [=illegal act], 侮蔑", "ex_eng": "Those who had committed serious offenses such as murder were imprisoned separately.", "ex_trans": "殺人のような重い犯罪を犯した者は別々に収監された。"}, {"num": "1339", "word": "orchard", "phonetic": "[ɔ́ːrtʃərd]", "trans": "果樹園", "ex_eng": "There were many apple orchards in the area that were badly damaged by the storm.", "ex_trans": "その地域には, 嵐で大きな被害を受けた多くのリンゴ園があった。"}, {"num": "1340", "word": "patron", "phonetic": "[péitrən]", "trans": "(芸術などの) 後援者, パトロン", "ex_eng": "In the past, artists often had to rely on wealthy patrons to make a living.", "ex_trans": "昔は, 芸術家は生計を立てるためにしばしば裕福な後援者に頼らなければならなかった。"}, {"num": "1341", "word": "petroleum", "phonetic": "[pətróuliəm]", "trans": "石油", "ex_eng": "Many petroleum companies have begun to invest in renewable forms of energy.", "ex_trans": "多くの石油会社が再生可能なエネルギー形態に投資し始めている。"}, {"num": "1342", "word": "pigment", "phonetic": "[pígmənt]", "trans": "顔料, 色素", "ex_eng": "The local cloth was dyed using natural pigments, which gave it a distinctive look.", "ex_trans": "その土地の布は天然の顔料を用いて染色されていて, そのため見た目が独特だった。"}, {"num": "1343", "word": "placebo", "phonetic": "[plæsí:bou]", "trans": "偽薬, プラセボ, プラシーボ", "ex_eng": "Half of the patients were given the new drug, and half were given placebos that had no effect.", "ex_trans": "患者の半数は新薬を与えられ, 半数は何の効き目もない偽薬を与えられた。"}, {"num": "1344", "word": "probability", "phonetic": "[prὰbəbíləti]", "trans": "見込み 〈of 〜の，that ・・・という〉 ，公算 [=likelihood] probable 形", "ex_eng": "The weather forecast said that there was a strong probability of snow within the next 24 hours.", "ex_trans": "今から24時間以内に雪になる見込みが高い，と天気予報は言っていた。"}, {"num": "1345", "word": "proliferation", "phonetic": "[prəlìfərèiʃən]", "trans": "急増, 拡散", "ex_eng": "The proliferation of fake medicines on the Internet is causing concern among doctors.", "ex_trans": "インターネットでのまがい物の薬の急増が医師の間に懸念をもたらしている。"}, {"num": "1346", "word": "detachment", "phonetic": "[ditàtʃmənt]", "trans": "無私, 超然", "ex_eng": "As an outsider, he could approach the issue with detachment and see both sides of the question.", "ex_trans": "部外者である彼は無私な態度でその問題に取り組み, 問題点の両面を見ることができた。"}, {"num": "1347", "word": "diarrhea", "phonetic": "[dàiəríːə]", "trans": "下痢", "ex_eng": "A common symptom of food poisoning is diarrhea, but this usually does not last long.", "ex_trans": "食中毒によくある症状は下痢だが, 普通長くは続かない。"}, {"num": "1348", "word": "diorama", "phonetic": "[dàiərάːmə]", "trans": "ジオラマ", "ex_eng": "The museum curator created a diorama of the city center, showing how it had been 200 years ago.", "ex_trans": "その博物館のキュレーターは, 市の中心部の200年前の姿を表すジオラマを作った。"}, {"num": "1349", "word": "enactment", "phonetic": "[ɪnˈæktmənt]", "trans": "(法律の) 制定", "ex_eng": "Before the enactment of the law, opium had been freely available on the open market.", "ex_trans": "その法律の制定前は, アヘンは一般市場で自由に入った。"}, {"num": "1350", "word": "exaggeration", "phonetic": "[ɪgzædʒəréɪʃən]", "trans": "誇張 [=overstatement]", "ex_eng": "While the book contained few outright lies, it was full of misleading exaggerations of the truth.", "ex_trans": "その本にあからさまなうそはほとんど含まれていなかったが, 誤解を招く真実の誇張だらけだった。"}, {"num": "1351", "word": "figment", "phonetic": "[fígmənt]", "trans": "想像の産物", "ex_eng": "She said that the stranger he had seen in the garden had just been a figment of his imagination.", "ex_trans": "彼が庭で見かけた知らない人は彼の想像の産物にすぎない, と彼女は言った。"}, {"num": "1352", "word": "hallucination", "phonetic": "[həlùːsɪnéɪʃən]", "trans": "幻覚", "ex_eng": "Some psychedelic drugs can induce hallucinations such as the impression that one is flying.", "ex_trans": "一部の幻覚剤は, 自分が空を飛んでいる感じといった幻覚を引き起こすことがある。"}, {"num": "1353", "word": "incision", "phonetic": "[ɪnsíʒən]", "trans": "切開，切り込み incise 動", "ex_eng": "The surgeon made a deep incision in his chest as a prelude to carrying out heart surgery.", "ex_trans": "心臓手術を行う幕開きに，外科医は彼の胸を深く切開した。"}, {"num": "1354", "word": "kickback", "phonetic": "[kíkbæk]", "trans": "リベート, キックバック", "ex_eng": "After the politician died, evidence emerged that he had had received kickbacks from arms manufacturers.", "ex_trans": "その政治家が亡くなった後, 武器メーカーからリベートを受け取っていた証拠が明るみに出た。"}, {"num": "1355", "word": "linguist", "phonetic": "[líŋgwist]", "trans": "言語学者", "ex_eng": "Many linguists doubt the idea that grammatical structures determine the way we think.", "ex_trans": "多くの言語学者は, 文法構造が私たちの考え方を決定するという考えを疑っている。"}, {"num": "1356", "word": "litany", "phonetic": "[lítəni]", "trans": "延々と続くもの", "ex_eng": "History is often taught today as a litany of crimes and disasters.", "ex_trans": "歴史は今日では犯罪と惨事の延々とした羅列として教えられることが多い。"}, {"num": "1357", "word": "measles", "phonetic": "[míːzlz]", "trans": "はしか", "ex_eng": "Measles is just one of the diseases that has been brought under control by vaccinations.", "ex_trans": "はしかは, ワクチン接種によって制圧された病気の1つである。"}, {"num": "1358", "word": "microcredit", "phonetic": "[màikrouəkrédɪt]", "trans": "マイクロクレジット, 微少額貸付", "ex_eng": "Microcredit, which means providing very small loans to poor people, is now widely appreciated by economists.", "ex_trans": "マイクロクレジットは貧困層にわずかな融資をすることで, 今では経済学者が広く評価している。"}, {"num": "1359", "word": "obsolescence", "phonetic": "[ὰ(ː)bsəlέsəns]", "trans": "廃れること, 旧式になること", "ex_eng": "Rapid obsolescence has always been a characteristic of consumer electronics.", "ex_trans": "急速に廃れることは, 消費者向け電化製品の昔からの特徴だ。"}, {"num": "1360", "word": "omnivore", "phonetic": "[ά(ː)mnɪvɔ̀ːr]", "trans": "雑食動物", "ex_eng": "Omnivores are creatures, like humans, which eat both plants and animals.", "ex_trans": "雑食動物は人間のように植物も動物も食べる生物のことである。"}, {"num": "1361", "word": "outlay", "phonetic": "[άʊtlèɪ]", "trans": "(事業を始めるためなどの) 出費, 支出", "ex_eng": "The initial outlay for establishing a dental practice is high, but the money can soon be earned back.", "ex_trans": "歯科開業の初期費用は高額だが, そのお金はすぐに稼いで取り返すことができる。"}, {"num": "1362", "word": "overuse", "phonetic": "[òʊvərjúːs]", "trans": "使い過ぎ", "ex_eng": "The overuse of antibiotics is leading to more and more bacterial infections that cannot be treated.", "ex_trans": "抗生物質の過度の使用により, 治療できない細菌感染がどんどん増えている。"}, {"num": "1363", "word": "realtor", "phonetic": "[rí:æltər]", "trans": "不動産業者 [= real estate agent, estate agent]", "ex_eng": "Based on the realtor’s advice, they decided to reduce the price they were asking for the house.", "ex_trans": "不動産業者のアドバイスに基づいて, 彼らは家の売り値を下げることにした。"}, {"num": "1364", "word": "relapse", "phonetic": "[rilǽps]", "trans": "(病気の)ぶり返し, (元の状態への)逆戻り", "ex_eng": "The woman seemed to be recovering well, but then she suffered a relapse and went back into the hospital.", "ex_trans": "女性は順調に回復しているように思えたが, その後病気がぶり返して病院に逆戻りした。"}, {"num": "1365", "word": "reverence", "phonetic": "[révərəns]", "trans": "尊敬, 崇敬", "ex_eng": "Many older people continued to feel a reverence for the monarchy.", "ex_trans": "多くの年配の人は君主制に尊敬を感じ続けていた。"}, {"num": "1366", "word": "revitalization", "phonetic": "[ri:vàiṭəlǽzéis(ə)n]", "trans": "再活性化, 復興", "ex_eng": "The building of the new factory led to the revitalization of the whole area.", "ex_trans": "その新工場の建設が地域全体の再活性化につながった。"}, {"num": "1367", "word": "sustenance", "phonetic": "[sʌ́stənəns]", "trans": "食物, 栄養, 持続", "ex_eng": "The peasants were traditionally able to provide sustenance for themselves and their families.", "ex_trans": "小作人たちは伝統的に自分と家族の食物は賄うことができた。"}, {"num": "1368", "word": "zoologist", "phonetic": "[zóu(ə)lɑ́dʒist]", "trans": "動物学者", "ex_eng": "Zoologists have been warning for some time that many species face extinction.", "ex_trans": "動物学者は，多くの種が絶滅の危機に瀕しているとしばらく前から警告し続けている。"}, {"num": "1369", "word": "disguise", "phonetic": "[disgáiz]", "trans": "変装 [= camouflage]", "ex_eng": "Nobody recognized the famous pop star through his disguise.", "ex_trans": "変装していたので，有名なポップスターに誰も気付かなかった。"}, {"num": "1370", "word": "privilege", "phonetic": "[prívəlidʒ]", "trans": "特典，特権", "ex_eng": "Railway employees have the privilege of being allowed to travel on any train for free.", "ex_trans": "鉄道会社の社員は，どんな電車にも無料で乗れるという特典を持っている。"}, {"num": "1371", "word": "breakthrough", "phonetic": "[bréikθrùː]", "trans": "大進歩 [= significant advance or achievement], 突破", "ex_eng": "It took several years to achieve any breakthroughs in AIDS research.", "ex_trans": "エイズ研究で何らかの大進歩が達成されるまでに数年かかった。"}, {"num": "1372", "word": "endowment", "phonetic": "[indáumənt]", "trans": "寄付（金） [=contribution, donation of money]", "ex_eng": "A wealthy graduate had left the college a huge endowment.", "ex_trans": "裕福な卒業生が大学に高額の寄付をしていた。"}, {"num": "1373", "word": "verdict", "phonetic": "[vˈɚːdikt]", "trans": "(陪審員の)評決, 決定 [=decision] , 判断 [=judgment]", "ex_eng": "The public was shocked by the jury's verdict of \"guilty.\"", "ex_trans": "大衆は陪審の「有罪」評決にショックを受けた。"}, {"num": "1374", "word": "momentum", "phonetic": "[moumémṭəm]", "trans": "勢い [=impetus] , 運動量", "ex_eng": "Coaches often say that momentum is an important part of winning a game.", "ex_trans": "コーチというのは, 勢いは試合に勝つ重要な要素だ, とよく言うものだ。"}, {"num": "1375", "word": "brevity", "phonetic": "[brévəṭi]", "trans": "(時の)短さ, 簡潔さ [=shortness, briefness, conciseness, terseness]", "ex_eng": "Haiku poets often suggest, at least indirectly, the brevity of life.", "ex_trans": "俳人は, 少なくとも遠回しに, 人生のはかなさといったことを詠むことが多い。"}, {"num": "1376", "word": "precedent", "phonetic": "[présidənt]", "trans": "前例 [=previous case]", "ex_eng": "His request was refused because there was no precedent.", "ex_trans": "彼の要請は前例がなかったので拒否された。"}, {"num": "1377", "word": "morale", "phonetic": "[mərǽl]", "trans": "勤労意欲, 士気 cf. demoralize の士気をくじく", "ex_eng": "In an effort to improve morale, the boss announced a picnic for all his employees.", "ex_trans": "何とかして勤労意欲を高めようと, 社長は全社員参加のピクニックを発表した。"}, {"num": "1378", "word": "culprit", "phonetic": "[kʌ́lprit]", "trans": "犯人, 罪人 [=criminal]", "ex_eng": "After a long police search, the culprit was apprehended.", "ex_trans": "警察による長期の捜索の末、犯人が逮捕された。"}, {"num": "1379", "word": "habitable", "phonetic": "[hǽbətəbl]", "trans": "居住に適した, 住むことのできる [= uninhabitable] (⇔uninhahitable)", "ex_eng": "In time, humans spread out from Africa to all the habitable parts of the Earth.", "ex_trans": "やがて人間はアフリカから地球のあらゆる居住に適した場所へと広がった。"}, {"num": "1380", "word": "humanlike", "phonetic": "[hjúːmənlàik]", "trans": "人間に似た, 人型の", "ex_eng": "Many mascots are humanlike animals that are associated with a particular area or sports team.", "ex_trans": "多くのマスコットは, 特定の地域やスポーツチームに関係する人間に似た動物だ。"}, {"num": "1381", "word": "innumerable", "phonetic": "[injúːmərəbl]", "trans": "数え切れない, 無数の [= countless]", "ex_eng": "Modern medicine has saved innumerable people from diseases that were once fatal.", "ex_trans": "現代医学は, かつては致死だった病気から数え切れない人を救ってきた。"}, {"num": "1382", "word": "involuntary", "phonetic": "[invά(:)ləntèri]", "trans": "不本意な, 不随意の (⇔voluntary)", "ex_eng": "Although the government claimed the farmers had moved of their own free will, the relocations were actually involuntary.", "ex_trans": "農民たちは自らの自由意志で引っ越したと政府は主張したが, 転居は実は不本意なものだった。"}, {"num": "1383", "word": "irrefutable", "phonetic": "[ìrɪfjúːtəbl]", "trans": "論駁できない", "ex_eng": "The prosecutor said that he would provide irrefutable evidence that the accused was guilty of the crime.", "ex_trans": "被告がその犯罪を犯した反論の余地のない証拠を示す, と検察官は言った。"}, {"num": "1384", "word": "itchy", "phonetic": "[ítʃi]", "trans": "かゆい", "ex_eng": "The little boy suffered from an itchy rash caused by an allergy.", "ex_trans": "その小さい男の子はアレルギーが原因でかゆい発疹が出た。"}, {"num": "1385", "word": "long-lasting", "phonetic": "[lɔ̀ŋlǽstɪŋ]", "trans": "長持ちする, 長続きする", "ex_eng": "Stone buildings are naturally much more long-lasting than ones made of wood.", "ex_trans": "石の建物は木製の建物より当然ずっと長持ちする。"}, {"num": "1386", "word": "measurable", "phonetic": "[méʒərəbl]", "trans": "はっきりわかる, 目に見えるほどの, 測定できる", "ex_eng": "The researchers found a measurable difference in the levels of air pollution in the area around the factory.", "ex_trans": "研究者たちは, 工場周辺地域の大気汚染レベルにはっきりとわかる違いがあることを発見した。"}, {"num": "1387", "word": "nebulous", "phonetic": "[nébjuləs]", "trans": "曖昧な, 漠然とした", "ex_eng": "Most people agree that the evidence for UFOs is too nebulous to be convincing.", "ex_trans": "UFOの証拠はあまりに曖昧で説得力がないという点でほとんどの人が一致している。"}, {"num": "1388", "word": "nomadic", "phonetic": "[noumǽdɪk]", "trans": "遊牧の, 遊牧民の", "ex_eng": "The anthropologist studied one of the nomadic tribes that lived in the Sahara Desert.", "ex_trans": "その人類学者はサハラ砂漠に住む遊牧部族の1つを調査した。"}, {"num": "1389", "word": "paradoxical", "phonetic": "[pæ̀rədɑ́(ː)ksikəl]", "trans": "逆説的な", "ex_eng": "The general safety of modern life has the paradoxical effect of increasing people's fear of violent crime.", "ex_trans": "現代生活の全般的安全には、暴力犯罪への人々の不安を増大させるという逆説的な効果がある。"}, {"num": "1390", "word": "rebellious", "phonetic": "[rɪbéljəs]", "trans": "反抗的な, 反乱の", "ex_eng": "Many children go through a rebellious phase when they become teenagers.", "ex_trans": "多くの子供は10代になると反抗期を経験する。"}, {"num": "1391", "word": "reductionist", "phonetic": "[rɪdʌ́kʃənɪst]", "trans": "還元主義的な", "ex_eng": "The scientist was opposed to reductionist accounts of consciousness that explained it in purely physical terms.", "ex_trans": "意識を純粋な物理学的な用語で説明する還元主義的な意識の記述にその科学者は反対だった。"}, {"num": "1392", "word": "reliant", "phonetic": "[rɪláɪənt]", "trans": "頼りにした (on, upon 〜を), 当てにした [=dependent]", "ex_eng": "The medical expert argued that people today have become too reliant on painkillers.", "ex_trans": "今の人々は鎮痛剤に頼りすぎるようになっている, とその医療専門家は主張した。"}, {"num": "1393", "word": "self-centered", "phonetic": "[sèlfšéntərd]", "trans": "自己本位の, 利己的な", "ex_eng": "Like many older people, he regarded the younger generation as spoiled and self-centered.", "ex_trans": "彼は多くの年配の人と同じように, 若い世代は甘やかされていて自己中心的だと考えていた。"}, {"num": "1394", "word": "self-employed", "phonetic": "[sèlfímplɔ́id]", "trans": "自営業の, 自営の", "ex_eng": "Self-employed people are often suspected of paying less tax than those who work for companies.", "ex_trans": "自営業の人たちは, 会社勤めの人たちより納税額が少ないのではないかとSばしば疑われる。"}, {"num": "1395", "word": "soggy", "phonetic": "[sá(::)gi]", "trans": "びしょぬれの, 水浸しの", "ex_eng": "The ground was soggy after the heavy rain, and she decided to wear boots to work.", "ex_trans": "大雨の後地面はぬかるんでいて, 彼女はブーツを履いて仕事に行くことにした。"}, {"num": "1396", "word": "subservient", "phonetic": "[səbsə́:rviənt]", "trans": "卑屈な, こびへつらう", "ex_eng": "He adopted a subservient attitude to his superiors and an arrogant one to those below him.", "ex_trans": "彼は上役たちには卑屈な態度を, 地位が下の人たちには尊大な態度を取った。"}, {"num": "1397", "word": "taxonomic", "phonetic": "[tæksənɑ́mɪk]", "trans": "分類学上の，分類の taxonomy 名 分類学", "ex_eng": "He was not interested in taxonomic questions such as the proper definition of a species.", "ex_trans": "彼は種の正式な定義といった分類学の疑問には関心がなかった。"}, {"num": "1398", "word": "unbiased", "phonetic": "[ʌnbάɪəst]", "trans": "偏見のない, 公平な [=impartial] (⇔biased)", "ex_eng": "It is important that the media report the news in an objective and unbiased way.", "ex_trans": "メディアは客観的で偏りのないようにニュースを伝えることが重要だ。"}, {"num": "1399", "word": "unproductive", "phonetic": "[ʌnprədʌ́ktɪv]", "trans": "非生産的な (⇔productive)", "ex_eng": "The meeting between the two sides was unproductive, and they broke up without reaching an agreement.", "ex_trans": "両者の会議は非生産的で, 合意に達しないまま解散した。"}, {"num": "1400", "word": "dense", "phonetic": "[dens]", "trans": "密集した [=closely packed] , (霧・雲などが) 濃い", "ex_eng": "It was difficult to get through the dense undergrowth.", "ex_trans": "低木の密集した場所を通り抜けるのは困難だった。"}, {"num": "1401", "word": "defame", "phonetic": "[diféim]", "trans": "の名誉を傷つける, を中傷する", "ex_eng": "The journalist was accused of defaming an honest businessman.", "ex_trans": "そのジャーナリストは, 誠実な実業家の名誉を傷つけたとして告訴された。"}, {"num": "1402", "word": "contemplate", "phonetic": "[kά(ə)ntəmplèit]", "trans": "を熟考する, 沈思黙考する", "ex_eng": "His heart sank as he contemplated the pile of work that lay on his desk.", "ex_trans": "机に積まれた仕事の山のことを考える と彼の気持ちは沈んだ。"}, {"num": "1403", "word": "adorn", "phonetic": "[ədɔ́ːrn]", "trans": "を飾る 〈with ～で〉", "ex_eng": "To welcome the soldiers home, the station was adorned with flags.", "ex_trans": "兵士の帰郷を歓迎するため, 駅は旗で飾られた。"}, {"num": "1404", "word": "deflect", "phonetic": "[dɪflékt]", "trans": "をそらす [＝divert], 外れる [＝swerve]", "ex_eng": "Sunglasses are designed to deflect UV rays of direct sunlight.", "ex_trans": "サングラスは直射日光の紫外線をそらすことを目的として作られている。"}, {"num": "1405", "word": "empathize", "phonetic": "[émpəθàɪz]", "trans": "共感する 〈with 〜に〉, 感情移入する [＝sympathize, identify]", "ex_eng": "Although he empathized with the protestors' feelings, he did not support them.", "ex_trans": "彼は抗議者たちの気持ちに共感したが, 支持はしなかった。"}, {"num": "1406", "word": "embezzle", "phonetic": "[imbézl]", "trans": "を横領する [=steal, misappropriate]", "ex_eng": "The banker was eventually sent to prison because he embezzled funds.", "ex_trans": "その銀行家は預金を横領したため, 結局は刑務所に入れられた。"}, {"num": "1407", "word": "impair", "phonetic": "[ɪmpéər]", "trans": "を損なう [=deteriorate, make worse]", "ex_eng": "His hearing was impaired from years of playing in a rock band.", "ex_trans": "彼の聴力は長年のロックバンドでの演奏活動によって損なわれた。"}, {"num": "1408", "word": "mar", "phonetic": "[mɑːr]", "trans": "を損なう [=damage, disfigure, spoil, impair]", "ex_eng": "Yesterday's tornado marred some of the fields in the countryside.", "ex_trans": "昨日の竜巻で,その地方の畑の一部が台無しになった。"}, {"num": "1409", "word": "pledge", "phonetic": "[pledʒ]", "trans": "を誓約する [=promise solemnly]", "ex_eng": "A medieval knight was required to pledge allegiance to his lord.", "ex_trans": "中世の騎士は領主に忠誠を誓うことを要求された。"}, {"num": "1410", "word": "assimilate", "phonetic": "[əsíməlèit]", "trans": "同化する 〈into 〜に〉 , を吸収する [=absorb]", "ex_eng": "Immigrant workers sometimes found it difficult to assimilate into society.", "ex_trans": "移民労働者たちは社会に同化するのが難しいと感じることもあった。"}, {"num": "1411", "word": "reap", "phonetic": "[ri:p]", "trans": "を刈り取る [=harvest]", "ex_eng": "The local farmers helped each other to reap the wheat.", "ex_trans": "その地方の農家は互いに助け合って小麦を刈り取った。"}, {"num": "1412", "word": "saturate", "phonetic": "[sǽtʃərèit]", "trans": "を飽和状態にする, を完全に浸す", "ex_eng": "The market for television sets is completely saturated in some countries.", "ex_trans": "テレビの市場が完全に飽和状態になっている国もある。"}, {"num": "1413", "word": "simulate", "phonetic": "[símjʊlèit]", "trans": "を模擬実験する, のふりをする [=counterfeit, feign, pretend]", "ex_eng": "At the army training camp, the soldiers must simulate a battle operation.", "ex_trans": "陸軍の訓練キャンプでは，兵士たちは戦闘の模擬演習をしなければならない。"}, {"num": "1414", "word": "amplify", "phonetic": "[æmplɪfὰɪ]", "trans": "を拡大する, を詳述する, を増幅する", "ex_eng": "He used his social media channels to amplify his message.", "ex_trans": "彼はメッセージを広めるため, ソーシャルメディアチャネルを用いた。"}, {"num": "1415", "word": "permeate", "phonetic": "[pʒ́ːrmíèit]", "trans": "に広まる [=pervade, spread through] , に浸透する [=penetrate]", "ex_eng": "Anxiety about the future had permeated every part of the company.", "ex_trans": "将来への不安が会社の至る所に広まっていた。"}, {"num": "1416", "word": "reside", "phonetic": "[rizáid]", "trans": "住む [=live]", "ex_eng": "After the couple retired, they resided in a small seaside town.", "ex_trans": "その夫婦は定年後, 小さな海辺の町に住んだ。"}, {"num": "1417", "word": "withhold", "phonetic": "[wíðhóuld]", "trans": "を与えない, を抑える [=keep back] , を差し控える", "ex_eng": "The government was accused of withholding information about the disease.", "ex_trans": "政府はその病気に関する情報を公開しないことを責められた。"}, {"num": "1418", "word": "shatter", "phonetic": "[ʃǽtər]", "trans": "を粉砕する [=break into pieces] , (健康などを)害する", "ex_eng": "The baseball shattered the huge picture window of a nearby house.", "ex_trans": "その野球のボールは近くの家の大きな見晴らし窓を粉々に割った。"}, {"num": "1419", "word": "diversify", "phonetic": "[daivə́ːrsəfài]", "trans": "を多様化する diversification 名", "ex_eng": "Many farmers diversify crops to hedge against unpredictable weather and climate.", "ex_trans": "多くの農家は予測のつかない天気と気候に対する自衛手段として，作物を多様化している。"}, {"num": "1420", "word": "capitulate", "phonetic": "[kəpítʃəlèɪt]", "trans": "屈服する 〔to ～に〕〔=yield, give in〕，降伏する 〔=surrender〕", "ex_eng": "The official threatened retribution if they did not capitulate to his demands.", "ex_trans": "その役人は，彼らが自分の要求に屈服しなければ報復すると脅した。"}, {"num": "1421", "word": "augment", "phonetic": "[ɔːgmɛ́nt]", "trans": "を増加させる 〔=increase〕，を大きくする 〔=enlarge〕", "ex_eng": "In order to augment my income, I work several part-time jobs.", "ex_trans": "収入を増やすために，私はパートの仕事をいくつかしている。"}, {"num": "1422", "word": "acclaim", "phonetic": "[əkléɪm]", "trans": "を称賛する 〔=praise highly〕", "ex_eng": "His films were acclaimed for their honesty and realism.", "ex_trans": "彼の映画は誠実さと写実性で高く評価された。"}, {"num": "1423", "word": "prosecute", "phonetic": "[prɑ́(:)sɪkjùːt]", "trans": "を起訴する，を告訴する prosecution 名", "ex_eng": "There was not enough evidence to prosecute the suspect.", "ex_trans": "容疑者を起訴する十分な証拠がなかった。"}, {"num": "1424", "word": "anoint", "phonetic": "[ənɔɪnt]", "trans": "に油を注いで聖別する, に塗油する", "ex_eng": "In a traditional ritual, the new king was anointed by a priest.", "ex_trans": "伝統的な儀式で, 新国王は司祭に油を注がれ聖別された。"}, {"num": "1425", "word": "lurk", "phonetic": "[lɜːrk]", "trans": "潜む [=hide, stay hidden] , 待ち伏せる [=lie in wait]", "ex_eng": "The scared child said that a monster was lurking under his bed.", "ex_trans": "おびえたその子は, ベッドの下に怪物が潜んでいると言った。"}, {"num": "1426", "word": "agitate", "phonetic": "[ˈædʒɪteɪt]", "trans": "を動揺させる [=perturb] , を扇動する [=stir up]", "ex_eng": "He was so agitated when his daughter failed to come home by 11:00 that he called the police.", "ex_trans": "娘が11時になっても帰宅しなかったので, 彼は動揺して警察に電話した。"}, {"num": "1427", "word": "accost", "phonetic": "[əkɔ́(:)st]", "trans": "(見知らぬ人に)声をかける, に近寄る [≒approach]", "ex_eng": "As he walked past, a homeless man accosted him for money.", "ex_trans": "彼が歩いて通りかかると, ホームレスの男が金をくれと彼に声をかけた。"}, {"num": "1428", "word": "bridle", "phonetic": "[bráidl]", "trans": "つん​と​怒る <at ～に>", "ex_eng": "The girl bridled at the suggestion she was envious of her friend's success.", "ex_trans": "友人の成功をねたん でいるのだろうとそれとなく言われたことに少女はつん と怒った。"}, {"num": "1429", "word": "tack", "phonetic": "[tæk]", "trans": "（従来と異なる）方針, 政策 ► change tack 方針を転換する", "ex_eng": "After the first clinical trial showed the ineffectiveness of the vaccine, the researchers took another tack.", "ex_trans": "最初の治験でそのワクチンが有効でないとわかった後, 研究者たちは別の方針を取った。"}, {"num": "1430", "word": "agility", "phonetic": "[ædʒílǝṭi]", "trans": "敏しょう性, 機敏さ [=nimbleness]", "ex_eng": "The old man showed surprising agility as he climbed the mountain.", "ex_trans": "老人はその山を登る際に驚くべき敏しょう性を見せた。"}, {"num": "1431", "word": "allure", "phonetic": "[ǝlúːr]", "trans": "魅力 [=attraction]", "ex_eng": "The young actress could not resist the allure of Hollywood.", "ex_trans": "その若い女優はハリウッドの魅力にあらがえなかった。"}, {"num": "1432", "word": "affinity", "phonetic": "[ǝfínǝṭi]", "trans": "親近感 〈for, with ～への〉, 相性 [=chemistry, rapport] , 類似性 [=similarity]", "ex_eng": "Although we had only met each other twice, we felt a great affinity for each other.", "ex_trans": "それまで2度しか会ったことがなかったが, 私たちはお互いに強い親近感を持った。"}, {"num": "1433", "word": "hype", "phonetic": "[haip]", "trans": "誇大宣伝 cf. hyperbole 誇張表現", "ex_eng": "He refused to believe all the hype about the new invention.", "ex_trans": "彼はずのその新発明に関する誇大宣伝をどれ一つ信じようとしなかった。"}, {"num": "1434", "word": "benchmark", "phonetic": "[béntʃmὰːrk]", "trans": "基準, 尺度 [=standard]", "ex_eng": "The program was said to have set a new benchmark for documentaries.", "ex_trans": "その番組はドキュメンタリー番組の新しい基準を定めたと言われた。"}, {"num": "1435", "word": "integration", "phonetic": "[ìntəɡréɪʃən]", "trans": "統合, 差別撤廃による人種統合 (⇔segregation)", "ex_eng": "Racial integration of schools was eventually mandated by the American government.", "ex_trans": "学校の人種統合は最終的にアメリカ政府により義務化された。"}, {"num": "1436", "word": "libel", "phonetic": "[láɪbəl]", "trans": "名誉毀損, 中傷", "ex_eng": "The tabloid went bankrupt because so many people won libel suits against it.", "ex_trans": "そのタブロイド紙は, とても多くの人が同紙に名誉毀損訴訟で勝訴したので破産した。"}, {"num": "1437", "word": "annotation", "phonetic": "[æ̀nətérʃən]", "trans": "注釈 [=footnote]", "ex_eng": "The scholar's annotations to the play were full of errors.", "ex_trans": "その学者がその戯曲に加えた注釈は間違いだらけだった。"}, {"num": "1438", "word": "asylum", "phonetic": "[əsáiləm]", "trans": "亡命，保護，避難所 [=shelter] ▶ be granted asylum 亡命を認められる", "ex_eng": "The refugees applied for political asylum as soon as they landed.", "ex_trans": "難民たちは上陸するとすぐに政治亡命を申請した。"}, {"num": "1439", "word": "efficacy", "phonetic": "[éfikəsi]", "trans": "効力, 有効性 [=effectiveness]", "ex_eng": "One must often doubt the efficacy of the United Nations in world governance.", "ex_trans": "世界の統治における国連の効力はしばしば疑問に付されなければならない。"}, {"num": "1440", "word": "acrimony", "phonetic": "[ǽkrəmòuni]", "trans": "とげとげしさ, 辛辣さ [=asperity]", "ex_eng": "The problems were finally resolved but not without some acrimony.", "ex_trans": "問題はやっと解決したが, いくらかとげとげしさがあった。"}, {"num": "1441", "word": "ordinance", "phonetic": "[ɔ́ːrdənəns]", "trans": "条例, 法令 [=regulation], 法令 [=statute]", "ex_eng": "A recent ordinance against smoking in public places has pleased many citizens.", "ex_trans": "公共の場所での喫煙を禁じる最近の条例が, 多くの市民を喜ばせている。"}, {"num": "1442", "word": "discrepancy", "phonetic": "[diskrépənsi]", "trans": "不一致 〈in ～での〉 [=disagreement, difference, inconsistency]", "ex_eng": "An auditor found a large discrepancy in the accounts of the bank's transactions.", "ex_trans": "会計検査官がその銀行の取引帳簿に大きな不一致を見つけた。"}, {"num": "1443", "word": "hazard", "phonetic": "[hǽzərd]", "trans": "危険", "ex_eng": "The dump site was deemed a health hazard to people in the community.", "ex_trans": "そのごみ投棄場は地域住民にとって健康上危険であると考えられていた。"}, {"num": "1444", "word": "predicament", "phonetic": "[pridíkəmənt]", "trans": "苦境", "ex_eng": "He was saved from his predicament by a loan from his father-in-law.", "ex_trans": "彼は義父からの融資によって苦境から救われた。"}, {"num": "1445", "word": "blunder", "phonetic": "[blʌ́ndər]", "trans": "重大なミス", "ex_eng": "The investigation blamed a series of blunders for the accident.", "ex_trans": "調査は一連の重大ミスがその事故の原因だとした。"}, {"num": "1446", "word": "rubble", "phonetic": "[rʌ́bl]", "trans": "がれき", "ex_eng": "Clearing away rubble after the accident was itself a huge task.", "ex_trans": "事故の後でがれきを片づけること自体が大変な仕事だった。"}, {"num": "1447", "word": "exodus", "phonetic": "[éksədəs]", "trans": "大量出国, 移住, (the Exodus) (イスラエル人の) エジプト脱出", "ex_eng": "During the civil war, there was a mass exodus of the villagers into neighboring countries.", "ex_trans": "内戦の間, 村人の近隣諸国への大量出国があった。"}, {"num": "1448", "word": "menace", "phonetic": "[ménəs]", "trans": "脅威 〈to 〜に対する〉 [=threat] 動 を脅す menacing 形", "ex_eng": "The politician said that young hooligans were becoming an increasing menace to society.", "ex_trans": "不良少年たちはますます社会に対する脅威になっている，とその政治家は述べた。"}, {"num": "1449", "word": "curfew", "phonetic": "[kə́ːrfjuː]", "trans": "夜間外出禁止令, 門限", "ex_eng": "The government imposed a curfew in an attempt to prevent further protests.", "ex_trans": "政府はそれ以上の抗議行動を防ぐべく夜間外出禁止令を敷いた。"}, {"num": "1450", "word": "cinch", "phonetic": "[síntʃ]", "trans": "簡単なこと", "ex_eng": "After the exam, he said it had been a cinch and he was sure that he had passed.", "ex_trans": "試験が終わると彼は, 試験は簡単だったし合格を確信していると言った。"}, {"num": "1451", "word": "depiction", "phonetic": "[dipíkʃən]", "trans": "描写 [=delineation] 語源 de (下に) + pict (描く) + ion (名詞語尾)", "ex_eng": "Some felt that the film's depiction of the queen was disrespectful.", "ex_trans": "その映画での女王の描写が失礼だと感じる人たちもいた。"}, {"num": "1452", "word": "ordeal", "phonetic": "[ɔːrdíːl]", "trans": "厳しい試練, 苦難", "ex_eng": "She found that giving evidence in the trial was a terrible ordeal.", "ex_trans": "裁判で証言するのは大変な試練だと彼女は感じた。"}, {"num": "1453", "word": "incidence", "phonetic": "[ínsidəns]", "trans": "発生率 [=degree of occurrence] , 影響の範囲 [=extent of influence]", "ex_eng": "Authorities were concerned about the increasing incidence of violent crime.", "ex_trans": "暴力犯罪の発生率が上昇していることを当局は憂慮していた。"}, {"num": "1454", "word": "pageant", "phonetic": "[pǽdʒənt]", "trans": "華麗な行列 [=splendid procession], 山車", "ex_eng": "Every year, a pageant is held to celebrate the town's history.", "ex_trans": "毎年, その町の歴史を祝うために華麗な行列が開催される。"}, {"num": "1455", "word": "parameter", "phonetic": "[pərǽmətər]", "trans": "限界 [=limit]", "ex_eng": "The budget imposed strict parameters on how much could be spent on the project.", "ex_trans": "予算はそのプロジェクトに使える金額に厳しい限界を課した。"}, {"num": "1456", "word": "cramp", "phonetic": "[krǽmp]", "trans": "けいれん, (～s) 生理痛", "ex_eng": "A cramp forced the star player out of the game at a crucial moment.", "ex_trans": "けいれんのため, そのスター選手は重大な時にやむを得ず試合を途中退場した。"}, {"num": "1457", "word": "limb", "phonetic": "[lím]", "trans": "手足 [=arm, leg]", "ex_eng": "The scientist studied the body and limbs of the new animal species.", "ex_trans": "その科学者は新しい動物種の胴体と手足を研究した。"}, {"num": "1458", "word": "dissolution", "phonetic": "[dɪsəlúːʃən]", "trans": "解体, 分解, (議会などの) 解散", "ex_eng": "The issue of slavery once threatened to cause the dissolution of the United States.", "ex_trans": "奴隷制度問題が原因で米国は解体の危機に瀕したことがある。"}, {"num": "1459", "word": "deference", "phonetic": "[défərəns]", "trans": "敬意, 服従", "ex_eng": "In Asia particularly, one is expected to treat the elderly with deference.", "ex_trans": "特にアジアでは, 高齢者を敬意を持って遇するのが当然だと考えられている。"}, {"num": "1460", "word": "advent", "phonetic": "[ǽdvènt]", "trans": "出現, 到来", "ex_eng": "The advent of television changed forever the way news was reported.", "ex_trans": "テレビの出現はニュースの報道方法を永遠に変えた。"}, {"num": "1461", "word": "dividend", "phonetic": "[dívidènd]", "trans": "(株の) 配当金", "ex_eng": "The shareholders waited patiently for the payment of their dividends at the end of the year.", "ex_trans": "株主たちは年末の配当金の支払いを辛抱強く待った。"}, {"num": "1462", "word": "connotation", "phonetic": "[kὰ(:)nətéɪʃən]", "trans": "言外の意味 [= hidden meaning] cf. denotation 明示的意味", "ex_eng": "Understanding the connotations of foreign words can be difficult.", "ex_trans": "外国語の単語の言外の意味を理解するのは難しいことがある。"}, {"num": "1463", "word": "ebb", "phonetic": "[eb]", "trans": "衰退, 減退, 引き潮", "ex_eng": "There was an ebb in the company's fortunes as new rivals appeared.", "ex_trans": "新たな競合相手が出現して, その企業の繁栄に衰えが見られた。"}, {"num": "1464", "word": "primate", "phonetic": "[práimeit]", "trans": "霊長類 [=highest class of animals, including man, apes, and monkeys]", "ex_eng": "Observation of human children reveals behavioral similarities to other primates.", "ex_trans": "人間の子供を観察すると, ほかの霊長類と行動が似ていることが明らかになる。"}, {"num": "1465", "word": "conspiracy", "phonetic": "[kənspírəsi]", "trans": "共謀 [=collusion] , 陰謀 [=plot]", "ex_eng": "The dissident was accused of organizing a conspiracy against the government.", "ex_trans": "その反体制活動家は, 政府に対する共謀を計画したとして告発された。 ain times of the year in Bali, tourists seem to be ubiquitous.", "ex_trans": "バリ島では毎年ある時期になると観光客が至る所にいるように見える。"}, {"num": "1475", "word": "covert", "phonetic": "[kóʊvərt]", "trans": "内密の [=hidden, concealed, disguised] (⇔overt)", "ex_eng": "The covert activities of the CIA have been roundly condemned.", "ex_trans": "CIAの秘密活動は厳しく非難されている。"}, {"num": "1476", "word": "clandestine", "phonetic": "[klændéstin]", "trans": "秘密の [=secret, hidden], 人目をはばかる [=underhand]", "ex_eng": "Their meetings always had to be clandestine and brief.", "ex_trans": "彼らが会うときにはいつも内密かつ手短でなくてはならなかった。"}, {"num": "1477", "word": "austere", "phonetic": "[ɔ́ːstfər]", "trans": "厳しい [=stern, severe, rigid, harsh]", "ex_eng": "His austere expression and manner belied the kindness underneath.", "ex_trans": "厳しい表情と態度とは裏腹に、彼は根は親切だった。"}, {"num": "1478", "word": "exquisite", "phonetic": "[íksskwízɪt]", "trans": "この上なく見事な, とても優美な [=refined]", "ex_eng": "The lady's spring dress is of exquisite design and quality.", "ex_trans": "その婦人の春のドレスはこの上なく見事なデザインと品質だ。"}, {"num": "1479", "word": "affluent", "phonetic": "[ǽflùənt]", "trans": "裕福な [=rich, opulent] , 豊富な [=ample, abundant]", "ex_eng": "As a population grows more affluent, it naturally begins to buy more luxury goods.", "ex_trans": "人々がより裕福になれば、よりぜいたくな商品を買い始めるのは当然だ。"}, {"num": "1480", "word": "ambivalent", "phonetic": "[æmbɪ́vələnt]", "trans": "相反する感情を持った <about, toward ～に>, 曖昧な [=uncertain]", "ex_eng": "He felt ambivalent about his promotion because it would involve more work.", "ex_trans": "昇進すると仕事が増えるので、彼は昇進には相反する気持ちを抱いていた。"}, {"num": "1481", "word": "adept", "phonetic": "[ədépt]", "trans": "熟練した 〈at, in 〜に〉 adeptly 副 adeptness 名", "ex_eng": "Because the spokesperson was adept at handling difficult questions, he was able to answer smoothly.", "ex_trans": "その広報担当官は難しい質問の処理に長けていたので，よどみなく答えることができた。"}, {"num": "1482", "word": "belligerent", "phonetic": "[bəlídʒərənt]", "trans": "けんか腰の, 好戦的な [=quarrelsome] , 交戦中の", "ex_eng": "The tone of his voice sounded unnecessarily belligerent given the circumstances.", "ex_trans": "状況から考えて, 彼の声のトーンは不必要にけんか腰に聞こえた。"}, {"num": "1483", "word": "aloof", "phonetic": "[əlúːf]", "trans": "よそよそしい, 冷淡な [=distant, remote]", "ex_eng": "Some of his colleagues resented his aloof attitude towards them.", "ex_trans": "同僚の中には, 自分たちに対する彼のよそよそしい態度に腹を立てる者もいた。"}, {"num": "1484", "word": "endemic", "phonetic": "[endémik]", "trans": "特有の", "ex_eng": "The government was plagued with the endemic corruption in its bureaucracy.", "ex_trans": "政府は官僚制に特有の腐敗に悩んでいた。"}, {"num": "1485", "word": "pervasive", "phonetic": "[pərˈvéisiv]", "trans": "まん延した, 隅々に広がった", "ex_eng": "Amid the pervasive gloom, the news of the royal wedding was very welcome.", "ex_trans": "まん延する沈滞感の中で, ロイヤルウェディングのニュースはとても喜ばしいものだった。"}, {"num": "1486", "word": "diffident", "phonetic": "[dífidənt]", "trans": "自信のない [=bashful, hesitant, timid] (⇔confident)", "ex_eng": "He always seemed so diffident, so his speech was all the more impressive.", "ex_trans": "彼はいつもとても自信なさげに見えたので, 彼のスピーチはなおさら強い感銘を与えた。"}, {"num": "1487", "word": "dilapidated", "phonetic": "[dilǽpidèitid]", "trans": "荒廃した [=tumbledown]", "ex_eng": "The valuable papers were found in a dilapidated hut in the garden.", "ex_trans": "その貴重な書類は庭の荒れ果てた小屋で見つかった。"}, {"num": "1488", "word": "pristine", "phonetic": "[prístiːn]", "trans": "汚されていない [=immaculate] , 初期の", "ex_eng": "Just walking on the pristine white carpet made him feel uncomfortable.", "ex_trans": "汚れのない白いじゅうたんの上を歩くだけで, 彼は落ち着かない気持ちだった。"}, {"num": "1489", "word": "fiscal", "phonetic": "[fískəl]", "trans": "財政の [=financial] , 国庫の", "ex_eng": "Leaders of many nations in the world ignore their fiscal responsibilities.", "ex_trans": "世界の多くの国の指導者は財政上の責任を無視している。"}, {"num": "1490", "word": "auspicious", "phonetic": "[ɔːspíʃəs]", "trans": "幸先のよい，縁起のよい [= fortunate, propitious] auspice 名 吉兆", "ex_eng": "His first match was an auspicious start for the spring tournament.", "ex_trans": "彼の初日の試合は，春のトーナメントでの幸先のよいスタートとなった。"}, {"num": "1491", "word": ": "[ɪnkʌ́lkèɪt]", "trans": "を教え込む <into 〜に> [=instill]", "ex_eng": "The teacher inculcated patriotism into his students.", "ex_trans": "その先生は生徒たちに愛国心を教え込んだ。"}, {"num": "1517", "word": "galvanize", "phonetic": "[gǽlvənàɪz]", "trans": "を活気づける [=stir, rouse] , を刺激する [=stimulate] , に電流を流す", "ex_eng": "The president's speech was intended to galvanize his public support.", "ex_trans": "大統領の演説は大衆の彼に対する支持を活気づける目的があった。"}, {"num": "1518", "word": "garner", "phonetic": "[gɑ́rnər]", "trans": "を得る, を集める [=gather]", "ex_eng": "In an attempt to garner support, the mayor held a town meeting.", "ex_trans": "市長は支持を得ようとして市民集会を開いた。"}, {"num": "1519", "word": "flaunt", "phonetic": "[flɔ́ːnt]", "trans": "を誇示する [=show off (proudly), display ostentatiously]", "ex_eng": "People who like to flaunt their wealth are lacking in refinement.", "ex_trans": "富を誇示したがる人々は品に欠ける。"}, {"num": "1520", "word": "forfeit", "phonetic": "[fɔ́ːrfɪt]", "trans": "を失う，を没収される", "ex_eng": "If we cannot afford to complete the deal now, we may forfeit our investment.", "ex_trans": "今取引を完了することができなければ，われわれは投資金を失うかもしれない。"}, {"num": "1521", "word": "loophole", "phonetic": "[lúːphòul]", "trans": "抜け穴 〈in 法律などの〉", "ex_eng": "He used a loophole in the law to avoid paying taxes.", "ex_trans": "彼は納税を逃れるために法律の抜け穴を利用した。"}, {"num": "1522", "word": "compunction", "phonetic": "[kəmpʌ́ŋkʃən]", "trans": "後ろめたさ 〈about ～についての〉 ［＝scruple］, 良心の呵責 ［＝twinge of conscience］", "ex_eng": "He was badly treated and felt no compunction about quitting the job.", "ex_trans": "彼はひどい待遇を受けたので, 仕事を辞めることに何の後ろめたさも感じなかった。"}, {"num": "1523", "word": "compliance", "phonetic": "[kəmpláiəns]", "trans": "順守 〈with ～の〉 ［＝observance］, comply , ►in compliance with ～ ～に従って", "ex_eng": "The judge demanded the company's immediate compliance with his decision.", "ex_trans": "裁判官は彼の下した判決を会社が直ちに順守することを要求した。"}, {"num": "1524", "word": "boon", "phonetic": "[buːn]", "trans": "恩恵 〈to, for ～にとっての〉 ［＝benefit, blessing, favor］", "ex_eng": "We considered the splendid harvest x_eng": "The atomic bomb was developed by splitting the nucleus of an atom.", "ex_trans": "原子爆弾は原子核を分裂させることによって開発された。"}, {"num": "1534", "word": "proposition", "phonetic": "[prὰpəzɪ́ʃən]", "trans": "提案, 計画 [=plan, scheme], 命題", "ex_eng": "My friend said that he had a business proposition for me.", "ex_trans": "私に対する仕事の提案があると友人は言った。"}, {"num": "1535", "word": "icon", "phonetic": "[áikɑ(ː)n]", "trans": "崇拝の対象 [=idol], 図形, 記号", "ex_eng": "His opposition to nuclear power made him an icon for environmentalists.", "ex_trans": "原子力反対の姿勢が彼を環境保護論者の崇拝の対象にした。"}, {"num": "1536", "word": "charade", "phonetic": "[ʃəréid]", "trans": "見え透いたごまかし", "ex_eng": "He denounced the investigation as a charade aimed at appeasing the public.", "ex_trans": "その調査は大衆をなだめることが目的の見え透いたごまかしだ, と彼は非難した。"}, {"num": "1537", "word": "catastrophe", "phonetic": "[kətǽstrəfi]", "trans": "災難, 大災害", "ex_eng": "The fire was a terrible catastrophe for the victims' families.", "ex_trans": "その火事は犠牲者の家族にとって大変な災難だった。"}, {"num": "1538", "word": "calamity", "phonetic": "[kəléəməṭi]", "trans": "災難, 不運", "ex_eng": "The typhoon was a major calamity to businesses in the area.", "ex_trans": "台風はその地域の企業にとって大きな災難だった。"}, {"num": "1539", "word": "expulsion", "phonetic": "[ikspʌ́lʃən]", "trans": "追放, 除名", "ex_eng": "His activities as a spy resulted in his expulsion from the country.", "ex_trans": "彼はスパイとして活動したことで結局国から追放された。"}, {"num": "1540", "word": "extermination", "phonetic": "[ɪkstə̀ːrmənéɪʃən]", "trans": "駆除，根絶 [= eradication] exterminate 動", "ex_eng": "They brought in specialists for the extermination of the rats that had infested the house.", "ex_trans": "彼らは，家にはびこったネズミの駆除のために専門家に来てもらった。"}, {"num": "1541", "word": "legitimacy", "phonetic": "[lidʒɪ́təməsi]", "trans": "正当性, 合法性", "ex_eng": "Questions were raised concerning the legitimacy of the decision to attack the enemy forces.", "ex_trans": "敵軍を攻撃する決定の正当性に関して疑問の声が上がった。"}, {"num": "1542", "word": "condemnation", "phonetic": "[kɑ̀(ː)ndemnéɪʃən]", "trans": "激しい非難 [= censure] , 有罪宣告 [= conviction]", "ex_eng": "The religious leader expressed his immediate condemnation of the military's actions.", "ex_trans": "その宗教指導者は, 軍の行動に対して即時の非難を表明した。"}, {"num": "1543", "word": "retaliation", "phonetic": "[rɪtæ̀liéiʃən]", "trans": "報復 〈for 行為に対する〉 [= revenge]", "ex_eng": "The enemy stormed our base in retaliation for our earlier raid at their fort.", "ex_trans": "われわれが以前行った敵のとりでへの襲撃に対する報復として, 敵はわれわれの基地を急襲した。"}, {"num": "1544", "word": "discontent", "phonetic": "[dɪskəntént]", "trans": "不満 〈at, with, over 〜に対する〉 [= dissatisfaction]", "ex_eng": "There was growing discontent among the employees with the company's cost-cutting policies.", "ex_trans": "会社のコスト削減策に対する不満が社員の間で高まっていた。"}, {"num": "1545", "word": "demolition", "phonetic": "[dèməlɪ́ʃən]", "trans": "取り壊し, 解体 [=destruction] (⇔construction)", "ex_eng": "Many people protested against the demolition of the old courthouse.", "ex_trans": "多くの人が古い裁判所の取り壊しに抗議した。"}, {"num": "1546", "word": "detriment", "phonetic": "[détri̩mənt]", "trans": "害になるもの 〈to ～に〉, 損失 [=loss, damage]", "ex_eng": "We viewed the US Secretary of State's actions as a major detriment to world peace.", "ex_trans": "われわれは米国務長官の活動を世界平和にとって大きな害になるものと見なした。"}, {"num": "1547", "word": "solidarity", "phonetic": "[sὰlədɛrəṭi]", "trans": "団結 [=unity]", "ex_eng": "The leaders often call for solidarity in times of national crisis.", "ex_trans": "国家が危機の際は, 指導者はしばしば団結を呼びかける。"}, {"num": "1548", "word": "monarch", "phonetic": "[mάnɑːrk]", "trans": "(世襲的) 君主 [=king, queen]", "ex_eng": "A monarch usually gains his or her power by virtue of his or her lineage.", "ex_trans": "君主はたいてい家系のおかげで権力を得る。"}, {"num": "1549", "word": "blemish", "phonetic": "[blémiʃ]", "trans": "汚点 [=flaw, defect], 染み [=stain]", "ex_eng": "The only blemish on his record was a conviction for dangerous driving when he was a student.", "ex_trans": "彼の経歴の唯一の汚点は, 学生時代に危険運転で有罪判決を受けたことだった。"}, {"num": "1550", "word": "brink", "phonetic": "[brɪŋk]", "trans": "(破滅の)瀬戸際, (絶壁などの)縁, 端", "ex_eng": "The economy was hovering on the brink of a recession.", "ex_trans": "経済は不況寸前のところで低迷していた。"}, {"num": "1551", "word": "dynasty", "phonetic": "[dáməsti]", "trans": "王朝", "ex_eng": "The Romanov dynasty came to an end with the Russian communist", "ex_trans": "ロマノフ王朝はロシア共産革命で終焉を迎えた。"}, {"num": "1552", "word": "tyranny", "phonetic": "[tírəni]", "trans": "専制政治", "ex_eng": "The students helped overthrow the dictator, and his reign of tyranny came to an end.", "ex_trans": "学生たちは独裁者を打倒するのに協力し, 彼の専制支配は終結した。"}, {"num": "1553", "word": "decoy", "phonetic": "[díːkɔɪ]", "trans": "おとり", "ex_eng": "The first brigade that advanced to the east was merely a decoy for the real attack.", "ex_trans": "東へ進軍した第1旅団は, 本格攻撃に向けたおとりにすぎなかった。"}, {"num": "1554", "word": "segregation", "phonetic": "[sèɡrɪɡéɪʃən]", "trans": "隔離, 人種差別", "ex_eng": "Racial segregation in the American South continued long after the Civil War.", "ex_trans": "アメリカ南部の人種隔離は南北戦争後も長く続いた。"}, {"num": "1555", "word": "diatribe", "phonetic": "[dáiətràib]", "trans": "痛烈な皮肉 〈against ～への〉", "ex_eng": "The doctor delivered a diatribe against the dangers of smoking.", "ex_trans": "その医者は喫煙の危険性に関する痛烈な皮肉を述べた。"}, {"num": "1556", "word": "gadget", "phonetic": "[gǽdʒit]", "trans": "機器 [=appliance]", "ex_eng": "The young man's room was full of IT gadgets.", "ex_trans": "その若者の部屋はIT機器でいっぱいだった。"}, {"num": "1557", "word": "fiasco", "phonetic": "[fiǽskou]", "trans": "大失敗 [=blunder, total or ridiculous failure]", "ex_eng": "Our expedition to the Himalayas was a complete fiasco.", "ex_trans": "われわれのヒマラヤ遠征は完全な大失敗だった。"}, {"num": "1558", "word": "prone", "phonetic": "[proun]", "trans": "傾向がある 〈to do ～する〉 [=liable], うつ伏せの [=prostrate] (⇔supine)", "ex_eng": "I am afraid he is prone to change his mind without prior notice.", "ex_trans": "彼は予告なしに考えを変える傾向があると思う。"}, {"num": "1559", "word": "bleak", "phonetic": "[bli:k]", "trans": "(見通しなどが) 暗い, 荒涼とした [=desolate, dreary]", "ex_eng": "The recent economic signs indicate bleak prospects for the near future.", "ex_trans": "最近の経済の兆候は, 近い将来の暗い展望を示している。"}, {"num": "1560", "word": "perennial", "phonetic": "[pəréniəl]", "trans": "永遠の, 永続する [=enduring, everlasting], 多年生の 多年生植物", "ex_eng": "The Christmas pantomime of Sleeping Beauty is a perennial favorite with British children.", "ex_trans": "クリスマスの無言劇『眠れる森の美女』は, イギリスの子供たちの永遠のお気に入りである。"}, {"num": "1561", "word": "imperative", "phonetic": "[impérətiv]", "trans": "絶対に必要な, 緊急の [=urgent], 命令的な, 強制的な [=peremptory]", "ex_eng": "Immediate action is imperative to prevent an AIDS epidemic in the country.", "ex_trans": "その国のエイズまん延を防ぐために, 直ちに行動を取ることが絶対に必要なだ。"}, {"num": "1562", "word": "inanimate", "phonetic": "[inǽnimət]", "trans": "生命のない [=lifeless] (⇔animate) inanimate eyes 生気のない目", "ex_eng": "The girl sat without moving, like an inanimate object.", "ex_trans": "その少女は生命のない物体のようにじっと座っていた。"}, {"num": "1563", "word": "decrepit", "phonetic": "[dɪkrépɪt]", "trans": "老いぼれた, 使い古した", "ex_eng": "A decrepit old man clung to the pole as the train lurched forward.", "ex_trans": "列車が突然前方へ揺れて, 1人のよぼよぼの老人が手すりにしがみついた。"}, {"num": "1564", "word": "receptive", "phonetic": "[rɪséptɪv]", "trans": "受け入れやすい, 感受性のある", "ex_eng": "The chairperson said that they would always be receptive to constructive proposals for improvement.", "ex_trans": "改善に向けての建設的提案はいつでも受け入れるつもりだ, と社長は語った。"}, {"num": "1565", "word": "copious", "phonetic": "[kóʊpiəs]", "trans": "多量の, 豊富な", "ex_eng": "We came to the party anticipating copious amounts of food and beverages.", "ex_trans": "私たちは大量の食べ物と飲み物を期待してパーティーに来た。"}, {"num": "1566", "word": "intimate", "phonetic": "[ínṭəmət]", "trans": "個人的な, 私事の, 親密な", "ex_eng": "She was furious that intimate details of her private life had been made public.", "ex_trans": "自分の私生活に関する個人的詳細が公にされて, 彼女は激怒した。"}, {"num": "1567", "word": "capricious", "phonetic": "[kəpríʃəs]", "trans": "気まぐれな [=changeable, whimsical] caprice 名", "ex_eng": "The young girl's capricious nature has baffled all her friends.", "ex_trans": "その若い女の子の気まぐれな性格は友人全員を困らせてきた。"}, {"num": "1568", "word": "confrontational", "phonetic": "[kɑ̀(ɔ́)nfrʌntéiʃənəl]", "trans": "対決する覚悟の [=defiant]", "ex_eng": "The politician lost many supporters because of his confrontational attitude.", "ex_trans": "その政治家は挑戦的な態度のせいで多くの支持者を失った。"}, {"num": "1569", "word": "stern", "phonetic": "[stə́ːrn]", "trans": "厳しい [=strict, severe, harsh]", "ex_eng": "We stopped insisting on our point when the boss gave us a stern look.", "ex_trans": "上司に厳しい顔を向けられて, 私たちは主張に固執するのをやめた。"}, {"num": "1570", "word": "coarse", "phonetic": "[kɔ́ːrs]", "trans": "（きめ・粒などが）粗い [=rough, harsh] , 下品な [=vulgar, indelicate, crude]", "ex_eng": "The shirt looked beautiful, but its coarse fabric made it uncomfortable.", "ex_trans": "そのシャツは見た目は美しかったが, 生地が粗いので着心地が悪かった。"}, {"num": "1571", "word": "obscure", "phonetic": "[əbskjúər]", "trans": "曖昧な [=unclear] , 無名の", "ex_eng": "His remarks were so obscure that few people understood them.", "ex_trans": "彼の発言はとても曖昧だったので, ほとんどの人は理解しなかった。"}, {"num": "1572", "word": "sterile", "phonetic": "stérəl", "trans": "殺菌した, 不毛の, 無益な", "ex_eng": "It is extremely important to use sterile bandages when treating a wound.", "ex_trans": "けがを治療するときは殺菌した包帯を使うことが非常に重要である。"}, {"num": "1573", "word": "stationary", "phonetic": "[stéiʃjənèri]", "trans": "静止した, 定住の", "ex_eng": "Please wait until the train is stationary before getting off.", "ex_trans": "電車が停止するまで待ってから下車してください。"}, {"num": "1574", "word": "countless", "phonetic": "[káuntləs]", "trans": "無数の", "ex_eng": "As he looked up at the countless stars, he felt very small indeed.", "ex_trans": "彼は無数の星を見上げたとき, 自分自身を本当に小さく感じた。"}, {"num": "1575", "word": "commonplace", "phonetic": "[kά(ː)mənplèis]", "trans": "平凡な", "ex_eng": "Although a brilliant researcher, he was a commonplace lecturer.", "ex_trans": "彼は優れた研究者だが平凡な講演者だった。"}, {"num": "1576", "word": "mediocre", "phonetic": "[mìːdióukər]", "trans": "よくも悪くもない, 並の", "ex_eng": "His latest movie is mediocre at best.", "ex_trans": "彼の最新の映画はせいぜい可もなく不可もなくである。"}, {"num": "1577", "word": "opaque", "phonetic": "[oupéik]", "trans": "不透明の（⇔transparent），くすんだ [=dingy, somber]", "ex_eng": "Transparent emeralds are much higher in value than opaque ones.", "ex_trans": "透明なエメラルドの方が不透明なものよりずっと価値が高い。"}, {"num": "1578", "word": "disciplinary", "phonetic": "[dísəplənèri]", "trans": "懲戒の, 規則上の", "ex_eng": "The army decided to begin disciplinary proceedings against him.", "ex_trans": "軍は彼に対して懲戒手続きを始めることを決定した。"}, {"num": "1579", "word": "bereaved", "phonetic": "[birí:vd]", "trans": "(死によって近親などを) 奪われた", "ex_eng": "He tried to comfort his bereaved friend who was saddened by the loss of her elderly mother.", "ex_trans": "彼は, 高齢の母親を亡くして悲しむ親に先立たれた友人を慰めようとした。"}, {"num": "1580", "word": "derelict", "phonetic": "[dérəlikt]", "trans": "遺棄された", "ex_eng": "The derelict houses were demolished to make way for a new park.", "ex_trans": "遺棄された家屋は, 新しい公園用地にするために取り壊された。"}, {"num": "1581", "word": "cohesive", "phonetic": "[kouhí:siv]", "trans": "結束した, 団結した, 密着した", "ex_eng": "The immigrants formed a close, cohesive community.", "ex_trans": "移民たちは密接で結束力のある地域社会を形成した。"}, {"num": "1582", "word": "carnivorous", "phonetic": "[kɑːrnívərəs]", "trans": "肉食の", "ex_eng": "Carnivorous animals like cats need meat in their diet to survive.", "ex_trans": "猫のような肉食動物は, 生きていくためには食事に肉が必要だ。"}, {"num": "1583", "word": "prolonged", "phonetic": "[prɑlɔ́(ː)ŋd]", "trans": "長引く", "ex_eng": "After a prolonged pause, the lecturer began to speak again.", "ex_trans": "長い間の後, 講師は再び話し始めた。"}, {"num": "1584", "word": "exempt", "phonetic": "[ɪgzémpt]", "trans": "免除された", "ex_eng": "Businesses that meet certain requirements are exempt from paying local taxes.", "ex_trans": "一定の要件を満たす事業者は地方税の支払いを免除される。"}, {"num": "1585", "word": "deferential", "phonetic": "[dèfərénʃəl]", "trans": "敬意を表する", "ex_eng": "The younger scientist took a deferential attitude to the professor.", "ex_trans": "その若手科学者は教授に敬意を表する態度で接した。"}, {"num": "1586", "word": "despondent", "phonetic": "[dispά(ɔ̀)ndənt]", "trans": "落胆した [=dejected]", "ex_eng": "Despondent and sullen, she finally realized she needed psychiatric help.", "ex_trans": "彼女は落胆してふさぎ込んでいたが、ようやく精神医学の助けが必要だと気付いた。"}, {"num": "1587", "word": "incremental", "phonetic": "[ìnkrəmέntəl]", "trans": "だんだん増える, 増加する [=increasing]", "ex_eng": "He agreed to make incremental payments on the loan.", "ex_trans": "彼は段階的に増加するローンの支払いに同意した。"}, {"num": "1588", "word": "cumulative", "phonetic": "[kjúːmjuləṭiv]", "trans": "累積する [=accumulating]", "ex_eng": "The cumulative effect of the rainfall weakened the soil and caused many landslides.", "ex_trans": "降雨の蓄積作用で土壌が弱くなり, 多くの地滑りを引き起こした。"}, {"num": "1589", "word": "superficial", "phonetic": "[sùːpərfíʃəl]", "trans": "表面的な", "ex_eng": "The newspaper's report was criticized as superficial and misleading.", "ex_trans": "その新聞の報道は表面的で誤解を招くものだと非難された。"}, {"num": "1590", "word": "murky", "phonetic": "[mə́ːrki]", "trans": "うさん臭い [= suspicious] ，暗い [= dark] ▶ murky activities うさん臭い活動", "ex_eng": "The investor was said to have a murky past in the construction business.", "ex_trans": "その投資家は建設業でうさん臭い過去があると言われていた。"}, {"num": "1591", "word": "cerebral", "phonetic": "[sérəbrəl]", "trans": "理知的な, (大)脳の", "ex_eng": "His approach to people is more cerebral than sympathetic.", "ex_trans": "彼が人々に接する態度は, 感情に訴えるというより理性に訴えるものである。"}, {"num": "1592", "word": "culpable", "phonetic": "[kʌ́lpəbl]", "trans": "有罪の [=guilty] , 非難に値する [=blameworthy] (⇔inculpable)", "ex_eng": "After a long trial, the jury determined that the defendant was culpable.", "ex_trans": "長い審理の後, 被告は有罪であると陪審団は裁決した。"}, {"num": "1593", "word": "demure", "phonetic": "[dɪmjúər]", "trans": "(特に女性が) 控えめな, しとやかな [=modest]", "ex_eng": "It was hard to believe that the demure young woman before them was on trial for murder.", "ex_trans": "彼らの前にいる控えめな若い女性が殺人容疑で公判中だとは信じ難かった。"}, {"num": "1594", "word": "sleek", "phonetic": "[slíːk]", "trans": "滑らかでつやつやした [=smooth and glossy] , 人当たりのよい", "ex_eng": "He brushed the cat's fur until it looked sleek and tidy.", "ex_trans": "彼は猫の毛をつやつやしてこぎれいになるまでブラッシングした。"}, {"num": "1595", "word": "exuberant", "phonetic": "[ɪgzjúːbərənt]", "trans": "生気あふれる, 熱狂的な [=fervent, enthusiastic]", "ex_eng": "Her exuberant and passionate acting debut won her wide acclaim.", "ex_trans": "彼女の生気あふれる情熱的な俳優デビューは広く称賛を博した。"}, {"num": "1596", "word": "frenetic", "phonetic": "[frənétɪk]", "trans": "熱狂した [=frantic, frenzied, rapturous]", "ex_eng": "With his rural background, he found it hard to adjust to the frenetic pace of the city.", "ex_trans": "彼は地方出身で, 都会の熱狂したようなペースに適応するのに困難を覚えた。"}, {"num": "1597", "word": "fraudulent", "phonetic": "[frɔ́ːdʒələnt]", "trans": "詐欺的な [=dishonest, deceitful]", "ex_eng": "When I suspected his dealings were fraudulent, I cut off all negotiations.", "ex_trans": "彼の取引は詐欺的だと疑い, 私はすべての交渉を打ち切った。"}, {"num": "1598", "word": "full-fledged", "phonetic": "[fúlflédʒd]", "trans": "本格的な, 羽が生えそろった, 一人前の", "ex_eng": "The general decided to launch a full-fledged attack on the town.", "ex_trans": "将軍は市街地に本格的な攻撃を仕掛けることを決定した。"}, {"num": "1599", "word": "drastically", "phonetic": "[drǽstɪkəli]", "trans": "思い切って, 徹底的に", "ex_eng": "The company drastically reduced the executives' expense allowances.", "ex_trans": "その会社は幹部の交際費を思い切って削減した。"}, {"num": "1600", "word": "disproportionately", "phonetic": "[dɪsprəpɔ́ːrʃənətli]", "trans": "過度に, 不釣り合いに", "ex_eng": "Many said the punishment inflicted on him, compared to that of other offenders, was disproportionately severe.", "ex_trans": "多くの人は, 彼に与えられた罰はほかの犯罪者の罰と比べて過度に厳しいと言った。"}, {"num": "1601", "word": "inaugurate", "phonetic": "[ɪnɔ́ːɡjərèɪt]", "trans": "を（正式に）開始する", "ex_eng": "The prime minister announced that he would inaugurate a new policy on education.", "ex_trans": "首相は教育に関する新政策を正式に開始すると発表した。"}, {"num": "1602", "word": "rectify", "phonetic": "[réktəfὰɪ]", "trans": "を修正する [=amend, redress]", "ex_eng": "By the time the mistake was discovered, it was too late to rectify the official report.", "ex_trans": "その誤りが発見された時点では、公式報告書を修正するには手遅れだった。"}, {"num": "1603", "word": "implore", "phonetic": "[ɪmplɔ́ːr]", "trans": "に懇願する <to do ~するように> [=beg, entreat]", "ex_eng": "The students implored the teachers to make the examination easier.", "ex_trans": "生徒たちは試験をもっと易しくするよう教師たちに懇願した。"}, {"num": "1604", "word": "muster", "phonetic": "[mʌ́stər]", "trans": "を集める [=assemble] , を奮い起こす [=gather]", "ex_eng": "The general mustered all the forces for an early-morning attack.", "ex_trans": "将軍は早朝の攻撃に向けて全軍を集めた。"}, {"num": "1605", "word": "recuperate", "phonetic": "[rìkjúːpərèit]", "trans": "回復する", "ex_eng": "It took the driver six months to recuperate from his accident.", "ex_trans": "その運転手が事故から回復するのに半年かかった。"}, {"num": "1606", "word": "validate", "phonetic": "[válidèit]", "trans": "を認可する , を認証する", "ex_eng": "The degrees given at the local art school are validated by a major university.", "ex_trans": "その地方の美術学校で与えられる学位は一流大学によって認可される。"}, {"num": "1607", "word": "mollify", "phonetic": "[mάl(ə)fài]", "trans": "(怒りなどを) を和らげる", "ex_eng": "Nothing I said could mollify the anger of the boss.", "ex_trans": "私が何を言っても, 上司の怒りを和らげることはできなかった。"}, {"num": "1608", "word": "modulate", "phonetic": "[mάdʒulèit]", "trans": "(声の) 調子 [高さ] を変える", "ex_eng": "That singer's voice coach advised him to modulate his voice more when singing.", "ex_trans": "その歌手のボイストレーナーは, 歌うときにはもっと声の調子を変えるよう彼に助言した。"}, {"num": "1609", "word": "subjugate", "phonetic": "[sʌ́bdʒʊgèɪt]", "trans": "を征服する , を隷属させる", "ex_eng": "Countries with power often subjugated weaker countries.", "ex_trans": "力のある国はしばしば自分より弱い国を征服した。"}, {"num": "1610", "word": "torment", "phonetic": "[tɔːrmént]", "trans": "をひどく苦しめる [=afflict] , を悩ます [=distress]", "ex_eng": "The school bully delighted in tormenting the younger boys.", "ex_trans": "学校のいじめっ子は, 年下の男の子たちを苦しめて喜んでいた。"}, {"num": "1611", "word": "rebuff", "phonetic": "[rìbʌ́f]", "trans": "を拒絶する [=reject]", "ex_eng": "She rebuffed all his advances, insisting she was not interested in him.", "ex_trans": "彼女は彼に興味がないと言い切って, 彼がいくら言い寄っても拒絶した。"}, {"num": "1612", "word": "reprimand", "phonetic": "[réprimànd]", "trans": "を叱責する ", "phonetic": "[prəkdʒúər]", "trans": "を入手する, を調達する [=obtain, secure]", "ex_eng": "I was lucky to procure a ticket to the sold-out concert.", "ex_trans": "私はその全席完売のコンサートのチケットを入手することができて幸運だった。"}, {"num": "1622", "word": "scrawl", "phonetic": "[skrɔːl]", "trans": "をぞんざいに書く [=scribble, write carelessly]", "ex_eng": "His signature is unintelligible because he always scrawls his name.", "ex_trans": "彼はいつも自分の名前を殴り書きするので, 署名が判読できない。"}, {"num": "1623", "word": "predominate", "phonetic": "[prɪdά(ː)mənèɪt]", "trans": "(数量などの点で)優位を占める, 優勢である", "ex_eng": "By and large, male students still predominate in engineering courses.", "ex_trans": "概して, 工学課程ではいまだに男子学生が数の上で優位を占めている。"}, {"num": "1624", "word": "suffocate", "phonetic": "[sʌ́fəkèit]", "trans": "窒息（死）する [=smother]", "ex_eng": "Most of the fire's victims had suffocated in the smoke.", "ex_trans": "その火事の犠牲者のほとんどは煙で窒息死していた。"}, {"num": "1625", "word": "smother", "phonetic": "[smάðər]", "trans": "(火) を覆って消す, を窒息 (死) させる", "ex_eng": "When the oil in the pan caught fire, she tried to smother the flames with a blanket.", "ex_trans": "フライパンの油が引火したとき, 彼女は炎を毛布で覆って消そうとした。"}, {"num": "1626", "word": "smuggle", "phonetic": "[smάgl]", "trans": "を密輸する", "ex_eng": "The drug ring successfully smuggled its narcotics into the country.", "ex_trans": "その麻薬組織はその国に首尾よく麻薬を密輸した。"}, {"num": "1627", "word": "hibernate", "phonetic": "[hάɪbərnèɪt]", "trans": "冬眠する", "ex_eng": "Bears must eat as much food as they can find before they hibernate.", "ex_trans": "熊は冬眠する前に見つけられるだけ多くの食べ物を食べなければならない。"}, {"num": "1628", "word": "loom", "phonetic": "[lúːm]", "trans": "ぼんやり現れる", "ex_eng": "In spite of the good weather forecast, a dark cloud loomed on the horizon.", "ex_trans": "天気予報では晴天のはずだったのに, 黒雲が地平線上にぼんやりと現れた。"}, {"num": "1629", "word": "rumble", "phonetic": "[rámbəl]", "trans": "ごろごろと鳴る", "ex_eng": "As we headed home, thunder rumbled in the western sky.", "ex_trans": "家に向かう途中，西の空で雷がごろごろと鳴った。"}, {"num": "1630", "word": "topple", "phonetic": "[tά(:)pl]", "trans": "バランスが崩れて倒れる", "ex_eng": "The tall pile of books toppled and fell across his desk.", "ex_trans": "高く積まれた本の山がバランスが崩れて倒れ，彼の机に落ちた。"}, {"num": "1631", "word": "jostle", "phonetic": "[dʒά(:)sl]", "trans": "を押しつける", "ex_eng": "The fans jostled each other as they tried to get nearer to the stage.", "ex_trans": "ファンたちはステージに近づこうとして，互いに押し合った。"}, {"num": "1632", "word": "resuscitate", "phonetic": "[risˈʌsətèit]", "trans": "を生き返らせる，を復活させる", "ex_eng": "The near-drowning victim was resuscitated by lifeguards.", "ex_trans": "その溺死しかけた人は救助員によって蘇生された。"}, {"num": "1633", "word": "lurch", "phonetic": "[lɚːrtʃ]", "trans": "千鳥足で歩く", "ex_eng": "The drunk suddenly lurched into a group of people who were passing.", "ex_trans": "その酔っぱらいは，通りかかった一団の中に突然千鳥足で入って行った。"}, {"num": "1634", "word": "rankle", "phonetic": "[rǽŋkl]", "trans": "を (長い間) いら立たせる, を苦しめる", "ex_eng": "The fact that he had not been promoted rankled him.", "ex_trans": "彼は昇進を逃したことの怒りが収まらなかった。"}, {"num": "1635", "word": "plunder", "phonetic": "[plʌ́ndər]", "trans": "を略奪する [=ransack, ravage]", "ex_eng": "Pirates would attack ships and plunder whatever items of value they carried.", "ex_trans": "海賊たちは船を襲い，積荷のうち価値のある物は何でも略奪したものだった。"}, {"num": "1636", "word": "extricate", "phonetic": "[ékstrikèit]", "trans": "を救い出す <from 〜から> [=relieve, rescue, liberate]", "ex_eng": "The bank found it difficult to extricate itself from the financial disaster.", "ex_trans": "その銀行は財政難から脱するのは困難だと気付いた。"}, {"num": "1637", "word": "gnaw", "phonetic": "[nɔː]", "trans": "かじって穴を開ける <through 〜を>", "ex_eng": "They discovered that a rat had gnawed through the electricity cable.", "ex_trans": "彼らはネズミが電気のコードをかじって穴を開けたことを発見した。"}, {"num": "1638", "word": "foment", "phonetic": "[foumέnt]", "trans": "を助長する [=encourage] , を扇動する [=instigate, incite, abet]", "ex_eng": "Her main objective seems to be to foment disharmony among staff members.", "ex_trans": "彼女の主な目的はスタッフ間の不和を助長することのようだ。"}, {"num": "1639", "word": "gist", "phonetic": "[dʒɪst]", "trans": "要点, 主旨", "ex_eng": "T
