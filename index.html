ex_eng": "The sea today is placid, and the weather is sunny and bright.", "ex_trans": "今日の海は穏やかで, 天気は晴れて明るい。"}, {"num": "1692", "word": "gallant", "phonetic": "[gǽlənt]", "trans": "勇敢な [=brave, daring], 堂々とした [=imposing, stately]", "ex_eng": "The knights of medieval times were supposed to be gallant and trustworthy.", "ex_trans": "中世の騎士は勇敢で信頼できるとされていた。"}, {"num": "1693", "word": "extraterrestrial", "phonetic": "[èkstrətəréstriəl]", "trans": "地球外の ▶ extraterrestrial life 地球外生命", "ex_eng": "The movie was about a boy discovering an extraterrestrial life form.", "ex_trans": "その映画は地球外生物を見つけた少年の話だった。"}, {"num": "1694", "word": "incongruous", "phonetic": "[ɪnkά(ɔ)ŋgruəs]", "trans": "場違いな, 不適切な", "ex_eng": "His remarks at the wedding struck many people as incongruous.", "ex_trans": "結婚式での彼の発言は多くの人に場違いな印象を与えた。"}, {"num": "1695", "word": "insipid", "phonetic": "[ɪnsípɪd]", "trans": "退屈な, 味のない", "ex_eng": "Most critics found his novel insipid and lifeless.", "ex_trans": "評論家の大半は，彼の小説は退屈で生気がないと思った。"}, {"num": "1696", "word": "indelible", "phonetic": "[ɪndéləbl]", "trans": "消すことのできない", "ex_eng": "Although the tragedy occurred in his childhood, its effects on him were indelible.", "ex_trans": "その悲劇が起きたのは子供時代ののことだったが，彼に与えた影響は消すことができなかった。"}, {"num": "1697", "word": "heinous", "phonetic": "[héɪnəs]", "trans": "極悪非道の", "ex_eng": "The prosecutor called it a heinous crime and demanded the maximum sentence.", "ex_trans": "検事はその事件を凶悪犯罪と呼び，最高刑を求刑した。"}, {"num": "1698", "word": "indignant", "phonetic": "[ɪndígnənt]", "trans": "憤慨した 〈at 〜に〉 [=very angry] indignation 名", "ex_eng": "He was still indignant at the rude way the bureaucrat had spoken to him.", "ex_trans": "その官僚の彼に対する無礼な口の利き方に彼はまだ憤慨していた。"}, {"num": "1699", "word": "furtive", "phonetic": "[fə́ːrṭɪv]", "trans": "人目を盗んでの, こそこそした", "ex_eng": "His furtive glances at his colleagues led me to suspect a conspiracy.", "ex_trans": "彼がこっそり同僚たちをチラチラ見るので、たくらみがあるのかと私は疑った。"}, {"num": "1700", "word": "haphazardly", "phonetic": "[hæphάzərdli]", "trans": "無計画に", "ex_eng": "The cheap furniture was arranged haphazardly around the room.", "ex_trans": "それらの安い家具は無計画に部屋中に配置されていた。"}, {"num": "1701", "word": "pulverize", "phonetic": "[pʌ́lvərὰɪz]", "trans": "を粉砕する [=crush]", "ex_eng": "The shells were pulverized in order to create a fine powder.", "ex_trans": "貝殻はきめ細かなパウダーを作るために細かく砕かれた。"}, {"num": "1702", "word": "reprieve", "phonetic": "[rɪpríːv]", "trans": "を一時的に救う [=relieve temporarily] , の刑の執行を猶予する", "ex_eng": "By a stroke of luck, the students were reprieved from taking the exam.", "ex_trans": "思いがけない幸運で, 学生たちはその試験を受けることを猶予された。"}, {"num": "1703", "word": "rescind", "phonetic": "[rɪsɪ́nd]", "trans": "を撤回する, を無効にする [=annul, revoke, abrogate, repeal]", "ex_eng": "The law was rescinded because it was found unconstitutional by the Supreme Court.", "ex_trans": "その法律は最高裁判所が違憲と判決したので撤回された。"}, {"num": "1704", "word": "scour", "phonetic": "[skáuər]", "trans": "(場所)を捜し回る <for 〜を捜して> , 駆け巡る", "ex_eng": "They scoured the apartment for the missing earring but were unable to find it.", "ex_trans": "彼らはなくなくイヤリングを求めてアパート内を捜し回ったが, 見つけられなかった。"}, {"num": "1705", "word": "pervade", "phonetic": "[pərvéid]", "trans": "の隅々に広がる，にまん延する [=spread throughout] pervasion 名 pervasive 形", "ex_eng": "A new, strange illness pervaded a large section of the city.", "ex_trans": "新しい奇妙な病気が市の大部分に広まった。"}, {"num": "1706", "word": "prod", "phonetic": "[prɑ(:)d]", "trans": "を駆り立てる", "ex_eng": "He prodded me to continue walking even after I was exhausted.", "ex_trans": "私が疲れ果ててからbも, 彼は歩き続けるよう私を駆り立てた。"}, {"num": "1707", "word": "sojourn", "phonetic": "[sóʊdʒəːrn]", "trans": "滞在する", "ex_eng": "During his trip, he sojourned for a few days on the tropical island.", "ex_trans": "旅行中, 彼は数日間その熱帯の島に滞在した。"}, {"num": "1708", "word": "parry", "phonetic": "[pǽri]", "trans": "(攻撃・質問など) をかわす", "ex_eng": "He cleverly parried the criticism by turning it back on his opponent.", "ex_trans": "彼は批判を相手にそのまま返して巧みにかわした。"}, {"num": "1709", "word": "procrastinate", "phonetic": "[prəkrǽstənèɪt]", "trans": "先延ばしにする [= delay, put off] procrastination 名", "ex_eng": "The student continued to procrastinate in completing his senior thesis.", "ex_trans": "その学生は卒業論文の完成を先延ばしにし続けた。"}, {"num": "1710", "word": "inundate", "phonetic": "[ɪ́nʌndèɪt]", "trans": "を水浸しにする に殺到する", "ex_eng": "The valley was inundated when a large dam sprung a major leak.", "ex_trans": "大きなダムが大規模な水漏れを起こし，谷は水に浸かった。"}, {"num": "1711", "word": "chuckle", "phonetic": "[tʃʌ́kl]", "trans": "くすくす笑う", "ex_eng": "When the class began to chuckle, the teacher looked up and noticed that a cat had entered the classroom.", "ex_trans": "クラスの生徒たちがくすくす笑い出すと先生は顔を上げ，猫が教室に入り込んだことに気付いた。"}, {"num": "1712", "word": "nurture", "phonetic": "[nə́ːrtʃər]", "trans": "を育てる （考えなど）を抱く", "ex_eng": "The anthropologist worked to nurture a good relationship with the tribe.", "ex_trans": "その人類学者はその部族と良好な関係を築こうと努力した。"}, {"num": "1713", "word": "orient", "phonetic": "[ɔ́ːriènt]", "trans": "（関心など）を向ける", "ex_eng": "The scientist oriented his research to topics related to environmental destruction.", "ex_trans": "その科学者は研究の方向性を環境破壊に関係するトピックに定めた。"}, {"num": "1714", "word": "propel", "phonetic": "[prəpél]", "trans": "を進ませる, を推進する", "ex_eng": "The aircraft was propelled by two jet engines, one on each wing.", "ex_trans": "その飛行機は翼に1つずつある2つのジェットエンジンで進んだ。"}, {"num": "1715", "word": "stitch", "phonetic": "[stíʧ]", "trans": "(傷口など) を縫い合わせる; しばしばupを伴う。", "ex_eng": "The nurse stitched up the wound and then put a bandage on it.", "ex_trans": "看護師は傷口を縫い合わせてから包帯を巻いた。"}, {"num": "1716", "word": "tilt", "phonetic": "[tílt]", "trans": "傾く, を傾ける [=tip]; tilt one's head 首をかしげる", "ex_eng": "The tower was built on soft, marshy ground, and so it began to tilt after a few years.", "ex_trans": "塔が建てられた地面は柔らかい湿地だったので, 塔は数年後に傾き始めた。"}, {"num": "1717", "word": "tumble", "phonetic": "[tʌ́mbl]", "trans": "転がり落ちる, 転ぶ; come tumbling down 崩落する, 崩壊する", "ex_eng": "The little boy tripped and tumbled down the grass slope.", "ex_trans": "その小さな男の子はつまずいて草の斜面を転がり落ちた。"}, {"num": "1718", "word": "abduct", "phonetic": "[æbdʌ́kt]", "trans": "を誘拐する, を拉致する [=kidnap]; abduction 誘拐; abductor 誘拐者", "ex_eng": "The gang planned to abduct the millionaire's daughter and hold her for ransom.", "ex_trans": "ギャングの一味はその富豪の娘を誘拐して人質に取り, 身代金を要求するつもりだった。"}, {"num": "1719", "word": "despise", "phonetic": "[dispáiz]", "trans": "を軽蔑する, をひどく嫌う", "ex_eng": "The boy was used to being despised for his poverty by his wealthier classmates.", "ex_trans": "少年は, 自分より裕福なクラスメートに貧乏だと軽蔑されるのに慣れていた。"}, {"num": "1720", "word": "falter", "phonetic": "[fɔ́ːltər]", "trans": "勢いがなくなる, 弱る, 口ごもる", "ex_eng": "She was in the lead for most of the marathon, but near the end, she faltered and dropped out.", "ex_trans": "彼女はそのマラソンのほとんどで先頭を走っていたが, 最終盤に失速し脱落した。"}, {"num": "1721", "word": "salvage", "phonetic": "[sǽlvidʒ]", "trans": "(名声などを)回復する, (貴重なものを)救う [=save]", "ex_eng": "Following the scandal, the actor did his best to salvage his popularity.", "ex_trans": "スキャンダルの後, その俳優は人気を取り戻そうと最善を尽くした。"}, {"num": "1722", "word": "wade", "phonetic": "[weid]", "trans": "(水の中を)歩く, (川などを)歩いて渡る", "ex_eng": "After the heavy rain, local residents had to wade through flooded streets.", "ex_trans": "豪雨の後, その地域の人たちは水に漬かった通りを歩いて行かなければならなかった。"}, {"num": "1723", "word": "whine", "phonetic": "[hwain]", "trans": "泣き言を言う 〈about ～のことで〉", "ex_eng": "The child started whining about his broken toy.", "ex_trans": "その子は壊れたおもちゃのことで泣き言を言い始めた。"}, {"num": "1724", "word": "flinch", "phonetic": "[flɪntʃ]", "trans": "びくっとする, たじろぐ", "ex_eng": "The little boy flinched when he heard his father call him in an angry voice.", "ex_trans": "父親が怒った声で自分を呼ぶのを聞くと, 男の子はびくっとした。"}, {"num": "1725", "word": "fray", "phonetic": "[frei]", "trans": "いら立つ, (神経などが) すり減る", "ex_eng": "As they became tired and hungry, the hikers' tempers began to fray.", "ex_trans": "疲れて空腹になるにつれて, ハイカーたちの気がいら立ち始めた。"}, {"num": "1726", "word": "trudge", "phonetic": "[trʌdʒ]", "trans": "重い足取りで歩く", "ex_eng": "The exhausted hikers started to trudge back to the camp for their evening meal.", "ex_trans": "疲れ切ったハイカーたちは, 夕食を食べるためキャンプに向かって重い足取りで歩いて帰り始めた。"}, {"num": "1727", "word": "twitch", "phonetic": "[twitʃ]", "trans": "ぴくぴく動く, 引きつる", "ex_eng": "He noticed his wife's mouth twitching as she tried not to laugh at what he had said.", "ex_trans": "彼の言葉に笑うまいとして妻の口がぴくぴく動いているのに彼は気付いた。"}, {"num": "1728", "word": "delude", "phonetic": "[dilúːd]", "trans": "(delude A into B で) Aを欺いてBをさせる", "ex_eng": "The gambler deluded himself into believing that he could win back his losses.", "ex_trans": "そのギャンブラーは負けを取り返せると自分自身を欺いて信じ込ませた。"}, {"num": "1729", "word": "demoralize", "phonetic": "[dɪmɔ́(ː)rəlàɪz]", "trans": "の士気をくじく [=discourage, dishearten, take down]", "ex_eng": "The politician's speech against the war ended up demoralizing the military's troops.", "ex_trans": "その政治家の反戦演説は, 結局軍の兵士たちの士気をくじくこととなっ"}, {"num": "1730", "word": "eavesdrop", "phonetic": "[íːvzdrὰ(ː)p]", "trans": "盗み聞きする <on ～を>, 立ち聞きする [=listen in]", "ex_eng": "The secretary put her ear to the door in order to eavesdrop on her boss's conversation.", "ex_trans": "上司の会話を盗み聞きするため、秘書はドアに耳を当てていた。"}, {"num": "1731", "word": "embellish", "phonetic": "[imbéliʃ]", "trans": "を潤色する, を粉飾する [=embroider]", "ex_eng": "The historian was accused of embellishing the facts in order to create a more dramatic story.", "ex_trans": "その歴史家は, もっとドラマチックな話を創作するために事実を潤色したことを非難された。"}, {"num": "1732", "word": "imbue", "phonetic": "[imbjúː]", "trans": "に吹き込む <with 思想・主義などを>", "ex_eng": "His upbringing had imbued him with a strong sense of patriotism and a desire to serve his country.", "ex_trans": "子供のころのしつけは, 彼に強い愛国心と祖国に尽くしたいという欲求を植え付けていた。"}, {"num": "1733", "word": "paucity", "phonetic": "[pɔ́ːsəṭi]", "trans": "不足 〈of 〜の〉, 欠乏 ［＝scarcity, dearth, insufficiency］", "ex_eng": "I would like to travel after retirement, but I may be limited by a paucity of funds.", "ex_trans": "定年後は旅をしたいが，資金の不足で限界があるかもしれない。"}, {"num": "1734", "word": "rapport", "phonetic": "[ræpɔ́ːr]", "trans": "（調和した）関係 ［＝agreement, harmony］", "ex_eng": "We hoped that our meeting would help us develop a trusting and fruitful rapport.", "ex_trans": "私たちの会議が信頼でき実りある関係を生む助けとなるといい，と私たちは思った。"}, {"num": "1735", "word": "outcry", "phonetic": "[áutkrài]", "trans": "激しい抗議 〈against 〜に対する〉, 叫び声 ［＝shout］", "ex_eng": "A public outcry against the decision was soon raised.", "ex_trans": "その決定に反対する大衆の激しい抗議の声がすぐに上がった。"}, {"num": "1736", "word": "premonition", "phonetic": "[prèmənɪ́ʃən]", "trans": "（悪い）予感 〈that …という〉 ［＝presentiment］, （悪い）前兆 ［＝foreboding］, 予告 ［＝forewarning］", "ex_eng": "The fortune-teller had a premonition that her client would be in danger.", "ex_trans": "占い師は，相談者が危機に陥るという予感がした。"}, {"num": "1737", "word": "renunciation", "phonetic": "[rɪnὰnsiːʃən]", "trans": "放棄 [=relinquishment] renounce 動", "ex_eng": "Following his renunciation of the throne, the former king led a quiet life.", "ex_trans": "王座を放棄した後, 前国王は静かな生活を送った。"}, {"num": "1738", "word": "prophecy", "phonetic": "[prά(ː)fəsi]", "trans": "予言", "ex_eng": "At the time, his prophecy of ecological catastrophe was ignored.", "ex_trans": "当時、生態系破壊が起こるという彼の予言は無視された。"}, {"num": "1739", "word": "vestige", "phonetic": "[véstidʒ]", "trans": "名残", "ex_eng": "The judges' wigs were a vestige of the country's colonial period.", "ex_trans": "裁判官のかつらはその国の植民地時代の名残だった。"}, {"num": "1740", "word": "periphery", "phonetic": "[pərífəri]", "trans": "周囲, 外縁 (地域)", "ex_eng": "We posted guards on the periphery of the camp in case anyone tried to infiltrate in the night.", "ex_trans": "誰かが夜間に侵入しようとするといけないので, われわれは野営地の周囲に見張りを置いた。"}, {"num": "1741", "word": "sabotage", "phonetic": "[sǽbətὰːʒ]", "trans": "(労働争議の際などの) 破壊行為, 妨害", "ex_eng": "An act of sabotage by unhappy workers broke the machine, and the factory's production came to a halt.", "ex_trans": "不満を持つ労働者の破壊行為がその機械を壊し, 工場の生産が停止した。"}, {"num": "1742", "word": "shackle", "phonetic": "[ʃǽkl]", "trans": "手かせ [=manacle], 足かせ [=fetter], (通例 ～s) 拘束 [=restraint]", "ex_eng": "The unkempt prisoner appeared in court still in shackles.", "ex_trans": "髪がぼさぼさの囚人は手錠をはめられたまま出廷した。"}, {"num": "1743", "word": "spree", "phonetic": "[spri:]", "trans": "浮かれ [ばか] 騒ぎ", "ex_eng": "The family went on a shopping spree before Christmas and used all the money they had saved.", "ex_trans": "その家族はクリスマス前に買い物ざんまいをして, ためていたお金を使い果たした。"}, {"num": "1744", "word": "zeal", "phonetic": "[zi:l]", "trans": "熱心さ, 熱意 [=fervor, ardor, zest]", "ex_eng": "While appreciating his zeal, his boss would prefer more care and accuracy.", "ex_trans": "上司は彼の熱心さを評価してはいるが, もっと注意力と正確さがあればと思っているだろう。"}, {"num": "1745", "word": "allegiance", "phonetic": "[əlídʒəns]", "trans": "忠誠 〈to ～に対する〉, 忠義", "ex_eng": "When his chief supporter switched his allegiance to the rebels, the king knew he had lost the fight.", "ex_trans": "第1の支援者が寝返って反逆者に忠誠を誓ったとき, 王は戦いに敗れたと知った。"}, {"num": "1746", "word": "aspiration", "phonetic": "[æspəréiʃən]", "trans": "願望, 熱望 [=ambition]", "ex_eng": "It had always been her aspiration to become a successful novelist.", "ex_trans": "小説家として成功することがずっと彼女の願望だった。"}, {"num": "1747", "word": "awe", "phonetic": "[ɔː]", "trans": "畏敬, 畏怖; be in awe of 〜 〜に畏敬の念を抱く", "ex_eng": "When he reached the mountaintop, he was filled with awe by the beautiful scenery.", "ex_trans": "山頂に到達すると, 美しい景色に彼は畏敬の念で満たされた。"}, {"num": "1748", "word": "backdrop", "phonetic": "[bækdrὰ(:)p]", "trans": "(事件などの)背景 [=background]", "ex_eng": "The movie depicted a love affair set against the backdrop of a civil war.", "ex_trans": "その映画は内戦を背景にした恋愛を描いていた。"}, {"num": "1749", "word": "bureaucrat", "phonetic": "[bjúərəkrræt]", "trans": "官僚, 役人; bureaucratic 形", "ex_eng": "For many years, the writer worked as a bureaucrat in a government ministry.", "ex_trans": "その作家は長年政府の省で官僚として働いた。"}, {"num": "1750", "word": "collateral", "phonetic": "[kəlǽtərəl]", "trans": "担保 [=security]; 附随する", "ex_eng": "The woman put up a diamond necklace as collateral for her loan.", "ex_trans": "その女性はダイヤのネックレスをローンの担保に入れた。"}, {"num": "1751", "word": "complexion", "phonetic": "[kəmplékʃən]", "trans": "顔色, 肌の色", "ex_eng": "The boy's fair complexion meant that he was easily burnt by the sun.", "ex_trans": "(例文訳は画像で切れており不明)"}, {"num": "1752", "word": "crackdown", "phonetic": "[krǽkdàun]", "trans": "厳しい取り締まり", "ex_eng": "The new president immediately ordered a crackdown on police corruption.", "ex_trans": "新大統領は警察の腐敗の厳重な取り締まりを直ちに命じた。"}, {"num": "1753", "word": "curator", "phonetic": "[kjúərèitər]", "trans": "(博物館などの) 学芸員, キュレーター", "ex_eng": "When he tried to photograph the famous painting, a curator immediately warned him that it was not allowed.", "ex_trans": "彼がその有名な絵の写真を撮ろうとすると、すぐに学芸員が許可されていないと注意した。"}, {"num": "1754", "word": "groove", "phonetic": "[grúːv]", "trans": "(細く長い) 溝", "ex_eng": "The running water had cut a deep groove in the surface of the rock.", "ex_trans": "流れる水がその岩の表面に深い溝を刻んでいた。"}, {"num": "1755", "word": "inclination", "phonetic": "[ìŋklənéiʃən]", "trans": "気持ち 〈to do ～したいという〉, 意向", "ex_eng": "The man felt a sudden inclination to visit the town in which he had grown up.", "ex_trans": "男性は自分が育った町を訪れたいという気持ちを突然感じた。"}, {"num": "1756", "word": "nuisance", "phonetic": "[njúːsəns]", "trans": "迷惑な人 [行為, 物], 邪魔", "ex_eng": "The teacher told the boy to keep quiet and stop being a nuisance.", "ex_trans": "静かにしなさい, 迷惑をかけないで, と先生は少年に言った。"}, {"num": "1757", "word": "outskirts", "phonetic": "[áutskə̀ːrts]", "trans": "郊外, 町外れ", "ex_eng": "People living in the outskirts of London often see foxes in their gardens.", "ex_trans": "ロンドンの郊外に住む人たちは, 庭でしばしばキツネを見かける。"}, {"num": "1758", "word": "premise", "phonetic": "[prémis]", "trans": "前提 〈that …という〉, 根拠, (～s) 敷地, 構内", "ex_eng": "The chairman's plan was drawn up on the premise that the company's profits would continue to grow.", "ex_trans": "社長の計画は, 会社の利益が伸び続けるという前提で立てられた。"}, {"num": "1759", "word": "retention", "phonetic": "[riténʃən]", "trans": "記憶 (力), 保持", "ex_eng": "The detective's retention of all the facts of the case was quite remarkable.", "ex_trans": "刑事がその事件に関するすべての事実を記憶していることは, まったく驚くべきことだった。"}, {"num": "1760", "word": "lesion", "phonetic": "[líːʒən]", "trans": "病変, 傷", "ex_eng": "Many different illnesses can cause skin lesions, including viruses and cancers.", "ex_trans": "ウイルスとがんを含め, 多くのさまざまな病気が皮膚の病変の原因になり得る。"}, {"num": "1761", "word": "remnant", "phonetic": "[rémnənt]", "trans": "残り, 残存者 [=remains]", "ex_eng": "Following defeat in the battle, the remnant of the army surrendered to the enemy.", "ex_trans": "戦いに敗れた後, 軍の残存兵は敵に降伏した。"}, {"num": "1762", "word": "trajectory", "phonetic": "[trædʒéktəri]", "trans": "(ロケットなどの) 弾道, 軌道", "ex_eng": "During the war, many people were employed in calculating the trajectories of enemy missiles.", "ex_trans": "戦時中, 敵のミサイルの弾道の計算に多くの人手が費やされた。"}, {"num": "1763", "word": "archipelago", "phonetic": "[ὰːrkəpéləgou]", "trans": "群島, 諸島", "ex_eng": "The country was an enormous archipelago consisting of a multitude of islands.", "ex_trans": "その国は多数の島から成る巨大な群島だった。"}, {"num": "1764", "word": "remorse", "phonetic": "[rimɔ́ːrs]", "trans": "深い後悔 〈for 〜に対する〉, 自責の念", "ex_eng": "He was full of remorse for his behavior and apologized to his girlfriend repeatedly.", "ex_trans": "彼は自分の振る舞いに対する深い後悔でいっぱいで, 繰り返し恋人に謝罪した。"}, {"num": "1765", "word": "resilience", "phonetic": "[rizíliəns]", "trans": "回復力, 復元力", "ex_eng": "Everybody was surprised at the local residents' resilience in the face of so many disasters.", "ex_trans": "それほど多くの惨事に直面しても立ち直る地元住民の力に誰もが驚いた。"}, {"num": "1766", "word": "waiver", "phonetic": "[wéivər]", "trans": "権利放棄証書", "ex_eng": "Shortly before he started his horseback riding, the instructor asked him to sign a liability waiver.", "ex_trans": "彼が乗馬を始める直前に、インストラクターは免責同意書にサインしてほしいと言った。"}, {"num": "1767", "word": "vigil", "phonetic": "[vídʒɪl]", "trans": "(見守り・祈りなどのための) 徹夜, 寝ずの番", "ex_eng": "keep vigil at a person's bedside", "ex_trans": "徹夜で (人) の看病をする"}, {"num": "1768", "word": "petulant", "phonetic": "[pétʃulənt]", "trans": "不機嫌な, 怒りっぽい [=peevish]", "ex_eng": "His colleagues were surprised by his petulant display of anger.", "ex_trans" ": "It was presumptuous of him to make so many demands of a stranger.", "ex_trans": "見知らぬ人にそんなに多くの要求をするなんて，彼はずうずうしかった。"}, {"num": "1778", "word": "pernicious", "phonetic": "[pərníʃəs]", "trans": "非常に有害な, 破壊的な", "ex_eng": "Certain kinds of pernicious viruses thrive even in sanitary conditions.", "ex_trans": "ある種の非常に有害なウイルスは衛生状態がよくても繁殖する。"}, {"num": "1779", "word": "pungent", "phonetic": "[pʌ́ndʒənt]", "trans": "(味・匂いが) 刺激性の, (批評などが) 辛辣な [= scathing]", "ex_eng": "The moment he entered the house, he noticed a pungent smell of curry.", "ex_trans": "彼は家に入った瞬間に, カレーの刺激的な匂いを感じた。"}, {"num": "1780", "word": "languid", "phonetic": "[lǽŋgwid]", "trans": "元気がない, 物憂い [= listless, sluggish]", "ex_eng": "The boy seemed so languid that we wondered if he was healthy.", "ex_trans": "その少年があまりに元気がないと思えたので, 私たちは彼の健康をいぶかった。"}, {"num": "1781", "word": "sullen", "phonetic": "[sʌ́lən]", "trans": "不機嫌な, うっとうしい", "ex_eng": "The little girl stood with a sullen expression on her face.", "ex_trans": "その小さな女の子は不機嫌な表情を顔に浮かべて立っていた。"}, {"num": "1782", "word": "subversive", "phonetic": "[səbˈvɜːrsɪv]", "trans": "(秩序・政府などを) 破壊 [転覆] させる [=destructive]", "ex_eng": "Under the military regime, many people were arrested and imprisoned for their subversive activities.", "ex_trans": "軍事政権下で, 多くの人が破壊活動で逮捕され投獄された。"}, {"num": "1783", "word": "malleable", "phonetic": "[mǽliəbl]", "trans": "適応性のある, 柔順な [=pliable] , 可鍛性の", "ex_eng": "Many parents try to pass on their values to their children while their minds are at a malleable state.", "ex_trans": "多くの親は、子供の心が適応性のある状態のうちに、自分たちの価値観を伝えようとする。"}, {"num": "1784", "word": "pallid", "phonetic": "[pǽlɪd]", "trans": "(顔・肌などが) 青白い [=pale, wan] , つまらない", "ex_eng": "After months of severe dieting, her face looks drawn and pallid.", "ex_trans": "厳しいダイエットを数カ月した結果, 彼女の顔はげっそりとして青白く見える。"}, {"num": "1785", "word": "upscale", "phonetic": "[ʌpskéɪl]", "trans": "高級な (⇔downscale)", "ex_eng": "On their wedding anniversary, he took his wife to an upscale restaurant.", "ex_trans": "結婚記念日 ct on wealthy people, but it hit the poor hard.", "ex_trans": "新売上税は裕福な人々にはわずかな影響しかなかったが, 貧困層には大きな打撃を与えた。"}, {"num": "1794", "word": "overt", "phonetic": "[oʊvə́ːrt]", "trans": "公然の, 明白な [=obvious] (⇔covert) / overtly", "ex_eng": "Her overt opposition to the plan led to friction with other members.", "ex_trans": "彼女がその計画に公然と反対したことが, ほかのメンバーとのあつれきを招いた。"}, {"num": "1795", "word": "turbulent", "phonetic": "[tə́ːrbjʊlənt]", "trans": "激動する, 荒れ狂う / turbulence", "ex_eng": "The early years of the king's reign were turbulent ones, with wars, strikes, and natural disasters.", "ex_trans": "その国王の治世初期は, 戦争ありストライキあり自然災害ありの激動の年月だった。"}, {"num": "1796", "word": "anecdotal", "phonetic": "[æ̀nɪkdóʊtəl]", "trans": "逸話の、体験談の", "ex_eng": "While anecdotal evidence suggested that the economy was improving, no hard statistics were available.", "ex_trans": "事例証拠は景気が改善しつつあると示唆していたが、確実な統計はどこにもなかった。"}, {"num": "1797", "word": "luminous", "phonetic": "[lúːmɪnəs]", "trans": "光り輝く、光を発する", "ex_eng": "Only the most luminous stars are visible in the urban night sky.", "ex_trans": "都会の夜の空で見えるのは最も明るく輝く星だけだ。"}, {"num": "1798", "word": "melancholy", "phonetic": "[mélənkà(:)li]", "trans": "ふさぎ込んだ、気のめいる", "ex_eng": "She was a quiet, melancholy young woman who rarely became excited by things.", "ex_trans": "彼女は物事にときめくことのめったにない、物静かでふさぎ込みがちの若い女性だった。"}, {"num": "1799", "word": "ornate", "phonetic": "[ɔːrnéɪt]", "trans": "細部まで凝った、飾り立てた", "ex_eng": "Inside the church, the wooden seats were decorated with ornate carvings.", "ex_trans": "教会の中では、木製の座席は細部まで凝った彫刻で装飾されていた。"}, {"num": "1800", "word": "nominally", "phonetic": "[nά(:)mənəli]", "trans": "名目上は", "ex_eng": "Although he was nominally in charge, the real decisions were made by others.", "ex_trans": "彼は名目上は責任者だったが, 本当の決定はほかの人々によってなされた."}, {"num": "1801", "word": "impel", "phonetic": "[ɪmpél]", "trans": "を駆り立てる 〈to do 〜するように〉, を強いる", "ex_eng": "After listening to the lecture for thirty minutes, he felt impelled to interrupt and object.", "ex_trans": "講義を30分聞いた後, 彼は話を遮って反対したい気持ちに駆られた。"}, {"num": "1802", "word": "lubricate", "phonetic": "[lúːbrɪkèɪt]", "trans": "に潤滑油を差す [塗る]", "ex_eng": "The door hinges were squeaking so he lubricated them with some oil.", "ex_trans": "ドアのちょうつがいがキーキー鳴るので, 彼は潤滑油を差した。"}, {"num": "1803", "word": "nibble", "phonetic": "[níbl]", "trans": "少しずつつまじる 〈at, on 〜を〉, （食べ物）を少しずつつまじる", "ex_eng": "The two men nibbled at the peanuts as they drank, and soon the bowl was completely empty.", "ex_trans": "2人の男性は酒を飲みながらピーナツをポリポリつまみ, すぐにボウルはすっかり空になった。"}, {"num": "1804", "word": "polarize", "phonetic": "[póuləràɪz]", "trans": "（集団など）を二極化させる, を分裂させる", "ex_eng": "The country became polarized between supporters and opponents of the president.", "ex_trans": "その国は大統領の支持者と反対者の間で二極化した。"}, {"num": "1805", "word": "pounce", "phonetic": "[paʊns]", "trans": "ここぞとばかりに攻撃する 〈on 失敗などを〉, 急襲する", "ex_eng": "When a student made a mistake, the teacher immediately pounced on it.", "ex_trans": "生徒が間違うと，先生はここぞとばかりにすぐにその間違いを指摘した。"}, {"num": "1806", "word": "retaliate", "phonetic": "[rɪtǽlièɪt]", "trans": "報復する 〈with ～で〉, 仕返しする", "ex_eng": "After the attack on its forces, the other side retaliated with a bombing campaign.", "ex_trans": "相手方は自軍に攻撃を受けた後，空爆作戦で報復した。"}, {"num": "1807", "word": "rummage", "phonetic": "[rʌ́mɪdʒ]", "trans": "かき回して捜す", "ex_eng": "When she asked for glue, he rummaged about in his desk drawer and produced some.", "ex_trans": "接着剤をちょうだいと彼女に言われ，彼は机の引き出しをがさごそ捜して取り出した。"}, {"num": "1808", "word": "spearhead", "phonetic": "[spíərhèd]", "trans": "(運動など)の先頭に立つ", "ex_eng": "The rock star spearheaded a campaign to prevent the chemical factory being built.", "ex_trans": "そのロックスターは，その化学工場が建設されるのを中止させる運動の先頭に立った。"}, {"num": "1809", "word": "typify", "phonetic": "[típɪfàɪ]", "trans": "を象徴する，の典型である", "ex_eng": "The expert said the low voter turnout typified the public's lack of interest in politics.", "ex_trans": "低い投票率は大衆の政治に対する関心の欠如の象徴だ，とその専門家は述べた。"}, {"num": "1810", "word": "prowl", "phonetic": "[praul]", "trans": "(獲物などを求めて) うろつく", "ex_eng": "It can be dangerous to walk outside at night in the area because of the lions prowling for prey.", "ex_trans": "獲物を探してうろつくライオンがいるので、その地域では夜間に外を歩くのは危険なことがある。"}, {"num": "1811", "word": "retract", "phonetic": "[rɪtráɛkt]", "trans": "を撤回する, を取り消す [=withdraw, take back] retraction 図", "ex_eng": "The prime minister demanded that the leader of the opposition retract his shocking accusations.", "ex_trans": "首相は, 野党の指導者が述べた無礼な非難を撤回することを要求した。"}, {"num": "1812", "word": "ruffle", "phonetic": "[ráfəl]", "trans": "を動揺させる, の心を乱す ▶ ruffle a person's feathers (人) をかっかとさせる", "ex_eng": "The protesters tried to ruffle the mayor by shouting insults, but he paid no attention.", "ex_trans": "抗議者たちは侮辱を浴びせて市長を動揺させようとしたが, 市長は気に留めなかった。"}, {"num": "1813", "word": "detest", "phonetic": "[dɪtést]", "trans": "をひどく嫌う [=hate, loathe]", "ex_eng": "Even though he detested broccoli, his wife often served it.", "ex_trans": "彼はブロッコリーが大嫌いだったのに, 妻はそれをよく食事に出した。"}, {"num": "1814", "word": "feign", "phonetic": "[feɪn]", "trans": "のふりをする, を装う [=pretend, fake, simulate]", "ex_eng": "The students were bored by the lecture, but some tried to feign interest.", "ex_trans": "学生たちは講義に退屈していたが, 関心を持っているふりをしようとした者もいた。"}, {"num": "1815", "word": "fluctuate", "phonetic": "[flʌ́ktʃuèit]", "trans": "変動する, 上下する [=undulate]", "ex_eng": "The exchange rate between the yen and the dollar has fluctuated wildly all year.", "ex_trans": "円とドルの為替レートは一年中激しく変動した。"}, {"num": "1816", "word": "meddle", "phonetic": "[médl]", "trans": "干渉する <in ～に> [=interfere]", "ex_eng": "The man advised his wife not to meddle in her friend's marriage.", "ex_trans": "男性は妻に、友達の結婚に干渉しないように忠告した。"}, {"num": "1817", "word": "pamper", "phonetic": "[pǽmpər]", "trans": "を甘やかす <with ～で> [=spoil]", "ex_eng": "She pampered her pet cat with expensive foods such as smoked salmon.", "ex_trans": "彼女はスモークサーモンのような高価な餌を与えて飼い猫を甘やかした。"}, {"num": "1818", "word": "peruse", "phonetic": "[pərúːz]", "trans": "をざっと読む [=look over] , を熟読する", "ex_eng": "Over breakfast, he perused a copy of the local newspaper.", "ex_trans": "朝食を食べながら、彼は地元の新聞をざっと読んだ。"}, {"num": "1819", "word": "pique", "phonetic": "[píːk]", "trans": "を立腹させる [=offend] , を刺激する [=excite]", "ex_eng": "Her persistent complaints began to pique many of her colleagues.", "ex_trans": "彼女がいつまでも文句を言っていたので、同僚の多くが腹を立て始めた。"}, {"num": "1820", "word": "indoctrinate", "phonetic": "[ɪndά(ɔ)ktrəmèɪt]", "trans": "に教え込む 〈in, with 教義などを〉 [=instruct, teach] cf. doctrine 教義", "ex_eng": "The martial arts teacher indoctrinated his new students with basic fighting techniques.", "ex_trans": "格闘技の教師は、新入生に基本的な戦闘技術を教え込んだ。"}, {"num": "1821", "word": "orchestrate", "phonetic": "[ˈɔːrkɪstrèɪt]", "trans": "を画策する, の段取りを整える orchestration 名", "ex_eng": "The politician orchestrated a smear campaign against his rival.", "ex_trans": "その政治家はライバルに対する組織的な中傷を画策した。"}, {"num": "1822", "word": "fortify", "phonetic": "[fˈɔːrtəfὰɪ]", "trans": "を強化する 〈with ～で〉 [=strengthen] fort 図 要塞 fortification 図 防備の強化", "ex_eng": "Nowadays, it is customary to fortify milk with vitamin D.", "ex_trans": "最近では、ビタミンDで牛乳の栄養価を高めることが普通になっている。"}, {"num": "1823", "word": "bolster", "phonetic": "[bóʊlstər]", "trans": "を高める [=boost] , を支援する [=support]", "ex_eng": "The government has recently taken steps to bolster market confidence.", "ex_trans": "最近政府は市場の信頼性を高める対策を講じた。"}, {"num": "1824", "word": "exhort", "phonetic": "[ɪgzɔ́ːrt]", "trans": "に熱心に勧める <to do 〜すること> [=urge, encourage]", "ex_eng": "The teacher exhorted the students to prepare for the final exam.", "ex_trans": "その教師は期末試験の準備をするよう生徒たちに熱心に勧めた。"}, {"num": "1825", "word": "coerce", "phonetic": "[kouə́ːrs]", "trans": "に強いる <into ～を> [＝force]", "ex_eng": "Though the man was reluctant to sign the contract, he was coerced into doing it.", "ex_trans": "男性は気が進まなかったが、契約書にサインすることを強いられた。"}, {"num": "1826", "word": "dazzle", "phonetic": "[dǽzl]", "trans": "を幻惑する", "ex_eng": "Dazzled by the man's charm, the woman eventually agreed to a date.", "ex_trans": "女性はその男性の魅力に幻惑され、結局デートに応じた。"}, {"num": "1827", "word": "debunk", "phonetic": "[diːbʌ́ŋk]", "trans": "の誤りを暴く [＝disprove]", "ex_eng": "One effect of science has been to debunk many traditional beliefs.", "ex_trans": "科学の効能の1つは、多くの伝統的な考えの誤りを暴いてきたことである。"}, {"num": "1828", "word": "surmise", "phonetic": "[sərmáiz]", "trans": "(surmise that ... で) ・・・と推測する [＝guess, conjecture]", "ex_eng": "I surmised that I could do better by investing in real estate than in stocks.", "ex_trans": "株より不動産に投資したほうがうまくやれると私は推測した。"}, {"num": "1829", "word": "reiterate", "phonetic": "[ri(ː)íṭərèit]", "trans": "を繰り返す [＝repeat]", "ex_eng": "The ambassador reiterated his nation's policy at the start of the meeting.", "ex_trans": "大使は会議の冒頭で彼の国の政策を改めて表明した。"}, {"num": "1830", "word": "enunciate", "phonetic": "[ɪnˈʌnsièɪt]", "trans": "を発表する [=announce] , を明瞭に発音する [=articulate]", "ex_eng": "My boss forcefully enunciated his policies to the employees.", "ex_trans": "私の上司は従業員に対し力強い調子で彼の方針を発表した。"}, {"num": "1831", "word": "defuse", "phonetic": "[dɪfjúːz]", "trans": "(爆弾など) から信管を除去する, (危険) を取り除く, (緊張) を和らげる", "ex_eng": "Nowadays, many police forces have experts who can defuse bombs.", "ex_trans": "最近, 多くの警察隊には爆弾の信管を除去できる専門家がいる。"}, {"num": "1832", "word": "berate", "phonetic": "[bɪréɪt]", "trans": "を責め立てる <for 〜のことで> [=blame, rebuke, reprimand, reproach]", "ex_eng": "He berated himself for having trusted a stranger with his money.", "ex_trans": "彼は見知らぬ人にお金を預けてしまったことで自分自身を責めた。"}, {"num": "1833", "word": "abscond", "phonetic": "[æbskɑ́(:)nd]", "trans": "持ち逃げする <with 〜を>, 逃亡する", "ex_eng": "The bank manager absconded with the money after his theft was revealed.", "ex_trans": "銀行の支店長は, 自身の窃盗が発覚した後その金を持って姿をくらましました。"}, {"num": "1834", "word": "broach", "phonetic": "[broutʃ]", "trans": "(話題) を切り出す", "ex_eng": "Many parents find sex education an awkward subject to broach with their children.", "ex_trans": "性教育は子供に切り出すのが厄介なテーマだと多くの親が感じる。"}, {"num": "1835", "word": "bask", "phonetic": "[bæsk]", "trans": "日光浴をする [=sunbathe], 享受する [=delight]", "ex_eng": "In the summer, seals could be seen basking on the rocks.", "ex_trans": "夏には, 岩の上で日光浴をするアザラシの姿を見ることができた。"}, {"num": "1836", "word": "wrath", "phonetic": "[ræθ]", "trans": "激怒 [=extreme anger]", "ex_eng": "The boy could imagine his father's wrath when he told him about the damage to the family car.", "ex_trans": "家の車に与えた損傷のことを話したら父親がどんなに激怒するか, 少年は想像できた。"}, {"num": "1837", "word": "antiseptic", "phonetic": "[æntisépṭɪk]", "trans": "消毒剤 [=disinfectant] 消毒用の", "ex_eng": "When she cut her finger, she immediately put antiseptic on it to stop it being infected.", "ex_trans": "彼女は指を切ったとき, 感染症にならないようにすぐ消毒薬を塗った。"}, {"num": "1838", "word": "attrition", "phonetic": "[ətríʃən]", "trans": "消耗, 摩滅", "ex_eng": "The government waged a long war of attrition against the rebel forces.", "ex_trans": "政府は反乱軍相手に長い消耗戦を遂行した。"}, {"num": "1839", "word": "bombardment", "phonetic": "[bɑ(ː)mbάɚdmənt]", "trans": "爆撃, 砲撃", "ex_eng": "The city suffered nightly bombardments by the enemy.", "ex_trans": "その市は敵から毎夜の爆撃を受けた。"}, {"num": "1840", "word": "euphoria", "phonetic": "[juːfɔ́ːriə]", "trans": "幸福感, 多幸感", "ex_eng": "The euphoria he had felt upon passing the bar examination soon faded.", "ex_trans": "司法試験に合格して彼が感じた幸福感はすぐに消え去っていった。"}, {"num": "1841", "word": "futility", "phonetic": "[fjuːˈtɪləti]", "trans": "無益, 無駄", "ex_eng": "Gradually the local people became convinced of the futility of further resistance and began to surrender.", "ex_trans": "その地方の人々はその以上の抵抗することの無益さを次第に確信するようになり, 降伏し始めた。"}, {"num": "1842", "word": "infatuation", "phonetic": "[ɪnfætʃuˈeɪʃən]", "trans": "夢中になること 〈with ～に〉", "ex_eng": "Many teenagers go through an infatuation with an older boy or girl, but these rarely last long.", "ex_trans": "多くのティーンエージャーは年上の少年や少女に夢中になる時期を経るが, めったに長続きしない。"}, {"num": "1843", "word": "inhalation", "phonetic": "[ɪnhəˈleɪʃən]", "trans": "吸入 (⇔exhalation)", "ex_eng": "The flu viruses usually enter the body through inhalation.", "ex_trans": "インフルエンザウイルスは普通息を吸うことによって体内に入る。"}, {"num": "1844", "word": "labyrinth", "phonetic": "[ˈlæbərɪnθ]", "trans": "迷路 ［＝maze］", "ex_eng": "The small back alleys formed a labyrinth in which it was easy to get lost.", "ex_trans": "狭い路地はすぐに道に迷う迷路になっていた。"}, {"num": "1845", "word": "reconnaissance", "phonetic": "[rɪkɑ́(:)nəzəns]", "trans": "偵察 ▶ reconnaissance aircraft 偵察機", "ex_eng": "The young soldier was sent on a reconnaissance mission into enemy territory.", "ex_trans": "その若い兵士は偵察の任務を帯びて敵地に派遣された。"}, {"num": "1846", "word": "remittance", "phonetic": "[rɪˈmɪtəns]", "trans": "送金", "ex_eng": "Many developing countries now depend on remittances sent by their citizens who work abroad.", "ex_trans": "今では多くの発展途上国は，外国で働く国民が送る送金に頼っている。"}, {"num": "1847", "word": "rendezvous", "phonetic": "[ráːndeɪvùː]", "trans": "待ち合わせ, 会う約束, 待ち合わせ場所", "ex_eng": "The young lovers planned a rendezvous outside the local library.", "ex_trans": "若い恋人たちは地元の図書館の外で待ち合わせをする予定を立てた。"}, {"num": "1848", "word": "restition", "phonetic": "[rèstɪtʃúːʃən]", "trans": "(盗難品などの) 返還", "ex_eng": "A number of former colonies have demanded restitution of cultural treasures kept in European museums.", "ex_trans": "いくつかの旧植民地が，ヨーロッパの博物館に保管されている文化財の返還を要求している。"}, {"num": "1849", "word": "slur", "phonetic": "[slɜːr]", "trans": "中傷 〈on ～に対する〉, 誹謗", "ex_eng": "The television personality said that the rumors about him were a slur on his good reputation.", "ex_trans": "(画像に例文訳が記載されていないため空欄)"}, {"num": "1850", "word": "strife", "phonetic": "[straif]", "trans": "争い, 不和 [=conflict], political strife 政争", "ex_eng": "It was a period of great industrial strife, and strikes by workers were common all over the country.", "ex_trans": "そのころは産業界で紛争が多発した時期で, 労働者のストライキは国中でよく起きていた。"}, {"num": "1851", "word": "suitor", "phonetic": "[súːtər]", "trans": "(女性への)求婚者", "ex_eng": "Eventually the girl agreed to introduce her suitor to her parents.", "ex_trans": "ついに少女は求婚者を両親に紹介することに同意した。"}, {"num": "1852", "word": "versatility", "phonetic": "[və̀ːrsətíləṭi]", "trans": "多才, 多芸, versatile 囮", "ex_eng": "The versatility of the new employee quickly made her indispensable to the company.", "ex_trans": "その新入社員は多才だったので, すぐに会社にとってなくてはならない存在になった。"}, {"num": "1853", "word": "interlude", "phonetic": "[íŋtərlùːd]", "trans": "合間, 幕あい", "ex_eng": "During the interlude between the end of classes and the beginning of the exams, most students studied hard.", "ex_trans": "授業が終わり試験が始まるまでの合間に, ほとんどの生徒は熱心に勉強した。"}, {"num": "1854", "word": "layman", "phonetic": "[léimən]", "trans": "素人，門外漢（⇔expert）", "ex_eng": "Many legal terms are quite incomprehensible to even a well-educated layman.", "ex_trans": "教養のある素人にとってさえも，多くの法律用語は極めてわかりにくい。"}, {"num": "1855", "word": "stampede", "phonetic": "[stæmpíːd]", "trans": "(動物・人が)どっと逃げ出すこと, 集団暴走", "ex_eng": "When a fire broke out in the sports stadium, it led to a stampede among the spectators.", "ex_trans": "そのスポーツ競技場で火事が発生したとき, 観客がどっと逃げ出す結果になった。"}, {"num": "1856", "word": "repercussion", "phonetic": "[rìːpərkʌ́ʃən]", "trans": "(通例 ~s) (好ましくない) 影響, 余波 [= consequence, aftereffect]", "ex_eng": "The repercussions of the debt crisis included a fall in stock prices.", "ex_trans": "債務危機の影響の1つに株価の下落があった。"}, {"num": "1857", "word": "concession", "phonetic": "[kənséʃən]", "trans": "譲歩 [= compromise] concede 動", "ex_eng": "However long we negotiated, our business partner refused to make any concessions.", "ex_trans": "どれだけ長時間交渉しても, ビジネスパートナーは一切の譲歩を拒んだ。"}, {"num": "1858", "word": "hindsight", "phonetic": "[háindsàit]", "trans": "後知恵 (⇔foresight 先見の明) 語源 hind (後ろ) + sight (視覚) in [with] hindsight 後から考えると", "ex_eng": "In hindsight, the company realized that it could have prevented a grave mistake.", "ex_trans": "後から考えると, その会社は重大な過ちを防げたかもしれないと気付いた。"}, {"num": "1859", "word": "felicity", "phonetic": "[fəlísəti]", "trans": "幸福, 至福 [=bliss]", "ex_eng": "Beneath a facade of domestic felicity, the marriage was in trouble.", "ex_trans": "うわべの家庭円満とは裏腹に, その結婚は危機に陥っていた。"}, {"num": "1860", "word": "creed", "phonetic": "[kriːd]", "trans": "信条 [=belief]", "ex_eng": "Although they follow different creeds, they still decided to marry.", "ex_trans": "異なる信条を奉じていたが, それでも2人は結婚することに決めた。"}, {"num": "1861", "word": "farce", "phonetic": "[fɑːrs]", "trans": "笑劇, 道化芝居", "ex_eng": "The comedian first made his name in a theatrical farce.", "ex_trans": "その喜劇役者が初めて有名になったのは, 舞台で演じた笑劇だった。"}, {"num": "1862", "word": "juncture", "phonetic": "[dʒʌ́ŋktʃər]", "trans": "(重大) 時期, 接合点", "ex_eng": "The upcoming election marks a critical juncture for the future of the country.", "ex_trans": "来たる選挙はその国の将来にとって決定的な時期となる。"}, {"num": "1863", "word": "gimmick", "phonetic": "[gímik]", "trans": "巧妙な仕掛け", "ex_eng": "He dismissed the new policy as just a gimmick to attract voters.", "ex_trans": "新たな政策は有権者を引き付けるための巧妙な仕掛けにすぎない, と彼は退けた。"}, {"num": "1864", "word": "caliber", "phonetic": "[kǽləbər]", "trans": "能力（の程度） [=faculty] ，（銃の）口径 calibration 名 目盛り ▶ high-caliber researcher 能力のある研究者", "ex_eng": "There are not many lawyers of his caliber in the company.", "ex_trans": "その会社には彼ほど能力のある弁護士は多くない。"}, {"num": "1865", "word": "allegory", "phonetic": "[ˈæləgɔ̀ːri]", "trans": "寓話, 例え話 [=story with a symbolic meaning]", "ex_eng": "This painting has been interpreted as an allegory of life and death.", "ex_trans": "この絵は生と死の寓話だと解釈されてきた。"}, {"num": "1866", "word": "ascension", "phonetic": "[əsénʃən]", "trans": "上昇, 即位 [=enthronement] , (the Ascension) キリストの昇天", "ex_eng": "The singer's ascension to the rank of superstar was unusually quick.", "ex_trans": "その歌手はスーパースターの座に上り詰めるのが並外れて速かった。"}, {"num": "1867", "word": "bout", "phonetic": "[baut]", "trans": "発病, 発作 [=attack] , 短い期間 [=spell]", "ex_eng": "A bout of malaria generally leaves the victim much weakened.", "ex_trans": "マラリアを発症すると一般的に患者は体力がひどく低下する。"}, {"num": "1868", "word": "animosity", "phonetic": "[æ̀nəmά(ː)səti]", "trans": "憎悪 〈between ～間の〉 [=hatred] , 敵意 [=enmity, hostility, antagonism]", "ex_eng": "It has been hard to overcome the animosity between Israel and its Arab neighbors.", "ex_trans": "イスラエルと近隣アラブ諸国との間の憎悪を克服するのはずっと困難だった。"}, {"num": "1869", "word": "affront", "phonetic": "[əfrʌ́nt]", "trans": "(公然の) 侮辱 <to 〜に対する> [=insult, scorn, slight]", "ex_eng": "The way he was treated at the hotel was an affront to his dignity.", "ex_trans": "そのホテルで彼が受けた扱いは彼の尊厳を侮辱するものだった。"}, {"num": "1870", "word": "barrage", "phonetic": "[bərάːʒ]", "trans": "集中砲火 〈of 質問など〉, 弾幕", "ex_eng": "The film star was faced with a barrage of questions about his upcoming divorce.", "ex_trans": "その映画俳優は秒読み段階の離婚に関する質問の集中砲火に遭った。"}, {"num": "1871", "word": "brunt", "phonetic": "[brʌnt]", "trans": "矢面, (攻撃の) 矛先", "ex_eng": "The capital city bore the brunt of the enemy's bombing campaign.", "ex_trans": "首都は敵国の爆撃作戦の矢面に立った。"}, {"num": "1872", "word": "audacious", "phonetic": "[ɔːdéfəs]", "trans": "大胆な, 無鉄砲な", "ex_eng": "The gang of thieves made an audacious attempt to rob the jewelry store in broad daylight.", "ex_trans": "泥棒の一味は、白昼堂々その宝飾店を襲うという大胆な企てに出た。"}, {"num": "1873", "word": "colloquial", "phonetic": "[kəlόʊkwiəl]", "trans": "口語体の", "ex_eng": "Although he had studied Chinese, he found the colloquial language of the fishermen difficult to follow.", "ex_trans": "彼は中国語を学んでいたけれど, 漁師たちの口語体の言葉についていくのは難しかった。"}, {"num": "1874", "word": "concerted", "phonetic": "[kənsə́ːrtɪd]", "trans": "協力しての, 共同での", "ex_eng": "Thanks to the concerted efforts of the drama club, the performance was ready on time.", "ex_trans": "演劇部の一致協力した努力のかいあって, 公演は時間どおりに準備ができた。"}, {"num": "1875", "word": "cumbersome", "phonetic": "[kʌ́mbərsəm]", "trans": "(大きく重くて) 扱いにくい, 手に負えない", "ex_eng": "The men found it difficult to move the cumbersome furniture up the stairs to the apartment.", "ex_trans": "男性たちは扱いにくい家具を階段でアパートの上階に運ぶのは難しいと思った。"}, {"num": "1876", "word": "egregious", "phonetic": "[igrídʒəs]", "trans": "実にひどい, 途方もない", "ex_eng": "The judge said it was one of the most egregious cases of tax evasion that he had ever seen.", "ex_trans": "それまで見た中で最もひどい脱税事件の1つだ, と裁判官は言った。"}, {"num": "1877", "word": "eminent", "phonetic": "[émɪnənt]", "trans": "高名な, 傑出した", "ex_eng": "Many eminent physicians examined the princess, but no one could say what was wrong with her.", "ex_trans": "多くの高名な医師が女王を診察したが, 女王のどこが悪いのか誰も言えなかった。"}, {"num": "1878", "word": "enigmatic", "phonetic": "[ènɪɡmǽtɪk]", "trans": "謎めいた, 不可解な", "ex_eng": "Her message was so enigmatic that he completely failed to understand it.", "ex_trans": "彼女のメッセージはあまりに謎めいていて, 彼には皆目理解できなかった。"}, {"num": "1879", "word": "extraneous", "phonetic": "[ɪkstréɪnɪəs]", "trans": "無関係の, 本質的でない", "ex_eng": "His professor told him that his thesis contained too much extraneous information.", "ex_trans": "彼の指導教授は, 彼の論文には無関係な情報が多すぎると言った。"}, {"num": "1880", "word": "inconspicuous", "phonetic": "[ìnkənspíkjuəs]", "trans": "目立たない, 地味な", "ex_eng": "The successful businessman lived in the same inconspicuous house in which he had grown up.", "ex_trans": "成功を手にしたその実業家は, 育った目立たない家にそのまま住んでいた。"}, {"num": "1881", "word": "indulgent", "phonetic": "[ɪndʌ́ldʒənt]", "trans": "甘い，寛大な indulgence 名 cf. self-indulgent わがまま放題の", "ex_eng": "He was an indulgent father who usually let his daughters have whatever they wanted.", "ex_trans": "彼は娘たちが欲しがるものはたいてい何でも与える甘い父親だった。"}, {"num": "1882", "word": "queasy", "phonetic": "[kwíːzi]", "trans": "吐き気のする [=nauseous]", "ex_eng": "After eating too much sweet food and then riding the roller coaster, she felt queasy.", "ex_trans": "甘い物を食べ過ぎてからジェットコースターに乗った後、彼女は吐き気がした。"}, {"num": "1883", "word": "repulsive", "phonetic": "[rɪpÁlsɪv]", "trans": "嫌悪感を起こさせる, 不快な [=disgusting, repellent]", "ex_eng": "The soup looked repulsive, but he forced himself to eat it.", "ex_trans": "スープは気持ちが悪くなる見た目だったが、彼は無理やり食べた。"}, {"num": "1884", "word": "scruffy", "phonetic": "[skráfɪ]", "trans": "汚らしい, だらしない [=shabby]", "ex_eng": "However much his mother tried to tidy him up, the schoolboy always looked scruffy.", "ex_trans": "身ぎれいにさせようと母親がいくら努力しても、その男子生徒はいつも汚らしく見えた。"}, {"num": "1885", "word": "contentious", "phonetic": "[kənténʃəs]", "trans": "論争好きな [=controversial, quarrelsome]", "ex_eng": "It is often hard to deal with riticized for the arbitrary nature of his decisions.", "ex_trans": "大統領は, 決定の際の独断的な性向を批判された。"}, {"num": "1895", "word": "benign", "phonetic": "[bənάin]", "trans": "優しい, 温和な [=mild] , (気候などが) 穏やかな, (病理学的に) 良性の (⇔malignant)", "ex_eng": "His intentions are always benign, though sometimes poorly communicated.", "ex_trans": "彼の意図は, 時にうまくいかないこともあるが, いつも優しい。"}, {"num": "1896", "word": "belatedly", "phonetic": "[biléitidli]", "trans": "遅れて, 手遅れで", "ex_eng": "The novelist was belatedly recognized as one of the greatest writers of his generation.", "ex_trans": "その小説家は, 彼の世代の最も偉大な作家の1人だと遅ればせながら認められた。"}, {"num": "1897", "word": "cordially", "phonetic": "[kɔ́ː(r)rdʒəli]", "trans": "心から, 真心を込めて", "ex_eng": "The visitor found herself cordially welcomed by the whole family at the front door.", "ex_trans": "その訪問客は, 玄関で家族全員に心から歓迎された。"}, {"num": "1898", "word": "exponentially", "phonetic": "[èkspənénʃəli]", "trans": "(増加が)急激に, 指数関数的に", "ex_eng": "The rabbit population increased exponentially until it seemed that there were rabbits everywhere.", "ex_trans": "ウサギの生息数が急激に増加し, ついには至る所にウサギがいるように思えるまでになった。"}, {"num": "1899", "word": "figuratively", "phonetic": "[fígjərətivli]", "trans": "比喩的に (⇔literally 文字どおり)", "ex_eng": "He lives, figuratively speaking, in a bubble, completely unaware of the world around him.", "ex_trans": "彼は比喩的に言うと泡の中に住んでいて, 自分を取り巻く世界にまったく気付いていない。"}, {"num": "1900", "word": "vehemently", "phonetic": "[víːəməntli]", "trans": "激しく，猛烈に vehement 形", "ex_eng": "The boy vehemently disliked his school and never returned there after he graduated.", "ex_trans": "少年は学校を激しく嫌っていて，卒業後は二度と戻らなかった。"}, {"num": "1901", "word": "quell", "phonetic": "[kwel]", "trans": "を抑える, を鎮める [= soothe, suppress]", "ex_eng": "He quelled his fear and dove into the river to rescue the boy.", "ex_trans": "彼は恐怖心を抑え, 少年を救助するために川に飛び込んだ。"}, {"num": "1902", "word": "quench", "phonetic": "[kwentʃ]", "trans": "(渇き)を癒やす [= satisfy, relieve, slake] , (欲望)を抑える [= subdue, suppress]", "ex_eng": "After hours in the hot sun, he drank several beers to quench his thirst.", "ex_trans": "暑い日なたに何時間もいた後, 彼は喉の渇きを癒やすためビールを数杯飲んだ。"}, {"num": "1903", "word": "debase", "phonetic": "[dɪbéɪs]", "trans": "(品位・評判)を落とす [=demean]", "ex_eng": "The star debased his reputation by appearing in a series of cheap, sensational movies.", "ex_trans": "一連の安っぽい扇情的な映画に出演したことで, そのスターは評判を落とした。"}, {"num": "1904", "word": "elude", "phonetic": "[ɪlúːd]", "trans": "をうまくかわす, から逃れる [=evade]", "ex_eng": "Although I looked everywhere for my student, she eluded me.", "ex_trans": "私は受け持ちの生徒をあちこち捜したが, 彼女は私からうまく逃れた。"}, {"num": "1905", "word": "refute", "phonetic": "[rifjúːt]", "trans": "を論破する [=disprove], に反駁する", "ex_eng": "The politician finally succeeded in refuting his enemies' accusations.", "ex_trans": "その政治家はついに政敵たちの非難を論破することに成功した。"}, {"num": "1906", "word": "rebut", "phonetic": "[ribʌ́t]", "trans": "に反論する, の反証を挙げる", "ex_eng": "The defense lawyer successfully rebutted all the prosecutor's claims.", "ex_trans": "被告側の弁護士は見事に検察官のすべての主張に反論した。"}, {"num": "1907", "word": "lambaste", "phonetic": "[læmbéist]", "trans": "を厳しくとがめる, をひどく殴る", "ex_eng": "The newspaper editorial lambasted the government for their poor economic policies.", "ex_trans": "その新聞の社説は経済政策が拙劣だと政府を厳しくとがめた。"}, {"num": "1908", "word": "purge", "phonetic": "[pə́ːrdʒ]", "trans": "から追放する, を清める", "ex_eng": "The mayor promised to purge the police of corrupt officers.", "ex_trans": "市長は警察から汚職警官を追放すると約束した。"}, {"num": "1909", "word": "renege", "phonetic": "[riníːg]", "trans": "破る", "ex_eng": "Suddenly, the bank reneged on its promise of a loan.", "ex_trans": "その銀行は突然融資の約束を破った。"}, {"num": "1910", "word": "thwart", "phonetic": "[θwɔːrt]", "trans": "(計画など)を阻止する, を挫折させる [=foil, frustrate, baffle, prevent]", "ex_eng": "The FBI managed to thwart a terrorist plan to attack government buildings.", "ex_trans": "FBIは、政府の建物を攻撃するテロリストの計画を何とか阻止することができた。"}, {"num": "1911", "word": "dislodge", "phonetic": "[dislά(ː)dʒ]", "trans": "(敵)を退陣させる〈from ～から〉, を除去する [=remove]", "ex_eng": " improvise", "phonetic": "[ímprəvàɪz]", "trans": "即興で演奏する, を即席で作る [=extemporize]", "ex_eng": "Jazz musicians must improvise as they play their music.", "ex_trans": "ジャズミュージシャンは演奏中に即興で演奏しなければならない。"}, {"num": "1921", "word": "mesmerize", "phonetic": "[mézməràiz]", "trans": "を魅了する, に催眠術をかける", "ex_eng": "Students were mesmerized by his astonishing lectures.", "ex_trans": "学生たちは彼の驚くべき講義に魅了された。"}, {"num": "1922", "word": "remit", "phonetic": "[rimít]", "trans": "を送金する, を免じる", "ex_eng": "I agreed to remit the balance of my account within thirty days.", "ex_trans": "私は30日以内に勘定の残高を送金することに同意した。"}, {"num": "1923", "word": "redeem", "phonetic": "[ridíːm]", "trans": "(紙幣)を兌換する, を買い戻す, (名誉など)を回復する", "ex_eng": "In the past, American dollars could be redeemed for gold at certain banks.", "ex_trans": "昔は, アメリカのドルは特定の銀行で金と兌換することができた。"}, {"num": "1924", "word": "congregate", "phonetic": "[kά(ɔ)ŋɡrəɡèit]", "trans": "集まる", "ex_eng": "The principal told the children to congregate in front of the school at 8 a.m.", "ex_trans": "校長先生は子供たちに, 午前8時に学校前に集合するよう言った。"}, {"num": "1925", "word": "censure", "phonetic": "[sénʃər]", "trans": "を非難する 〈for 〜のことで〉 [=criticize, blame] / 非難", "ex_eng": "After he was publicly censured, the high-ranking government official resigned from office.", "ex_trans": "公にけん責された後、その政府高官は辞職した。"}, {"num": "1926", "word": "coax", "phonetic": "[kouks]", "trans": "(coax A into Bで) AをなだめてBをさせる [=persuade, entice]", "ex_eng": "The police officer tried to coax the old lady’s cat into coming down from the tree.", "ex_trans": "警官はそのおばあさんの猫をなだめて木から降りて来させようとした。"}, {"num": "1927", "word": "astound", "phonetic": "[əstáund]", "trans": "をびっくり仰天させる [=astonish, stun]", "ex_eng": "Many scientists were astounded at reports of primitive life on Mars.", "ex_trans": "多くの科学者が火星上の原始生命の報告を聞いてびっくり仰天した。"}, {"num": "1928", "word": "absolve", "phonetic": "[əbzá(:)lv]", "trans": "を解放する 〈of 義務・約束などから〉, を免除する [=acquit]", "ex_eng": "The official inquiry absolved him of any responsibility for the accident cy, propriety] / perfect decorum 完璧な礼儀作法", "ex_eng": "Students at the girls' school were told to maintain decorum at all times.", "ex_trans": "その女子校の生徒たちは, 常に礼儀正しさを保つように言われた。"}, {"num": "1938", "word": "fidelity", "phonetic": "[fɪdéləti]", "trans": "忠誠心 〈to 〜に対する〉 [=loyalty]", "ex_eng": "The assistant was known for his intense fidelity to his boss.", "ex_trans": "そのアシスタントは上司への高い忠誠心で知られていた。"}, {"num": "1939", "word": "duplicity", "phonetic": "[djuplísəti]", "trans": "二枚舌 [= deceit, double-dealing]", "ex_eng": "When we could no longer tolerate her duplicity, we confronted her directly.", "ex_trans": "彼女の二枚舌にもはや我慢できず, 私たちは彼女と直接対決した。"}, {"num": "1940", "word": "indolence", "phonetic": "[índələns]", "trans": "怠惰 [= idleness]", "ex_eng": "The teacher felt irritated by the indolence of his students.", "ex_trans": "その教師は生徒たちの怠惰にいら立ちを感じた。"}, {"num": "1941", "word": "conveyance", "phonetic": "[kənvéiəns]", "trans": "輸送 (機関), (権利の) 譲渡 [= transfer]", "ex_eng": "The millionaire paid for the conveyance of the tents to the area affected by the earthquake.", "ex_trans": "その富豪は, 地震の被災地に送るテントの輸送費用を負担した。"}, {"num": "1942", "word": "contraband", "phonetic": "[kád(ə)ntrəbànd]", "trans": "(集合的に) 密輸品 [= smuggled goods]", "ex_eng": "It was suspected that the boat carried contraband, though none was found.", "ex_trans": "その船は密輸品を運んでいるという疑いをかけられたが, 何も見つからなかった。"}, {"num": "1943", "word": "contingency", "phonetic": "[kəntíndʒənsi]", "trans": "不慮の出来事 [=accident] , 偶然 [=chance] , 不確実 [=uncertainty]", "ex_eng": "The mayor insisted on preparing the city for any contingency.", "ex_trans": "市長は市がいかなる不慮の出来事にも備えることを主張した。"}, {"num": "1944", "word": "jest", "phonetic": "[dʒest]", "trans": "冗談 [=joke]", "ex_eng": "The announcer's casual jest offended many viewers.", "ex_trans": "そのアナウンサーの何気ない冗談が多く視聴者の怒りを買った。"}, {"num": "1945", "word": "misgiving", "phonetic": "[mɪsˈgɪvɪŋ]", "trans": "(通例 ~s) 不安 〈about 〜に関する〉 , 疑念 [=doubt]", "ex_eng": "Many had serious misgivings about the new plan to restructure the comp
