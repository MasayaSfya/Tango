ng combination.", "ex_trans": "彼のピアノの技量と彼女の美声は, 必勝のコンビになった。"}, {"num": "2104", "word": "adhere to ~", "phonetic": "ædhíər tuː", "trans": "~に従う, ~を忠実に守る [=stick to]", "ex_eng": "I must ask you to adhere to the terms of our agreement and not reveal any information to outsiders.", "ex_trans": "われわれの合意の条件に従っていただき, 情報は一切外部に漏らさないようお願いしたい。"}, {"num": "2105", "word": "attribute A to B", "phonetic": "ətríbjuːt ［名詞は ǽtribjùːt］", "trans": "AはBに起因すると考える", "ex_eng": "The writer attributed his success to luck and good teachers.", "ex_trans": "その作家は自身の成功を運とよい先生たちのおかげだと考えた。"}, {"num": "2106", "word": "back out", "phonetic": "bæk aʊt", "trans": "(約束・契約などを) 破棄する", "ex_eng": "The two banks were all set to merge when one of them suddenly backed out of the agreement.", "ex_trans": "2つの銀行の合併の手はずがすっかり整ったそのとき, 突然一方が合意を破棄した。"}, {"num": "2107", "word": "bail out", "phonetic": "beɪl aʊt", "trans": "(企業などを) 救済する, 〜を保釈する", "ex_eng": "The central bank was criticized for bailing out companies that had made risky loans.", "ex_trans": "リスクの高い融資を行った企業を救済したことで, 中央銀行は批判された。"}, {"num": "2108", "word": "bank on ~", "phonetic": "bæŋk ɑːn", "trans": "〜を当てにする [=depend on]", "ex_eng": "The president always banks on the hardworking nature of his employees.", "ex_trans": "社長は従業員たちのよく働く性格を常に当てにしている。"}, {"num": "2109", "word": "bargain on ~", "phonetic": "bɑ́ːrɡən ɑːn", "trans": "〜 (があるだろう) と思う", "ex_eng": "The small political party warned the government not to bargain on their support of the new law.", "ex_trans": "その小政党は政府に, 自分たちが新法を支持するとは思わないようにと警告した。"}, {"num": "2110", "word": "barge through ~", "phonetic": "bɑ́ːrdʒ θruː", "trans": "〜をかき分けて進む [=push through]", "ex_eng": "Guests had to barge through a crowd of journalists who were waiting for the pop star in front of the hotel.", "ex_trans": "客はホテルの前で人気歌手を待つ記者の群れをかき分けて進まなければならなかった。"}, {"num": "2111", "word": "bawl out", "phonetic": "bɔːl aʊt", "trans": "〜を厳しく叱りとばす", "ex_eng": "His teacher bawled him out for missing the math test.", "ex_trans": "先生は彼が数学のテストを受けなかったことで彼を厳しく叱りとばした。"}, {"num": "2112", "word": "beef up", "phonetic": "biːf ʌp", "trans": "〜を強化する", "ex_eng": "The company headhunted a number of specialists in order to beef up its IT department.", "ex_trans": "その企業はIT部門を強化するため，専門家を数名ヘッドハンティングした。"}, {"num": "2113", "word": "belt out", "phonetic": "belt aʊt", "trans": "〜を大声で歌う", "ex_eng": "At the end of the ceremony, the students belted out the school song.", "ex_trans": "式典の最後に生徒たちは校歌を大声で歌った。"}, {"num": "2114", "word": "blot out", "phonetic": "blɑːt aʊt", "trans": "〜を消し去る", "ex_eng": "The woman did her best to blot out all memory of the incident.", "ex_trans": "女性はその出来事のすべての記憶を消し去るために最善を尽くした。"}, {"num": "2115", "word": "blurt out", "phonetic": "blə́ːrt aʊt", "trans": "〜を出し抜けに言い出す", "ex_eng": "At first the witness remained silent, but after a while, he blurted out what had really happened.", "ex_trans": "目撃者は最初沈黙を守っていたが，しばらくして本当に起こったことを出し抜けに話し始めた。"}, {"num": "2116", "word": "boil down to ~", "phonetic": "bɔɪl daʊn tuː", "trans": "〜に帰着する", "ex_eng": "The dispute between the two countries boiled down to the question of which was the rightful owner of the island.", "ex_trans": "その2国間の紛争は，詰まるところその島の正当な所有者はどちらかという問題だった。"}, {"num": "2117", "word": "bottle up", "phonetic": "bɑ́ːtl ʌp", "trans": "(感情などを)抑える", "ex_eng": "The young man had a tendency to bottle up his feelings and then suddenly explode with anger.", "ex_trans": "その若い男性には，感情を押し殺したかと思うと突然怒りを爆発させる傾向があった。"}, {"num": "2118", "word": "bottom out", "phonetic": "bɑ́ːtəm aʊt", "trans": "底値を打つ", "ex_eng": "He was lucky to have sold his stock in the company before its value bottomed out.", "ex_trans": "その会社の株価が底値を打つ前に株を売ることができて彼は幸運だった。"}, {"num": "2119", "word": "bow out", "phonetic": "baʊ aʊt", "trans": "辞任する", "ex_eng": "The retiring chairman said he intended to bow out gracefully.", "ex_trans": "退任の近い会長は、潔く辞任するつもりだと言った。"}, {"num": "2120", "word": "bowl over", "phonetic": "boʊl óʊvər", "trans": "〜を非常に驚かせる", "ex_eng": "The girls at the school were bowled over by their handsome new French teacher.", "ex_trans": "その学校の女子たちは、新任のハンサムなフランス語教師に唖然となった。"}, {"num": "2121", "word": "box up", "phonetic": "bɑːks ʌp", "trans": "〜を箱詰めする", "ex_eng": "Her parents boxed up her belongings and sent them to her.", "ex_trans": "両親は彼女の持ち物を箱詰めし、彼女に送った。"}, {"num": "2122", "word": "breeze in", "phonetic": "briːz ɪn", "trans": "すっと入って来る", "ex_eng": "The new employee breezed in two hours late and sat down without even apologizing.", "ex_trans": "その新しい社員は2時間遅刻して何食わぬ顔で入って来て、謝罪もなしに座った。"}, {"num": "2123", "word": "brim over", "phonetic": "brɪm óʊvər", "trans": "みなぎる ［=be full］", "ex_eng": "The new parents were brimming over with joy at the birth of their baby.", "ex_trans": "初めて親になった2人は赤ん坊が生まれた喜びであふれんばかりだった。"}, {"num": "2124", "word": "buckle down", "phonetic": "bʌ́kl daʊn", "trans": "(仕事などに) 本気で取りかかる", "ex_eng": "After having a cup of coffee, he buckled down to writing the report and finished it in an hour.", "ex_trans": "コーヒーを飲んだ後、彼はレポート書きに真剣に取り組み, 1時間で書き終えた。"}, {"num": "2125", "word": "bunch up", "phonetic": "bʌntʃ ʌp", "trans": "ひと固まりに集まる, 〜をひと固まりに集める", "ex_eng": "The students stood bunched up in one corner of the room.", "ex_trans": "生徒たちは部屋の隅にひと固まりになって立った。"}, {"num": "2126", "word": "butt in", "phonetic": "bʌt ɪn", "trans": "口を挟む [=horn in, cut in]", "ex_eng": "As she explained the situation, her husband kept butting in and correcting her remarks.", "ex_trans": "彼女が状況について説明していると, 夫が口を挟んで, 彼女の発言を訂正し続けた。"}, {"num": "2127", "word": "butter up", "phonetic": "bʌ́tər ʌp", "trans": "〜にごまをする [=flatter, apple-polish]", "ex_eng": "I hate being buttered up by students who think that compliments will win them a good grade.", "ex_trans": "お世辞を言えばいい成績が取れると思っている学生にごまをすられるのが私は大嫌いだ。"}, {"num": "2128", "word": "buy off", "phonetic": "baɪ ɔːf", "trans": "〜を買収する [=bribe]", "ex_eng": "The crooked businessman tried to buy off the local police, but he was arrested for bribery instead.", "ex_trans": "その悪徳業者は地元警察を買収しようとしたが, 反対に贈賄で逮捕された。"}, {"num": "2129", "word": "capitalize on ~", "phonetic": "kǽpətəlàɪz ɑːn", "trans": "〜に乗じる [=take advantage of, cash in on]", "ex_eng": "The band tried to capitalize on their initial success, but were unable to write another hit song.", "ex_trans": "そのバンドは最初の成功に乗じようとしたが, もうヒット曲を書くことはできなかった。"}, {"num": "2130", "word": "cart off", "phonetic": "kɑːrt ɔːf", "trans": "〜を運び去る", "ex_eng": "Some men arrived and began to cart off the old office furniture that was no longer wanted by the company.", "ex_trans": "男性が何人かやって来て, 会社ではもう不要になった古いオフィス家具を運び去り始めた。"}, {"num": "2131", "word": "carve up", "phonetic": "kɑːrv ʌp", "trans": "〜を分割する [=divide]", "ex_eng": "The victorious nations carved up the territory into colonies.", "ex_trans": "戦勝国はその領土を分割して植民地にした。"}, {"num": "2132", "word": "cash in on 〜", "phonetic": "kæʃ ɪn ɑːn", "trans": "〜に乗じる [=take advantage of, capitalize on]", "ex_eng": "In an attempt to cash in on the China fad, the TV network dramatized a classic Chinese novel.", "ex_trans": "中国ブームに乗じようと, そのテレビネットワークは中国の古典小説をドラマ化した。"}, {"num": "2133", "word": "cast off", "phonetic": "kæst ɔːf", "trans": "〜を捨て去る", "ex_eng": "After the pop star became famous, he quickly cast off his previous girlfriend and began dating a glamorous model.", "ex_trans": "その人気歌手は有名になるとすぐに前の恋人を捨て, 魅力的なモデルと付き合い始めた。"}, {"num": "2134", "word": "cater to 〜", "phonetic": "kéɪtər tuː", "trans": "〜の要求を満たす", "ex_eng": "The small hotel was proud of catering to every need, however strange, of its wealthy clientele.", "ex_trans": "その小さなホテルは, どんな奇妙な要求だろうと, 裕福な顧客たちのあらゆる要求に応えるのが誇りだった。"}, {"num": "2135", "word": "cave in", "phonetic": "keɪv ɪn", "trans": "屈服する", "ex_eng": "After days of negotiations, the management finally caved in to the union's demands.", "ex_trans": "何日もの交渉の後, 経営者側はついに組合の要求に屈した。"}, {"num": "2136", "word": "change over", "phonetic": "tʃeɪndʒ óʊvər", "trans": "交代する [=take turns]", "ex_eng": "On their journey, the two drivers changed over every few hours.", "ex_trans": "旅行中, 2人の運転手は数時間ごとに交代した。"}, {"num": "2137", "word": "chew out", "phonetic": "tʃuː aʊt", "trans": "〜を叱りとばす", "ex_eng": "After being chewed out by his professor for his sloppy work, the student was in a thoroughly bad mood.", "ex_trans": "研究がいい加減だと教授に叱り付けられた後, その学生は完全にご機嫌斜めだった。"}, {"num": "2138", "word": "chime in", "phonetic": "tʃaɪm ɪn", "trans": "話に加わる", "ex_eng": "When the boy complained about the grade, the other students quickly chimed in.", "ex_trans": "その成績に少年が不平を言うと, ほかの生徒たちもすぐに話に加わった。"}, {"num": "2139", "word": "chip away at ~", "phonetic": "tʃɪp əw0éɪ æt", "trans": "〜を徐々に減らす", "ex_eng": "In the second week of the campaign, the challenger began to chip away at the president's lead in the polls.", "ex_trans": "選挙戦の2週目に, 挑戦者は世論調査でリードする大統領との差を少しずつ縮め始めた。"}, {"num": "2140", "word": "choke back", "phonetic": "tʃoʊk bæk", "trans": "(涙・怒りなど) をこらえる", "ex_eng": "Although he was angry, he choked back his complaints and remained silent.", "ex_trans": "彼は怒っていたが, 文句を言うのをこらえて黙っていた。"}, {"num": "2141", "word": "choke off", "phonetic": "tʃoʊk ɔːf", "trans": "(供給など)を止める", "ex_eng": "The army hoped that, by destroying the poppy crop, it could choke off the supply of opium to its troops.", "ex_trans": "ケシ畑を壊滅させることで部隊へのアヘンの供給を断つことができる, と軍は願った。"}, {"num": "2142", "word": "choke up", "phonetic": "tʃoʊk ʌp", "trans": "(感情の高ぶりで) 絶句する", "ex_eng": "As she told the story of the horrifying experience, the victim choked up and became unable to continue.", "ex_trans": "その恐ろしい経験の話をしていた被害者は言葉に詰まり, 話し続けられなくなった。"}, {"num": "2143", "word": "chug along", "phonetic": "tʃʌɡ əlɔ́ːŋ", "trans": "しゅっしゅっと音を立てて～を進む", "ex_eng": "The old tugboat was chugging along the coastal route, but then it suddenly came to a halt.", "ex_trans": "古いタグボートは海岸沿いのルートをしゅっしゅっと進んでいたが, 突然停止した。"}, {"num": "2144", "word": "churn out", "phonetic": "tʃə́ːrn ʌp", "trans": "～を (機械的に) 大量生産する [=crank out, grind out]", "ex_eng": "The writer found it easy to come up with plots for his detective stories, and so he churned out two a year for many years.", "ex_trans": "その作家は推理小説のプロットを簡単に思い付いたので, 何年もの間1年に2作を量産した。"}, {"num": "2145", "word": "clam up", "phonetic": "klæm ʌp", "trans": "黙り込む [=fall silent]", "ex_eng": "When the teacher questioned the boy, he clammed up immediately.", "ex_trans": "先生に質問されると, 少年はすぐさま黙り込んだ。"}, {"num": "2146", "word": "clog up", "phonetic": "klɑːɡ ʌp", "trans": "～を詰まらせる", "ex_eng": "Over time, mud and vegetation had clogged up the drains, and they were no longer functioning.", "ex_trans": "長年の間に泥と草が排水路を詰まらせており, 排水路はもはや機能していなかった。"}, {"num": "2147", "word": "cloud up", "phonetic": "klaʊd ʌp", "trans": "曇る", "ex_eng": "As he ran the hot bath, the mirror clouded up and he was no longer able to see his reflection.", "ex_trans": "風呂にお湯を入れると鏡が曇り、彼ももはや自分の映った姿が見えなかった。"}, {"num": "2148", "word": "coast along", "phonetic": "koʊst əlɔ́ːŋ", "trans": "気楽に（行動）する", "ex_eng": "His father warned him not to waste his life by coasting along and avoiding any challenges.", "ex_trans": "父親は彼に、のらりくらり生きて困難から逃げ続けることで人生を無駄にするなと警告した。"}, {"num": "2149", "word": "come around", "phonetic": "kʌm əráʊnd", "trans": "意見を変える", "ex_eng": "She knew that if she waited long enough, her husband would eventually come around and agree with her plan.", "ex_trans": "十分長い間待てば夫は最終的に考えを変えて計画に同意してくれる, と彼女にはわかっていた。"}, {"num": "2150", "word": "come down on A", "phonetic": "kʌm daʊn ɑːn", "trans": "Aを厳しく叱る", "ex_eng": "The manager came down on the staff for being late to the meeting.", "ex_trans": "マネージャーは，会議に遅れたことを理由にスタッフを厳しく叱った。"}, {"num": "2151", "word": "come in at ~", "phonetic": "kʌm ɪn æt", "trans": "（の値段）で売られている", "ex_eng": "As the velvet came in at over 1,000 dollars a roll, the designer was reluctant to use it for curtains.", "ex_trans": "そのベルベットは一巻き千ドル以上の価格で売られており, デザイナーはそれをカーテンに使いたくなかった。"}, {"num": "2152", "word": "come in for ~", "phonetic": "kʌm ɪn fɔːr", "trans": "（非難など）を受ける [=be subjected to]", "ex_eng": "After the riot, the police came in for a lot of criticism for their handling of the incident.", "ex_trans": "暴動の後，警察は事件の処理に関して多くの非難を受けた。"}, {"num": "2153", "word": "coop up", "phonetic": "kuːp ʌp", "trans": "〜を閉じ込める", "ex_eng": "The children were cooped up indoors by the rain which fell all day.", "ex_trans": "子供たちは1日中降った雨で室内に閉じ込められた。"}, {"num": "2154", "word": "cop out", "phonetic": "kɑːp aʊt", "trans": "約束に背く, (責任などから) 逃避する", "ex_eng": "The employee said that he would oppose the boss's plan, but at the last moment he copped out and remained silent.", "ex_trans": "その社員は上司の計画に反対すると言ったのに、土壇場になって約束に背き, ずっと黙っていた。"}, {"num": "2155", "word": "crack down on ~", "phonetic": "kræk daʊn ɑːn", "trans": "〜を厳しく取り締まる", "ex_eng": "The principal warned that he was going to crack down on students copying their homework from each other.", "ex_trans": "生徒がお互いの宿題を写し合うことを厳しく取り締まるつもりだ, と校長は警告した。"}, {"num": "2156", "word": "crack up", "phonetic": "kræk ʌp", "trans": "精神的に参る, 笑いこける", "ex_eng": "He cracked up under the pressure of his job and had to spend six months on leave to recover.", "ex_trans": "彼は仕事の重圧で精神的に参ってしまい, 回復するために半年休みを取らなければならなかった。"}, {"num": "2157", "word": "crank out", "phonetic": "kræŋk aʊt", "trans": "〜を機械的に量産する [=churn out, grind out]", "ex_eng": "The thriller writer cranked out a novel a year for ten years.", "ex_trans": "そのスリラー作家は10年間, 年に1冊の割合で小説を次々と量産した。"}, {"num": "2158", "word": "creep into ~", "phonetic": "kriːp ɪ́ntuː", "trans": "(感情・間違いなどが) 〜に入り込む", "ex_eng": "A suspicion that he was being cheated crept into his mind.", "ex_trans": "彼の心に彼が騙されているという疑惑が忍び込んだ。"}, {"num": "2159", "word": "crop up", "phonetic": "krɑːp ʌp", "trans": "(問題などが) 急に持ち上がる [=come up]", "ex_eng": "The launch of the new car was delayed after a number of small problems cropped up at the last moment.", "ex_trans": "土壇場になっていくつか小さな問題が持ち上がった後, 新車の発売は延期された。"}, {"num": "2160", "word": "dawn on A", "phonetic": "dɔːn ɑːn", "trans": "Aに初めてわかる", "ex_eng": "After the third time the girl canceled their date, it began to dawn on him that she was not interested in him.", "ex_trans": "その女の子にデートを3回キャンセルされた後, 自分には関心がないのだとやっと彼にわかり始めた。"}, {"num": "2161", "word": "deck out", "phonetic": "dek aʊt", "trans": "〜を飾る [=decorate]", "ex_eng": "The building was decked out with flags and banners to celebrate the anniversary of the country's victory.", "ex_trans": "国の戦勝記念日を祝うため, その建物は旗と横断幕で飾られていた。"}, {"num": "2162", "word": "defer to ~", "phonetic": "dɪfə́ːr tuː", "trans": "(敬意を表して) 〜に従う, 〜を尊重する", "ex_eng": "Deferring to his boss, the department head agreed to sack the young man.", "ex_trans": "上司の考えに従い, 部長はその若い男性を首にすることに同意した。"}, {"num": "2163", "word": "detract from ~", "phonetic": "dɪtrǽkt frʌm", "trans": "(価値など) を損なう [=take away from]", "ex_eng": "His latest book was a failure but did not detract much from his good reputation.", "ex_trans": "彼の最新刊は失敗作だったが, 彼の名声をそれほど損なうことはなかった。"}, {"num": "2164", "word": "dip into", "phonetic": "dɪp ɪ́ntuː", "trans": "(貯金など) に手をつける", "ex_eng": "The little boy dipped into his piggy bank to buy the latest toy.", "ex_trans": "その小さな男の子は, 最新のおもちゃを買うため貯金箱のお金に手をつ けた."}, {"num": "2165", "word": "dispense with ~", "phonetic": "dɪspéns wɪð", "trans": "~なしで済ませる", "ex_eng": "The school decided to dispense with the services of the caretaker.", "ex_trans": "その学校は管理人の業務なしで済ませることに決めた。"}, {"num": "2166", "word": "distract A from B", "phonetic": "dɪstrǽkt frʌm", "trans": "BからAの気を散らす", "ex_eng": "She told her husband not to distract their son from his homework.", "ex_trans": "彼女は夫に, 宿題から息子の気を散らさないでと言った。"}, {"num": "2167", "word": "dole out", "phonetic": "doʊl aʊt", "trans": "~を配る", "ex_eng": "Their mother kept the cookies in a locked cupboard and only doled out one a day to each of them.", "ex_trans": "彼らの母親はクッキーを鍵のかかった戸棚にしまっていて, 1人に1日1枚ずつ配るだけだった。"}, {"num": "2168", "word": "dote on A", "phonetic": "doʊt ɑːn", "trans": "Aを溺愛する", "ex_eng": "Both sets of grandparents doted on the new baby.", "ex_trans": "両家の祖父母は生まれたばかりの赤ん坊を溺愛した。"}, {"num": "2169", "word": "drag on", "phonetic": "dræɡ ɑːn", "trans": "(会議などが) だらだら長引く", "ex_eng": "As the lecture dragged on, the audience gradually became more and more restless.", "ex_trans": "講演がだらだら長引くと, 聴衆はどんどん落ち着かなくなっていった。"}, {"num": "2170", "word": "draw A into B", "phonetic": "drɔː ɪ́ntuː", "trans": "AをBに引き込む", "ex_eng": "The small country did its best to avoid getting drawn into the conflict between its two large neighbors.", "ex_trans": "その小国は, 隣接する2つの大国間の争いに引き込まれるのを避けるため最善を尽くした。"}, {"num": "2171", "word": "drone on", "phonetic": "droʊn ɑːn", "trans": "だらだら話す", "ex_eng": "He hated listening to his father drone on about how much better things had been in the old days.", "ex_trans": "昔は何でもずっとよかったのに, といったことを父親がだらだら話すのを聞くのが彼は嫌だった。"}, {"num": "2172", "word": "drown out", "phonetic": "draʊn aʊt", "trans": "〜を（かき）消す", "ex_eng": "He turned up the volume of his TV to drown out the sound of heavy traffic outside his home.", "ex_trans": "彼はテレビの音量を上げて, 家の外の激しい交通量の音をかき消した。"}, {"num": "2173", "word": "drum up", "phonetic": "drʌm ʌp", "trans": "（支持・取引など）を懸命に得ようとする", "ex_eng": "He went from door to door trying to drum up support for his campaign against the new supermarket.", "ex_trans": "スーパーマーケット新設に反対する運動への支援を得るべく, 彼は一軒一軒家を回った。"}, {"num": "2174", "word": "duck out", "phonetic": "dʌk aʊt", "trans": "（仕事・責任などを）逃れる", "ex_eng": "It was said that the politician had used family connections to duck out of military service during the war.", "ex_trans": "その政治家は家族のコネを使って戦時中に兵役を逃れたと言われていた。"}, {"num": "2175", "word": "dwell on ~", "phonetic": "dwel ɑːn", "trans": "〜を力説する, 〜を長々と話す", "ex_eng": "In his speech, the school principal dwelt on the need for students to prepare properly for classes.", "ex_trans": "校長はスピーチの中で, 生徒たちが授業の準備をきちんとすることの必要性を力説した。"}, {"num": "2176", "word": "ease off", "phonetic": "iːz ɔːf", "trans": "(雨などが) 小降りになる, 和らぐ, 緩む [=calm down]", "ex_eng": "The campers were finally able to set up their tent after the rain began to ease off.", "ex_trans": "雨が小降りになり始めてから, キャンパーたちはようやくテントを張ることができた。"}, {"num": "2177", "word": "ease up on ~", "phonetic": "iːz ʌp ɑːn", "trans": "〜をほどほどにする", "ex_eng": "Following his doctor's advice, he decided to ease up on high-calorie snacks.", "ex_trans": "かかりつけ医師のアドバイスに従って, 彼は高カロリーのお菓子を控えることに決めた。"}, {"num": "2178", "word": "egg on", "phonetic": "eɡ ɑːn", "trans": "〜をそそのかす", "ex_eng": "The boy's friends stood around, egging him on to fight the bully.", "ex_trans": "少年の友人たちが周りを取り囲み, そのいじめっ子と戦えと少年をけしかけた。"}, {"num": "2179", "word": "eke out", "phonetic": "iːk aʊt", "trans": "(生計) を何とかして立てる, 〜の不足分を補う [=make up for]", "ex_eng": "For a few years, he eked out a living doing odd jobs.", "ex_trans": "2, 3年間, 彼はいろんなアルバイトをして生計を立てた。"}, {"num": "2180", "word": "etch A into B", "phonetic": "etʃ ɪ́ntuː", "trans": "AをBに深く印象付ける", "ex_eng": "The scene of the crash was etched into his memory, and even today he can easily recall every detail.", "ex_trans": "衝突事故の光景は彼の記憶に深く刻み込まれ, 今でも彼は細部の一つ一つを容易に思い出すことができる。"}, {"num": "2181", "word": "factor in", "phonetic": "fǽktər ɪn", "trans": "〜を考慮に入れる [=allow for, take ~ into consideration]", "ex_eng": "After factoring in all the expenses, they decided the plan would not make a profit.", "ex_trans": "すべての経費を考慮に入れた後, 彼らはその計画は利益が出ないと判断した。"}, {"num": "2182", "word": "fall back on ~", "phonetic": "fɔːl bæk ɑːn", "trans": "(いざという時に) 〜に頼る", "ex_eng": "The teacher assured her that she could always fall back on him.", "ex_trans": "いつでも自分に頼っていいと言って先生は彼女を安心させた。"}, {"num": "2183", "word": "fall flat", "phonetic": "fɔːl flæt", "trans": "失敗に終わる [=get nowhere]", "ex_eng": "The advertising campaign fell flat when its star was arrested.", "ex_trans": "起用したスターが逮捕されて, その広告キャンペーンは失敗に終わった。"}, {"num": "2184", "word": "fall in with A", "phonetic": "fɔːl ɪn wɪð", "trans": "Aとたまたま付き合うようになる", "ex_eng": "During his college years, he fell in with a bad crowd and dropped out of school eventually.", "ex_trans": "彼は大学生の時に悪い仲間と付き合うようになり, ついに学校を辞めた。"}, {"num": "2185", "word": "fall through", "phonetic": "fɔːl θruː", "trans": "(計画などが) 駄目になる", "ex_eng": "As long as the deal doesn't fall through at the last moment, the contract will be signed next Friday.", "ex_trans": "商談が土壇場で頓挫しない限り, 契約は次の金曜日に締結される。"}, {"num": "2186", "word": "fan out", "phonetic": "fæn aʊt", "trans": "四方八方に散らばる", "ex_eng": "Volunteers fanned out over the countryside in their search for the missing girl.", "ex_trans": "行方不明になった少女を捜して, ボランティアたちが田園地帯の四方八方に散らばった。"}, {"num": "2187", "word": "farm out", "phonetic": "fɑːrm aʊt", "trans": "〜を下請けに出す [=contract out]", "ex_eng": "When he was busy, the translator farmed out work to his students.", "ex_trans": "忙しいとき, その翻訳家は教え子たちに仕事を下請けに出した。"}, {"num": "2188", "word": "fawn over A", "phonetic": "fɔːn óʊvər", "trans": "Aにへつらう", "ex_eng": "The hotel staff fawned over the visiting film star as if he were royalty.", "ex_trans": "ホテルのスタッフは、訪れた映画スターが王族であるかのようにへつらった。"}, {"num": "2189", "word": "fend for oneself", "phonetic": "fend fɔːr wʌnsélf", "trans": "自力で生きていく", "ex_eng": "After her husband passed away, the widow had to fend for herself.", "ex_trans": "夫が亡くなった後、その未亡人は自力で生きていかなければならなかった。"}, {"num": "2190", "word": "fend off", "phonetic": "fend ɔːf", "trans": "(質問)をかわす", "ex_eng": "The singer tried to fend off questions about the rumor by talking about her new album.", "ex_trans": "その歌手は自身の新しいアルバムの話をして、うわさに関する質問をかわそうとした。"}, {"num": "2191", "word": "fire away", "phonetic": "fáɪər əw0éɪ", "trans": "質問を始める, 話し始める", "ex_eng": "The actor, anxious to promote his new movie, told the reporter to fire away with his questions.", "ex_trans": "自分の新作映画を宣伝したいその俳優は、質問を始めるよう記者に言った。"}, {"num": "2192", "word": "fizzle out", "phonetic": "fízl aʊt", "trans": "途中で失敗に終わる", "ex_eng": "The protest eventually fizzled out after it began to rain heavily.", "ex_trans": "大雨が降り出した後、抗議運動は最終的に尻すぼみに終わった。"}, {"num": "2193", "word": "flare up", "phonetic": "fler ʌp", "trans": "かっとなる", "ex_eng": "Sometimes her boss flared up at her for no clear reason.", "ex_trans": "彼女の上司は、はっきりした理由もなく時折彼女にかっとなった。"}, {"num": "2194", "word": "flesh out", "phonetic": "fleʃ aʊt", "trans": "〜に肉付けする, 〜を具体化する [=embody]", "ex_eng": "The teacher told her to flesh out her idea a bit and then bring it back for further consideration.", "ex_trans": "考えにもう少し肉付けしてから, さらなる検討に向けて再提出するように, と先生は彼女に言った。"}, {"num": "2195", "word": "flick through", "phonetic": "flɪk θruː", "trans": "(本など) をぱらぱらめくる", "ex_eng": "The detective flicked through his notebook until he found the page that he was looking for.", "ex_trans": "探しているページが見つかるまで, 刑事はノートをぱらぱらめくった。"}, {"num": "2196", "word": "flip out", "phonetic": "flɪp aʊt", "trans": "かっとなる, ひどく興奮する", "ex_eng": "When he found out he was going to be fired, he flipped out completely.", "ex_trans": "首になるとわかると, 彼は完全に怒り狂った。"}, {"num": "2197", "word": "flood in", "phonetic": "flʌd ɪn", "trans": "殺到する [=pour in]", "ex_eng": "Invitations for the singer to appear on stage flooded in from TV companies.", "ex_trans": "その歌手への出演依頼がテレビ局から殺到した。"}, {"num": "2198", "word": "fly at ~", "phonetic": "flaɪ æt", "trans": "〜に飛びかかる", "ex_eng": "In the savanna, I saw a lion fly at a group of animals.", "ex_trans": "私はサバンナで, 動物の群れに飛びかかるライオンを見た。"}, {"num": "2199", "word": "follow through", "phonetic": "fɑ́ːloʊ θruː", "trans": "やり遂げる, やり抜く", "ex_eng": "Unfortunately, he failed to follow through on his original offer.", "ex_trans": "残念ながら, 彼は最初の提案を最後までやり通すことができなかった。"}, {"num": "2200", "word": "fork out", "phonetic": "fɔːrk aʊt", "trans": "（大金）を支払う [=shell out]", "ex_eng": "He resented forking out money for his son's graduate studies.", "ex_trans": "彼は息子の大学院での研究に大金を支払うことを腹立たしく思った。"}, {"num": "2201", "word": "fork over", "phonetic": "fɔːrk óʊvər", "trans": "(土など)を(農業用)フォークで掘り返す", "ex_eng": "She planted some seeds in a row and forked over some soil to cover them up.", "ex_trans": "彼女は1列に種を植え, フォークで土を掘り返してかぶせた。"}, {"num": "2202", "word": "foul up", "phonetic": "faʊl ʌp", "trans": "〜でへまをやる", "ex_eng": "Everyone on the team knew that if they fouled up this match, they would be out of the contest.", "ex_trans": "この試合でへまをすると競技会から敗退するとチームの全員がわかっていた。"}, {"num": "2203", "word": "freeze up", "phonetic": "friːz ʌp", "trans": "身動きできなくなる, 口が利かなくなる", "ex_eng": "When he got up to speak, he suddenly froze up and stood there silently.", "ex_trans": "発言しようと立ち上がったとき, 彼は突然体が凍り付き, 黙ったまま立ちすくんだ。"}, {"num": "2204", "word": "fritter away", "phonetic": "frítər əw0éɪ", "trans": "〜を無駄遣いする [=waste, squander]", "ex_eng": "The girl got a part-time job to save up money, but she frittered away her earnings on game apps.", "ex_trans": "少女はお金をためようとアルバイトを始めたが, ゲームアプリに稼ぎを無駄遣いした。"}, {"num": "2205", "word": "front for ~", "phonetic": "frʌnt fɔːr", "trans": "〜の隠れみのとなる", "ex_eng": "It was widely known that the businessman fronted for one of the big drug cartels.", "ex_trans": "その実業家が大規模な麻薬カルテルの1つの隠れみのになっていることは広く知られていた。"}, {"num": "2206", "word": "frown on", "phonetic": "fraʊn ɑːn", "trans": "〜に難色を示す", "ex_eng": "Although the professors were allowed to advertise commercial products, the university frowned on them doing so.", "ex_trans": "教授たちは営利目的の製品の宣伝をすることを許されていたが、大学は彼らがそうすることに難色を示した。"}, {"num": "2207", "word": "gain on ~", "phonetic": "ɡeɪn ɑːn", "trans": "〜に迫る、〜に近付く", "ex_eng": "The new company rapidly began to gain on its rivals in the field.", "ex_trans": "新会社はその分野での競合会社に急速に迫り始めた。"}, {"num": "2208", "word": "gang up on A", "phonetic": "ɡæŋ ʌp ɑːn", "trans": "Aを集団で攻撃する", "ex_eng": "The girl complained that her classmates were always ganging up on her.", "ex_trans": "クラスメートがいつも自分を寄ってたかっていじめる、と少女は苦情を言った。"}, {"num": "2209", "word": "get across", "phonetic": "ɡet əkrɔ́ːs", "trans": "(考えなど)をわからせる", "ex_eng": "The politician used social media to get across his message to his supporters.", "ex_trans": "その政治家は支持者にメッセージを理解させるためにソーシャルメディアを用いた。"}, {"num": "2210", "word": "glance over ~", "phonetic": "ɡlæns óʊvər", "trans": "〜にざっと目を通す", "ex_eng": "He asked one of his colleagues to glance over his presentation and give feedback.", "ex_trans": "彼は同僚の1人に、プレゼンにざっと目を通して意見を聞かせてくれないかと頼んだ。"}, {"num": "2211", "word": "gloss over ~", "phonetic": "ɡlɔːs óʊvər", "trans": "〜を取り繕う", "ex_eng": "You cannot just gloss over his poor performance.", "ex_trans": "君は彼の能力不足を取り繕うわけにはいかないよ。"}, {"num": "2212", "word": "gnaw at ~", "phonetic": "nɔː æt", "trans": "〜を (絶えず) 苦しめる", "ex_eng": "The murder he had committed gnawed at his conscience, and eventually he confessed his crime to the police.", "ex_trans": "自分の犯した殺人が彼の良心を苦しめ, ついに彼は警察に罪を自白した。"}, {"num": "2213", "word": "go at A", "phonetic": "ɡoʊ æt", "trans": "Aを攻撃する [=attack], Aと言い争う", "ex_eng": "In the presidential debate, the two candidates went at each other ferociously.", "ex_trans": "大統領選挙討論会で2人の候補者は激しく互いを攻撃した。"}, {"num": "2214", "word": "go through with ~", "phonetic": "ɡoʊ θruː wɪð", "trans": "〜をやり通す", "ex_eng": "The gang plotted to rob the bank, but in the end they did not go through with their plan.", "ex_trans": "ギャングはその銀行を襲おうとたくらんだが, 結局計画を果たすことはなかった。"}, {"num": "2215", "word": "goof off", "phonetic": "ɡuːf ɔːf", "trans": "怠ける", "ex_eng": "His boss warned him that if she caught him goofing off again, she would fire him on the spot.", "ex_trans": "怠けているところをまた見つけたら即座に首にする, と上司は彼に警告した。"}, {"num": "2216", "word": "grate on ~", "phonetic": "ɡreɪt ɑːn", "trans": "〜に不快感を与える [=annoy, bother]", "ex_eng": "His colleagues' silly jokes about his new haircut eventually began to grate on him.", "ex_trans": "新しい髪型についての同僚たちのくだらない冗談が, ついに彼の気に障り始めた。"}, {"num": "2217", "word": "harp on ~", "phonetic": "hɑːrp ɑːn", "trans": "(同じ話)をしつこく繰り返す", "ex_eng": "She hated the way her boss harped on sticking to their budget all the time.", "ex_trans": "彼女は上司が終始予算を厳守しろとくとくとと言うのが嫌だった。"}, {"num": "2218", "word": "head off", "phonetic": "hed ɔːf", "trans": "～を阻止する [=prevent]", "ex_eng": "The company president said that he was confident they would be able to head off the threat from their new rivals.", "ex_trans": "新参の競合会社による脅威を食い止められる自信はある、と社長は言った。"}, {"num": "2219", "word": "head up", "phonetic": "hed ʌp", "trans": "(組織など) を統率する", "ex_eng": "A young detective was chosen to head up a new unit that would investigate the spate of art thefts.", "ex_trans": "多発する芸術品の盗難を捜査する新部隊を統率するべく、若い刑事が選ばれた。"}, {"num": "2220", "word": "hem in", "phonetic": "hem ɪn", "trans": "～を取り囲む", "ex_eng": "After hemming in the enemy, the army attacked them at dawn.", "ex_trans": "敵を取り囲んだ後、軍隊は夜明けに敵を攻撃した。"}, {"num": "2221", "word": "hike up", "phonetic": "haɪk ʌp", "trans": "～を大幅に [急に] 引き上げる", "ex_eng": "The government decided to raise revenue by hiking up the tax on cigarettes.", "ex_trans": "政府はタバコ税を大幅に引き上げることで歳入を増やすことにした。"}, {"num": "2222", "word": "hinge on ～", "phonetic": "hɪndʒ ɑːn", "trans": "～次第である [=depend on]", "ex_eng": "The team's chance of victory hinged on the performance of its star players.", "ex_trans": "そのチームの勝利の可能性はスター選手たちのパフォーマンスにかかっていた。"}, {"num": "2223", "word": "hold A (to be) B", "phonetic": "hoʊld", "trans": "AをBと見なす", "ex_eng": "Though disgraced by many scandals, the ex-mayor is still held to be a hero in her political circle.", "ex_trans": "多くのスキャンダルで信用を落としたものの，元市長は依然として政治家仲間 の間では英雄と見なされている。"}, {"num": "2224", "word": "hold down", "phonetic": "hoʊld daʊn", "trans": "（職などを）を（がんばって）続ける", "ex_eng": "The young man held down a good job at a high salary.", "ex_trans": "その若者は高給料のいい仕事を手放さずに続けた。"}, {"num": "2225", "word": "hold out on A", "phonetic": "hoʊld aʊt ɑːn", "trans": "Aに隠し事をしている", "ex_eng": "The detective got the impression the informant was holding out on him.", "ex_trans": "刑事は, 情報提供者が自分に隠し事をしているという印象を受けた。"}, {"num": "2226", "word": "hole up", "phonetic": "hoʊl ʌp", "trans": "隠れる", "ex_eng": "The escaped convicts holed up in a remote farmhouse.", "ex_trans": "脱獄囚たちは人里離れた農家に潜伏した。"}, {"num": "2227", "word": "horse around", "phonetic": "hɔːrs əráʊnd", "trans": "ばか騒ぎをする", "ex_eng": "The teacher came in to find the students horsing around.", "ex_trans": "先生が入って来ると生徒たちがばか騒ぎをしていた。"}, {"num": "2228", "word": "hunker down", "phonetic": "hʌ́ŋkər daʊn", "trans": "身を潜める", "ex_eng": "Most residents hunkered down in their homes until the storm passed.", "ex_trans": "ほとんどの住民は嵐が過ぎ去るまで家に身を潜めた。"}, {"num": "2229", "word": "ingratiate oneself with A", "phonetic": "ɪŋɡréɪʃièɪt wɪð", "trans": "Aに取り入る", "ex_eng": "The new employee did her best to ingratiate herself with her older colleagues.", "ex_trans": "その新入社員は、年上の同僚たちに取り入ろうと最善を尽くした。"}, {"num": "2230", "word": "interfere with ~", "phonetic": "ɪ̀ntərfíər wɪð", "trans": "〜を妨げる", "ex_eng": "The noise from the traffic outside interfered with his concentration, making it difficult for him to study.", "ex_trans": "外の交通の騒音に集中力を妨げられて, 彼はなかなか勉強できなかった。"}, {"num": "2231", "word": "iron out", "phonetic": "áɪərn aʊt", "trans": "〜を解決する [=solve, resolve]", "ex_eng": "The computer engineer spent the weekend ironing out various bugs in the new program.", "ex_trans": "そのコンピューターエンジニアは, 新しいプログラムのさまざまな不具合を解決するのに週末を費やした。"}, {"num": "2232", "word": "jockey for ~", "phonetic": "dʒɑ́ːki fɔːr", "trans": "〜を得ようと画策する", "ex_eng": "A number of employees were jockeying for promotion to the position of head of sales.", "ex_trans": "数人の社員が, 営業部長の座への昇進をつかもうと競い合っていた。"}, {"num": "2233", "word": "keel over", "phonetic": "kiːl óʊvər", "trans": "転倒する [=fall over]", "ex_eng": "The female athlete looked certain to win the marathon, when she suddenly keeled over and lay at the side of the road.", "ex_trans": "その女性アスリートはマラソンでの勝利が確実に思えたその時, 突然倒れて道路脇に横たわった。"}, {"num": "2234", "word": "key up", "phonetic": "kiː ʌp", "trans": "〜の神経を高ぶらせる", "ex_eng": "The tennis player felt very keyed up by his approaching match with the reigning champion.", "ex_trans": "そのテニス選手は, 現チャンピオンとの試合が近づいてとても神経が高ぶっていた。"}, {"num": "2235", "word": "kick around", "phonetic": "kɪk əráʊnd", "trans": "（計画など）をあれこれ検討する", "ex_eng": "The senior executives spent a couple of hours kicking around the idea of launching a new brand.", "ex_trans": "重役たちは，新ブランドを立ち上げる考えをあれこれ検討して数時間費やした。"}, {"num": "2236", "word": "knuckle down", "phonetic": "nʌ́kl daʊn", "trans": "真剣に取り組む [=adopt a serious stance]", "ex_eng": "She told her daughter to knuckle down and write her science report.", "ex_trans": "彼女は娘に, 本腰を入れて理科のレポートを書きなさいと言った。"}, {"num": "2237", "word": "knuckle under", "phonetic": "nʌ́kl ʌ́ndər", "trans": "屈服する [=submit, give in]", "ex_eng": "Their lazy son finally knuckled under to their threats and got a job.", "ex_trans": "ついに彼らのぐうたらな息子は彼らの脅しに屈し仕事に就いた。"}, {"num": "2238", "word": "lag behind ~", "phonetic": "læɡ bɪháɪnd", "trans": "～に後れを取る", "ex_eng": "For most of the race, he was lagging behind the other runners but he made a supreme effort and came in first.", "ex_trans": "レースの大半で彼はほかの選手に後れを取っていたが, 力を振り絞り1位でゴールした。"}, {"num": "2239", "word": "lash out", "phonetic": "læʃ aʊt", "trans": "痛烈に非難する", "ex_eng": "The president lashed out at critics, saying they were in the pay of a foreign government.", "ex_trans": "外国政府の回し者だと言って大統領は批判者たちを痛烈に非難した。"}, {"num": "2240", "word": "lead up to ~", "phonetic": "liːd ʌp tuː", "trans": "(時間的に) ～に至る, (事件などが) ～につながっていく", "ex_eng": "Polls showed that the presidential candidate's agenda gained in popularity in the weeks leading up to the election.", "ex_trans": "世論調査は, その大統領候補の政策課題が選挙に至るまでの数週間で人気を博したことを示した。"}, {"num": "2241", "word": "leaf through", "phonetic": "liːf θruː", "trans": "~をぱらぱらめくって目を通す", "ex_eng": "While she waited, she leafed through the magazines on the table.", "ex_trans": "彼女は待っている間, テーブルの上の雑誌をぱらぱらめくって目を通した。"}, {"num": "2242", "word": "leap out at A", "phonetic": "liːp aʊt æt", "trans": "Aの目に飛び込む", "ex_eng": "He looked through the mug shots, but none of the faces leaped out at him as the man he saw rob the bank.", "ex_trans": "彼は容疑者の写真に目を通したが、目撃した銀行強盗として彼の目に飛び込んできた顔は1つもなかった。"}, {"num": "2243", "word": "let down", "phonetic": "let daʊn", "trans": "〜を失望させる [=disappoint]", "ex_eng": "Everybody felt let down when their team failed to win the final.", "ex_trans": "チームが決勝戦で負けたとき、皆が失望した。"}, {"num": "2244", "word": "let on", "phonetic": "let ɑːn", "trans": "秘密を漏らす", "ex_eng": "She was careful not to let on to her husband that she had received a telephone call from an old boyfriend.", "ex_trans": "彼女は昔の恋人から電話があったことを夫に漏らさないように気を付けた。"}, {"num": "2245", "word": "let up on 〜", "phonetic": "let ʌp ɑːn", "trans": "〜に対して手を緩める, 〜に対して気を抜く", "ex_eng": "She decided to let up on her kids and their curfew after years of strict parenting.", "ex_trans": "彼女は何年にもわたる厳格な子育ての後、子供たちと彼らの門限に対して手を緩めることにした。"}, {"num": "2246", "word": "level off", "phonetic": "lévl ɔːf", "trans": "(進行・成長などが) 横ばいになる", "ex_eng": "Finally, the rise in the value of the dollar began to level off.", "ex_trans": "ようやくドル高は横ばいになり始めた。"}, {"num": "2247", "word": "level with A", "phonetic": "lévl wɪð", "trans": "Aに対して率直に言う", "ex_eng": "I need to level with you. If your play does not improve, I will take you off the team.", "ex_trans": "率直に言わせてもらいます。プレーが上達しなければ、あなたをチームから外します。"}, {"num": "2248", "word": "limber up", "phonetic": "límbər ʌp", "trans": "(準備体操などで) 体をほぐす", "ex_eng": "The players were just limbering up for the soccer match when it suddenly began to rain.", "ex_trans": "選手たちがサッカーの試合に備えて体をほぐしていたちょうどその時、突然雨が降り出した。"}, {"num": "2249", "word": "live down", "phonetic": "lɪv daʊn", "trans": "(失敗など) を人に忘れさせる", "ex_eng": "He never lived down his failure to secure the deal, and eventually he left the company for another one.", "ex_trans": "彼はその取引をまとめられなかったことを人々の記憶から消すことができず, 結局, 社を去って他社に移った。"}, {"num": "2250", "word": "load up on ~", "phonetic": "loʊd ʌp ɑːn", "trans": "〜をどっさり買い込む [=stock up on]", "ex_eng": "Before setting out on the next leg of their journey, the explorers loaded up on supplies.", "ex_trans": "旅の次の行程に出発する前に, 探検家たちは補給品をどっさり買い込んだ。"}, {"num": "2251", "word": "louse up", "phonetic": "laʊs ʌp", "trans": "〜を台無しにする [=mess up]", "ex_eng": "The actress told the man that his bad acting was lousing up the whole play.", "ex_trans": "あなたの下手な演技が芝居全体を台無しにしている, とその女優はその男性に言った。"}, {"num": "2252", "word": "make off with ~", "phonetic": "meɪk ɔːf wɪð", "trans": "〜を持ち逃げする", "ex_eng": "During the bomb scare at the museum, a thief made off with a valuable painting.", "ex_trans": "美術館への爆破予告の間に, 泥棒が貴重な絵画を盗んで逃げた。"}, {"num": "2253", "word": "mark up", "phonetic": "mɑːrk ʌp", "trans": "(原稿など)に手を入れる", "ex_eng": "The professor marked up my essay and added suggestions on how I could improve my writing.", "ex_trans": "教授は私の論文に手を入れた, 文章をどのように改善できるか提案を加えた。"}, {"num": "2254", "word": "mete out", "phonetic": "miːt aʊt", "trans": "(罰など)を割り当てる", "ex_eng": "The teacher meted out extra homework to the boys as a punishment for their misbehavior.", "ex_trans": "先生は不良行の罰として少年たちに追加の宿題を科した。"}, {"num": "2255", "word": "mill about [around] (~)", "phonetic": "mɪl əbáʊt ［əráʊnd］", "trans": "目的もなく(〜を)動き回る", "ex_eng": "People were milling about the stadium parking lot waiting for the gates to open.", "ex_trans": "開場を待つ人たちがスタジアムの駐車場をうろうろ動き回っていた。"}, {"num": "2256", "word": "mouth off", "phonetic": "maʊθ ɔːf", "trans": "(意見・批判・不平などを)激しい口調で言う", "ex_eng": "The old man mouthed off about the gradual increases in the cost of living in his neighborhood.", "ex_trans": "その老人は, 住む近辺で生活費が徐々に上がっていることについて大声で文句を言った。"}, {"num": "2257", "word": "muddle through", "phonetic": "mʌ́dl θruː", "trans": "何とか切り抜ける", "ex_eng": "Although their budget soon ran out, they somehow muddled through and completed the project.", "ex_trans": "予算はすぐに尽きたが, 彼らはどうにかこうにか切り抜けてプロジェクトを完了した。"}, {"num": "2258", "word": "mull over", "phonetic": "mʌl óʊvər", "trans": "〜を熟考する [=consider, chew over]", "ex_eng": "She asked for a few weeks to mull over the offer and to discuss it with her family.", "ex_trans": "その申し出についてよく考え家族と話し合うために, 2, 3週間もらえないかと彼女は頼んだ。"}, {"num": "2259", "word": "muscle into ~", "phonetic": "mʌ́sl ɪ́ntuː", "trans": "〜に強引に割り込む", "ex_eng": "He muscled into the crowd to pick up a popular but rare toy for his son.", "ex_trans": "彼は, 人気があるが珍しいおもちゃを息子のために手に入れようと, 人混みに強引に割り込んだ。"}, {"num": "2260", "word": "nail down", "phonetic": "neɪl daʊn", "trans": "(日取りなど)を確定する [=determine]", "ex_eng": "He finally managed to nail down a meeting with the very busy executive.", "ex_trans": "ようやく彼は何かとのか多忙な重役との面会を取り付けた。"}, {"num": "2261", "word": "narrow down", "phonetic": "nǽroʊ daʊn", "trans": "〜を絞り込む", "ex_eng": "The detective narrowed down the suspects to two men.", "ex_trans": "刑事は容疑者を2人の男に絞り込んだ。"}, {"num": "2262", "word": "nod off", "phonetic": "nɑːd ɔːf", "trans": "うとうとして眠り込む [=doze off]", "ex_eng": "It had been such a long day that he kept nodding off during the play.", "ex_trans": "その日はとても長い1日だったので, 彼は観劇中にうとうとし続けていた。"}, {"num": "2263", "word": "nose around", "phonetic": "noʊz əráʊnd", "trans": "〜を捜し回る", "ex_eng": "He hated it when his boss started nosing around his desk.", "ex_trans": "彼は上司が彼の机を捜し回り始めるのがとても嫌だった。"}, {"num": "2264", "word": "opt for", "phonetic": "ɑːpt fɔːr", "trans": "〜を選ぶ [=choose, select]", "ex_eng": "When given the choice, most students opted for taking an exam instead of writing an essay.", "ex_trans": "選択肢を与えられると, ほとんどの学生はレポートを書くことより試験を受ける方を選んだ。"}, {"num": "2265", "word": "opt out of ~", "phonetic": "(空欄)", "trans": "〜しないことにする", "ex_eng": "When I signed up for the gym, I decided to opt out of receiving monthly newsletters.", "ex_trans": "私はジムに入会するとき, 毎月の会報を受け取らないことにした。"}, {"num": "2266", "word": "own up to ~", "phonetic": "(空欄)", "trans": "〜を白状する [=confess to]", "ex_eng": "After the teenager owned up to smoking in the backyard, his father gave him a lecture on the danger to his health.", "ex_trans": "その10代の若者が裏庭でタバコを吸ったことを白状すると, 父親は彼に健康への危険性について説教した。"}, {"num": "2267", "word": "palm off", "phonetic": "(空欄)", "trans": "(偽物など)を売りつける", "ex_eng": "The merchant made a living by palming off fake antiques as genuine ones.", "ex_trans": "その商人は偽の骨董品を本物だと言って売りつけることで生計を立てていた。"}, {"num": "2268", "word": "pan out", "phonetic": "(空欄)", "trans": "成功する", "ex_eng": "His dream of becoming a famous guitarist didn't pan out, so he went back to college to earn a degree.", "ex_trans": "有名ギタリストになる夢がかなわなかったので, 彼は学位を取るため大学に戻った。"}, {"num": "2269", "word": "pass down", "phonetic": "(空欄)", "trans": "(後世に)〜を伝える [=hand down]", "ex_eng": "The jewelry had been passed down in his mother's family for generations.", "ex_trans": "その宝石は彼の母方の一族に代々受け継がれていたものだった。"}, {"num": "2270", "word": "pass up", "phonetic": "(空欄)", "trans": "(機会など)を見送る", "ex_eng": "She passed up the promotion, believing that the salary increase would not make up for the greater responsibilities.", "ex_trans": "(空欄)"}, {"num": "2271", "word": "patch up", "phonetic": "pætʃ ʌp", "trans": "〜に応急処置をする", "ex_eng": "The doctor swiftly patched up the wound on his arm with a few stitches.", "ex_trans": "医者は彼の腕の傷を数針縫って素早く応急処置をした。"}, {"num": "2272", "word": "pay off", "phonetic": "peɪ ɔːf", "trans": "(計画・事業などが) うまくいく, (借金など) を完済する", "ex_eng": "He took a big risk buying the shares in the company, but it paid off and he was able to use the profit to start his own business.", "ex_trans": "彼は大きなリスクを冒してその会社の株を買ったが, 成果が出て, 彼はその利益を使って自分の事業を始めることができた。"}, {"num": "2273", "word": "peter out", "phonetic": "píːtər aʊt", "trans": "次第に消滅する", "ex_eng": "After a while, the letters from their son petered out and they never heard from him again.", "ex_trans": "しばらくすると, 息子からの手紙は次第に来なくなり, 再び息子から便りが届くことはなかった。"}, {"num": "2274", "word": "phase out", "phonetic": "feɪz aʊt", "trans": "〜を段階的に廃止する", "ex_eng": "The auto company gradually phased out production of the old model although it was still selling well.", "ex_trans": "その旧型車の売り上げは依然として好調だったものの, 自動車会社はその生産を少しずつ段階的に廃止した。"}, {"num": "2275", "word": "pick up on ~", "phonetic": "pɪk ʌp ɑːn", "trans": "〜に気付く", "ex_eng": "In his lecture, he confused two painters, but luckily no one in the audience picked up on his mistake.", "ex_trans": "彼は講演で2人の画家を混同したが, 幸い聴衆は誰も彼の間違いに気付かなかった。"}, {"num": "2276", "word": "piece together", "phonetic": "piːs təɡéðər", "trans": "（事実・情報など）をつなぎ合わせる [=put together]", "ex_eng": "When he pieced together the evidence, he realized what had happened.", "ex_trans": "証拠をつなぎ合わせたとき，彼は何が起こったか悟った。"}, {"num": "2277", "word": "pile in", "phonetic": "paɪl ɪn", "trans": "(乗り物に) どっと乗り込む", "ex_eng": "When the school bus arrived, the waiting children piled in, shouting and screaming.", "ex_trans": "スクールバスが到着すると、待っていた子供たちはギャーギャー騒ぎながらどっと乗り込んだ。"}, {"num": "2278", "word": "pile up", "phonetic": "paɪl ʌp", "trans": "(仕事・心配事などが) どんどんたまる", "ex_eng": "His tasks kept piling up, and he was forced to work overtime almost every day.", "ex_trans": "仕事がどんどんたまり続け、彼はほとんど毎日残業せざるを得なかった。"}, {"num": "2279", "word": "pin down", "phonetic": "pɪn daʊn", "trans": "〜を突き止める [=run down]", "ex_eng": "He found it impossible to pin down the cause of the problem.", "ex_trans": "彼はその問題の原因を突き止めるのは不可能だとわかった。"}, {"num": "2280", "word": "pine for ~", "phonetic": "paɪn fɔːr", "trans": "〜を切望する [=covet]", "ex_eng": "She was pining for a chance to play on the school team.", "ex_trans": "彼女は学校のチームでプレーできる機会を切望していた。"}, {"num": "2281", "word": "pitch in", "phonetic": "pɪtʃ ɪn", "trans": "協力する [=cooperate]", "ex_eng": "Everyone pitched in with cleaning up after the party, and the work was finished in no time.", "ex_trans": "パーティーの後片付けには全員が協力し、作業はあっという間に終わった。"}, {"num": "2282", "word": "play off", "phonetic": "pleɪ ɔːf", "trans": "プレーオフを行う", "ex_eng": "As there was no score, the teams had to play off the following week.", "ex_trans": "試合は無得点だったので, 両チームは翌週プレーオフを行わなければならなかった。"}, {"num": "2283", "word": "plow through ~", "phonetic": "plaʊ θruː", "trans": "(仕事)を骨折ってする, 〜を読み進める", "ex_eng": "All the students thought it would be impossible to plow through the big assignment in a week.", "ex_trans": "生徒全員が, その大量の宿題を1週間でやり進めるのは不可能だと思った。"}, {"num": "2284", "word": "plug away at ~", "phonetic": "plʌɡ əw0éɪ æt", "trans": "〜に根気よく励む", "ex_eng": "The student plugged away at learning Chinese until he could hold a conversation on his own.", "ex_trans": "その生徒は独力で会話を続けられるまで中国語の学習に根気よく励んだ。"}, {"num": "2285", "word": "plug in", "phonetic": "plʌɡ ɪn", "trans": "〜のプラグを電源に差し込む", "ex_eng": "He thought the computer was broken, but actually he had just forgotten to plug it in.", "ex_trans": "彼はパソコンが壊れたと思ったが, 実はプラグを差し忘れていただけだった。"}, {"num": "2286", "word": "poke around", "phonetic": "poʊk əráʊnd", "trans": "探し回る, 引っかき回す", "ex_eng": "The professor loves poking around in second-hand bookshops, looking for works by his favorite authors.", "ex_trans": "教授は古書店をのぞき回って お気に入りの作家の作品を探すのが大好きだ。"}, {"num": "2287", "word": "polish up", "phonetic": "pɑ́ːlɪʃ ʌp", "trans": "(技能など)に磨きをかける", "ex_eng": "He decided to polish up his French before his visit to Paris.", "ex_trans": "彼はパリを訪れる前にフランス語に磨きをかけようと決心した。"}, {"num": "2288", "word": "pore over ~", "phonetic": "pɔːr óʊvər", "trans": "〜を熟読する, 〜を熟考する", "ex_eng": "He pored over the letter, reading it again and again until he had nearly memorized it.", "ex_trans": "彼はその手紙を熟読し, ほとんど暗記するまで何度も何度も読み返した。"}, {"num": "2289", "word": "prop up", "phonetic": "prɑːp ʌp", "trans": "(存続の危うい企業など)を支援する", "ex_eng": "The chairman spent his whole fortune trying to prop up the failing company.", "ex_trans": "つぶれそうな会社を支援しようと, 社長は全財産を費やした。"}, {"num": "2290", "word": "pull off", "phonetic": "pʊl ɔːf", "trans": "〜をやってのける", "ex_eng": "After weeks of practice, he was able to pull off the magic trick and fool everyone.", "ex_trans": "何週間も練習した後, 彼はその手品をやってのけ, みんなをだますことができた。"}, {"num": "2291", "word": "push for ~", "phonetic": "pʊʃ fɔːr", "trans": "〜を要求する", "ex_eng": "The union pushed for a reduction in working hours, but the company refused to accept their demands.", "ex_trans": "組合は労働時間の削減を求めたが, 会社は要求の受け入れを拒んだ。"}, {"num": "2292", "word": "put across", "phonetic": "pʊt əkrɔ́ːs", "trans": "〜をよく理解させる", "ex_eng": "The leader of the ecological group said they needed to work harder at putting across their ideas to the public.", "ex_trans": "環境保護団体の指導者は, 自分たちの考えを大衆にうまく伝えることにもっと努力する必要がある, と語った。"}, {"num": "2293", "word": "put forth", "phonetic": "pʊt fɔːrθ", "trans": "(計画・案など)を提唱する", "ex_eng": "The professor put forth a new hypothesis that could dramatically alter our understanding of physics.", "ex_trans": "その教授は, 物理学の理解を劇的に変える可能性のある新しい仮説を提唱した。"}, {"num": "2294", "word": "put in for ~", "phonetic": "pʊt ɪn fɔːr", "trans": "〜に応募する", "ex_eng": "He put in for one of the university's scholarships but was rejected because of his poor grades.", "ex_trans": "彼は大学の奨学金の1つに応募したが，成績が悪くて却下された。"}, {"num": "2295", "word": "put out", "phonetic": "pʊt aʊt", "trans": "(ニュースなど) を発表する", "ex_eng": "The journalist started her own website to put out news that is overlooked by the mainstream media.", "ex_trans": "そのジャーナリストは、主流メディアによって見落とされているニュースを発表するために自身のウェブサイトを始めた。"}, {"num": "2296", "word": "put upon A", "phonetic": "pʊt əpɑ́ːn", "trans": "Aを利用する, Aに付け込む", "ex_eng": "The secretary felt put upon by her boss because he asked her to do so many errands for him.", "ex_trans": "彼女は上司にしっっちゅう使い走りを頼まれるので、上司にいいように利用されていると感じた。"}, {"num": "2297", "word": "puzzle over ~", "phonetic": "pʌ́zl óʊvər", "trans": "〜に頭を悩ませる [= rack one's brain(s) over]", "ex_eng": "He sat puzzling over the math problem for at least an hour.", "ex_trans": "彼は少なくとも1時間、その数学の問題に頭を悩ませて座っていた。"}, {"num": "2298", "word": "rack up", "phonetic": "ræk ʌp", "trans": "(利益など) を蓄積する [= accumulate] , (損失など) を重ねる", "ex_eng": "After racking up his first million dollars, he decided to retire.", "ex_trans": "ためたお金が100万ドルになったところで、彼は引退することにした。"}, {"num": "2299", "word": "rail against ~", "phonetic": "reɪl əɡénst", "trans": "〜を激しく非難する [= lash out]", "ex_eng": "The union leader railed against the government's economic policies.", "ex_trans": "労働組合の指導者は政府の経済政策を激しく非難した。"}, {"num": "2300", "word": "rattle off", "phonetic": "rǽtl ɔːf", "trans": "〜をすらすらと言う [書く, 行う]", "ex_eng": "Although her son got poor grades at school, he could rattle off the names of all the players in the football league.", "ex_trans": "彼女の息子は学校の成績は悪かったが, フットボールリーグの選手全員の名前をすらすら言うことができた。"}, {"num": "2301", "word": "reckon on A doing", "phonetic": "rékən ɑːn", "trans": "Aが〜するものと予想する", "ex_eng": "The general admitted that he had never reckoned on the enemy launching a counterattack so quickly.", "ex_trans": "敵がそんなにすぐに反撃を開始するとは予想していなかったと将軍は認めた。"}, {"num": "2302", "word": "reel off", "phonetic": "riːl ɔːf", "trans": "〜をすらすら話す", "ex_eng": "When he asked the girl to name a few famous scientists, she reeled off the names of twenty or so.", "ex_trans": "彼がその女の子に有名な科学者の名前を数人言うように頼んだ際, 彼女は20ほどの名前をすらすら挙げた。"}, {"num": "2303", "word": "revel in ~", "phonetic": "révəl ɪn", "trans": "〜を大いに楽しむ [=enjoy very much]", "ex_eng": "Following the scandal, the model reveled in all the attention she received from the media.", "ex_trans": "スキャンダルの後, そのモデルはメディアから浴びたあらゆる注目を大いに楽しんだ。"}, {"num": "2304", "word": "ride out", "phonetic": "raɪd aʊt", "trans": "(困難など) を無事に乗り切る", "ex_eng": "The prime minister managed to ride out the wave of hostility unleashed by the tax increases.", "ex_trans": "首相は増税で火がついた敵意の高まりを何とか無事に乗り切ることができた。"}, {"num": "2305", "word": "rifle through", "phonetic": "ráɪfl θruː", "trans": "〜をくまなく探す", "ex_eng": "He caught his colleague rifling through the drawers of his desk.", "ex_trans": "彼は同僚が彼の机の引き出しをくまなく調べているところを見つけた。"}, {"num": "2306", "word": "rigged up", "phonetic": "rɪɡd ʌp", "trans": "〜を急ごしらえする", "ex_eng": "After the wind blew away the sail of the boat, the crew rigged up a new one using a blanket.", "ex_trans": "風がボートの帆を吹き飛ばした後, 乗組員は毛布を使って新しい帆を間に合わせで作った。"}, {"num": "2307", "word": "rip into ~", "phonetic": "rɪp ɪ́ntuː", "trans": "〜を激しく非難する", "ex_eng": "The reviewer ripped into the film, criticizing every aspect of it from the filming to the actors.", "ex_trans": "その評論家はその映画を酷評し, 撮影から俳優まで映画のあらゆる面を批判した。"}, {"num": "2308", "word": "roll out", "phonetic": "roʊl aʊt", "trans": "(新製品) を発売する [＝launch]", "ex_eng": "The company announced that it would roll out a new line of automobiles in the spring.", "ex_trans": "その会社は春に新しいラインアップの自動車を発売すると発表した。"}, {"num": "2309", "word": "root for A", "phonetic": "ruːt fɔːr", "trans": "Aを応援する", "ex_eng": "The presidential candidate was from the town, so naturally everyone there was rooting for him.", "ex_trans": "その大統領候補者はその町の出身だったので, 当然町の全員が彼を応援していた。"}, {"num": "2310", "word": "root out", "phonetic": "ruːt aʊt", "trans": "〜を根絶する, 〜を一掃する", "ex_eng": "The new president promised to root out all the corruption in the federal government within her first year in office.", "ex_trans": "新大統領は, 就任1年以内に連邦政府のすべての汚職を根絶することを約束した。"}, {"num": "2311", "word": "rope A into B", "phonetic": "roʊp ɪ́ntuː", "trans": "AをうまくBに引っ張り込む", "ex_eng": "Although he wanted to go to a movie, he got roped into helping clean the house.", "ex_trans": "彼は映画を見に行きたかったのに, 家の掃除の手伝いに引っ張り込まれた。"}, {"num": "2312", "word": "rub off on A", "phonetic": "rʌb ɔːf ɑːn", "trans": "(性質・才能などが) Aに乗り移る, Aに影響を与える", "ex_eng": "The teacher wished some of the boy's serious attitude would rub off on his classmates.", "ex_trans": "その少年のまじめな態度がいくらかクラスメートに感化するといいのだがと先生は思った。"}, {"num": "2313", "word": "scoot over", "phonetic": "skuːt óʊvər", "trans": "席を詰める", "ex_eng": "She asked him to scoot over so that she could share the sofa with him.", "ex_trans": "一緒にソファーに座れるように少し詰めて, と彼女は彼に頼んだ。"}, {"num": "2314", "word": "scrape by", "phonetic": "skreɪp baɪ", "trans": "何とか暮らしていく", "ex_eng": "The elderly couple just managed to scrape by on their small pension.", "ex_trans": "その老夫婦は, わずかな年金でかろうじて何とか暮らしていくことができた。"}, {"num": "2315", "word": "scratch out", "phonetic": "skræntʃ aʊt", "trans": "〜を (線で) 消す, 〜を抹消する", "ex_eng": "She scratched out the college from her list of schools to apply to, upon realizing it had no volleyball team.", "ex_trans": "バレーボール部がないことに気付き, 彼女は出願する学校のリストからその大学を削除した。"}, {"num": "2316", "word": "scrimp on ~", "phonetic": "skrɪmp ɑːn", "trans": "〜を倹約する", "ex_eng": "His rent was so high that he had to scrimp on his food and drink to pay it.", "ex_trans": "家賃がとても高かったので, 彼は家賃を払うために飲食費を切り詰めなければならなかった。"}, {"num": "2317", "word": "settle on ~", "phonetic": "sétl ɑːn", "trans": "〜を決める [=decide on]", "ex_eng": "After much discussion, they finally settled on a date for the wedding.", "ex_trans": "さんざん話し合った後, 彼らはやっと挙式の日取りを決めた。"}, {"num": "2318", "word": "settle up", "phonetic": "sétl ʌp", "trans": "(勘定などの) 支払いをする", "ex_eng": "While her boyfriend settled up with the hotel, she packed up their luggage.", "ex_trans": "恋人がホテルの支払いを済ませる間に、彼女は自分たちの荷物をまとめた。"}, {"num": "2319", "word": "shell out ~", "phonetic": "ʃel aʊt", "trans": "(大金) を (しぶしぶ) 支払う [=fork out]", "ex_eng": "The teenager shelled out all of his savings on a baseball card signed by his favorite player.", "ex_trans": "そのティーンエイジャーは、お気に入りの選手がサインした野球カードに彼の貯金すべて費やした。"}, {"num": "2320", "word": "shoot for ~", "phonetic": "ʃuːt fɔːr", "trans": "〜を目指す", "ex_eng": "That year, the school swimming team decided to shoot for the national championships.", "ex_trans": "その年、その学校の水泳部は全国優勝を目指そうと決めた。"}, {"num": "2321", "word": "shrug off", "phonetic": "ʃrʌɡ ɔːf", "trans": "〜を無視する, 〜を一笑に付す", "ex_eng": "Whatever failures he suffered, he always shrugged them off and began again.", "ex_trans": "どんな失敗を経験しても、彼はいつもそれを気にせず再び始めた。"}, {"num": "2322", "word": "shy away from ~", "phonetic": "ʃaɪ əw0éɪ frʌm", "trans": "〜を避ける, 〜を敬遠する", "ex_eng": "The newborn cat shied away from all the people smiling at it.", "ex_trans": "その生まれたばかりの猫は、笑顔を向けているみんなから遠ざかった。"}, {"num": "2323", "word": "side with A", "phonetic": "saɪd wɪð", "trans": "Aに味方する", "ex_eng": "When his mother sided with his brother against him, he felt a strong sense of betrayal.", "ex_trans": "母親が自分に反対して兄の肩を持ったとき、彼は裏切られたと強く感じた。"}, {"num": "2324", "word": "sift through ~", "phonetic": "sɪft θruː", "trans": "〜を念入りに調べる", "ex_eng": "He sifted through a pile of old photographs trying to find one of his father.", "ex_trans": "彼は父親の写真を見つけようと，古い写真の山を念入りに調べた。"}, {"num": "2325", "word": "simmer down", "phonetic": "símər daʊn", "trans": "気持ちが静まる [=calm down]", "ex_eng": "After he simmered down, he regretted losing his temper and resigned from his post.", "ex_trans": "彼は落ち着いてから，かっとなったことを後悔し辞職した。"}, {"num": "2326", "word": "sit in for ~", "phonetic": "sɪt ɪn fɔːr", "trans": "〜の代理を務める", "ex_eng": "The vice president said that he was sitting in for the president, who had been called away on urgent business.", "ex_trans": "副大統領は，緊急の用で呼び出された大統領の代理を務めると言った。"}, {"num": "2327", "word": "skim off", "phonetic": "skɪm ɔːf", "trans": "（金）を着服する", "ex_eng": "It was discovered that the bank manager had been skimming off money from his customers’ accounts for years.", "ex_trans": "銀行の支店長が長年にわたって顧客たちの口座からお金を着服していたことが発覚した。"}, {"num": "2328", "word": "slip through ~", "phonetic": "slɪp θruː", "trans": "〜を気付かれずに通過する", "ex_eng": "The thief slipped through the building’s security system and found the safe that was inside.", "ex_trans": "泥棒はビルのセキュリティシステムをすり抜け，中にある金庫を見つけた。"}, {"num": "2329", "word": "smooth down", "phonetic": "smuːð daʊn", "trans": "（髪など）をなでつける", "ex_eng": "She tried to smooth down her hair for the class picture, but it still stuck up in several places.", "ex_trans": "クラス写真を撮るので彼女は髪をなでつけようとしたが，まだ何か所か跳ねていた。"}, {"num": "2330", "word": "smooth over", "phonetic": "smuːð óʊvər", "trans": "(問題など) を和らげる, 〜の解決を容易にする", "ex_eng": "He tried to smooth over the mistake, but it was quickly noticed.", "ex_trans": "彼はミスを丸く収めようとしたが、すぐに見つかってしまった。"}, {"num": "2331", "word": "snap off", "phonetic": "snæp ɔːf", "trans": "〜をぱきっ折る", "ex_eng": "The boys snapped off the long icicles and used them as swords.", "ex_trans": "少年たちは長いつららをぱきっ折って、刀として使った。"}, {"num": "2332", "word": "snap out of ~", "phonetic": "snæp aʊt ʌv", "trans": "(惨めな状態など) から立ち直る", "ex_eng": "Although she felt gloomy, she did her best to snap out of it and get on with her work.", "ex_trans": "彼女はさえない気分だったが、気を取り直して仕事を続けようと最善を尽くした。"}, {"num": "2333", "word": "snap up", "phonetic": "snæp ʌp", "trans": "〜を先を争って買う", "ex_eng": "Demand for housing was so strong that any new properties that came on the market were snapped up immediately.", "ex_trans": "住宅の需要が非常に高かったので、売りに出た新しい物件はどんなものでもすぐに先を争って買われた。"}, {"num": "2334", "word": "snuff out", "phonetic": "snʌf aʊt", "trans": "(希望など) を消滅させる", "ex_eng": "The government did its best to snuff out the rumors about the leader's health before they spread.", "ex_trans": "政府は、指導者の健康状態に関するうわさが広がる前にそのうわさを消そうと全力を尽くした。"}, {"num": "2335", "word": "soak up", "phonetic": "soʊk ʌp", "trans": "(雰囲気など) をたっぷり楽しむ, 〜を吸い取る [=absorb]", "ex_eng": "For a few days, he just soaked up the local atmosphere of the town.", "ex_trans": "数日間, 彼はただ町のローカルな雰囲気をたっぷり楽しんだ。"}, {"num": "2336", "word": "sort out", "phonetic": "sɔːrt aʊt", "trans": "〜を整理する [=organize] , 〜を解決する [=resolve]", "ex_eng": "Her first job was to sort out all the papers left by her predecessor.", "ex_trans": "彼女の最初の仕事は，前任者が残したすべての書類を整理することだった。"}, {"num": "2337", "word": "sound out", "phonetic": "saʊnd aʊt", "trans": "(人の意見・気持ち) を打診する, 〜に当たってみる", "ex_eng": "Sound him out on whether he is interested in coming.", "ex_trans": "来る気があるかどうか，彼に打診してくれ。"}, {"num": "2338", "word": "spin out", "phonetic": "spɪn aʊt", "trans": "(話) を長引かせる [=drag out, prolong]", "ex_eng": "Although the professor did not have much to say, he managed to spin out his speech for about two hours.", "ex_trans": "教授には大して話すことはなかったのだが，何とか2時間ほどスピーチを長引かせた。"}, {"num": "2339", "word": "spring up", "phonetic": "sprɪŋ ʌp", "trans": "急に現れる, 急に起こる", "ex_eng": "In no time at all, new factories began to spring up in the town.", "ex_trans": "あっという間に，町に新しい工場が次々に建ち始めた。"}, {"num": "2340", "word": "spruce up", "phonetic": "spruːs ʌp", "trans": "〜の身なりを整える", "ex_eng": "He tried to spruce himself up for the party but without much success.", "ex_trans": "彼はパーティーに行くために身なりを整えようとしたが，あまりうまくいかなかった。"}, {"num": "2341", "word": "spur on", "phonetic": "spəːr ɑːn", "trans": "〜を奮い立たせる [=motivate, encourage]", "ex_eng": "He did not enjoy studying law, but he was spurred on by the thought of the money he could make in the future.", "ex_trans": "法律の勉強は楽しくなかったが，将来稼げるお金のことを考えると，彼は奮い立った。"}, {"num": "2342", "word": "square off", "phonetic": "skwer ɔːf", "trans": "対戦する", "ex_eng": "The two players were set to square off in the second round of the tennis tournament.", "ex_trans": "2人の選手は，テニス選手権大会の2回戦で対戦する予定になっていた。"}, {"num": "2343", "word": "square up", "phonetic": "skwer ʌp", "trans": "支払いを済ませる [=pay]", "ex_eng": "After squaring up with the cashier, the couple left the restaurant.", "ex_trans": "レジで支払いを済ませて，そのカップルはレストランを出た。"}, {"num": "2344", "word": "squeak by", "phonetic": "skwiːk baɪ", "trans": "辛うじて切り抜ける", "ex_eng": "When she began working in the city, she found that she could only squeak by on her salary.", "ex_trans": "その市で暮らし始めてみると、彼女は給料で辛うじて生活するのがやっとだった。"}, {"num": "2345", "word": "stack up", "phonetic": "stæk ʌp", "trans": "匹敵する, 比べられる", "ex_eng": "The professor told her that parts of her essay were interesting, but they did not stack up to a coherent argument.", "ex_trans": "教授は彼女に、彼女の論文には興味深い部分もあるが、一貫した立論に匹敵するようなものではないと言った。"}, {"num": "2346", "word": "stake out", "phonetic": "steɪk aʊt", "trans": "〜の張り込みをする", "ex_eng": "The police staked out the jewelry store and were able to catch the thieves red-handed.", "ex_trans": "警察はその宝石店に張り込み、泥棒たちを現行犯で捕らえることができた。"}, {"num": "2347", "word": "stand in for A", "phonetic": "stænd ɪn fɔːr", "trans": "Aの代役を務める [=deputize for]", "ex_eng": "The old man fell ill so his son had to stand in for him at the ceremony.", "ex_trans": "その老人は病気になったので、息子が式典で彼の代役を務めなければならなかった。"}, {"num": "2348", "word": "stave off", "phonetic": "steɪv ɔːf", "trans": "〜を防ぐ, 〜を避ける", "ex_eng": "While he waited for dinner to be served, he staved off his hunger by eating peanuts.", "ex_trans": "ディナーが出てくるのを待つ間、彼はピーナッツを食べて空腹をしのいだ。"}, {"num": "2349", "word": "stick around", "phonetic": "stɪk əráʊnd", "trans": "近くで待つ, 辺りをぶらぶらする", "ex_eng": "He told me to stick around after the game so we could play catch.", "ex_trans": "キャッチボールをするので試合が終わっても近くで待っていて、と彼は僕に言った。"}, {"num": "2350", "word": "stir up", "phonetic": "stəːr ʌp", "trans": "(感情など)をかき立てる, (騒ぎなど)を引き起こす", "ex_eng": "The union leader was accused of trying to stir up discontent among the workers.", "ex_trans": "労働組合の指導者は、労働者たちの不満をかき立てようとしたとして非難された。"}, {"num": "2351", "word": "stock up on ~", "phonetic": "stɑːk ʌp ɑːn", "trans": "〜を(大量に)蓄える", "ex_eng": "The couple drove to a big supermarket in order to stock up on food before the holidays began.", "ex_trans": "休暇が始まる前に食料品を買いだめしようと、その夫婦は車で大きなスーパーマーケットに行った。"}, {"num": "2352", "word": "stop off", "phonetic": "stɑːp ɔːf", "trans": "途中で寄る", "ex_eng": "He asked her to stop off at a liquor store and buy some wine to drink with dinner.", "ex_trans": "酒屋に寄って, 夕食のときに飲むワインを買ってきてくれないかと彼は彼女に頼んだ。"}, {"num": "2353", "word": "storm out", "phonetic": "stɔːrm aʊt", "trans": "(怒って) 激しい勢いで出て行く", "ex_eng": "Suddenly, the boss lost his temper and stormed out of the meeting.", "ex_trans": "突然上司は怒り出し、会議の席から猛然と退場した。"}, {"num": "2354", "word": "stow away", "phonetic": "stoʊ əw0éɪ", "trans": "密航する", "ex_eng": "The escaped criminal tried to leave the country by stowing away on a ship, but he was soon discovered.", "ex_trans": "逃亡犯は船で密航して国を出ようとしたが、すぐに発見された。"}, {"num": "2355", "word": "strike on ~", "phonetic": "straɪk ɑːn", "trans": "(考えなど) を思い付く", "ex_eng": "One day, while he was watching a movie, he struck on an idea for a new way to prove his theory.", "ex_trans": "ある日彼は映画を見ている間に、自分の理論を証明する新方法のアイデアを思い付いた。"}, {"num": "2356", "word": "strike up", "phonetic": "straɪk ʌp", "trans": "(関係) を取り結ぶ, (会話など) を始める, 演奏を始める", "ex_eng": "The two new employees struck up a friendship that was to last the rest of their lives.", "ex_trans": "2人の新入社員は, 生涯続くことになる友情を結んだ。"}, {"num": "2357", "word": "stub out", "phonetic": "stʌb aʊt", "trans": "(タバコなど) をもみ消す", "ex_eng": "When he saw his wife coming, he quickly stubbed out his cigarette.", "ex_trans": "彼は妻が来るのを見ると, すぐにタバコをもみ消した。"}, {"num": "2358", "word": "stumble upon ~", "phonetic": "stʌ́mbl əpɑ́ːn", "trans": "～を偶然見つける, ～に思いがけず出くわす", "ex_eng": "Late one night, the scientist stumbled upon a solution to the problem.", "ex_trans": "ある晩遅く, その科学者はその問題の解決方法を偶然発見した。"}, {"num": "2359", "word": "swear by ~", "phonetic": "swer baɪ", "trans": "〜に全幅の信頼を寄せる", "ex_eng": "His father had always sworn by the traditional remedy of eating chicken soup to cure a cold.", "ex_trans": "彼の父親は, チキンスープを飲むという伝統的な風邪の治療法にずっと全幅の信頼を置いていた。"}, {"num": "2360", "word": "swear in", "phonetic": "swer ɪn", "trans": "〜を宣誓させて就任させる", "ex_eng": "The new recruits to the army were sworn in in a special ceremony.", "ex_trans": "新兵たちは特別な式典で就任の宣誓を行った。"}, {"num": "2361", "word": "tail off", "phonetic": "teɪl ɔːf", "trans": "徐々に減少する", "ex_eng": "By late afternoon, visitors to the museum had begun to tail off, and soon there was nobody left.", "ex_trans": "午後遅くには美術館の来館者は徐々に減り始めており, 間もなく誰も残っていなかった。"}, {"num": "2362", "word": "take in", "phonetic": "teɪk ɪn", "trans": "〜をだます [=deceive] , 〜を理解する [=understand]", "ex_eng": "She had been completely taken in by her friend's lie, so she was shocked to discover his claim was not true.", "ex_trans": "彼女は友達のうそにすっかりだまされていたので, 彼の主張が真実でないとわかってショックを受けた。"}, {"num": "2363", "word": "take it out on A", "phonetic": "teɪk ɪt aʊt ɑːn", "trans": "Aに当たり散らす", "ex_eng": "My mother takes it out on me when she feels frustrated.", "ex_trans": "母はむしゃくしゃすると私に当たり散らす。"}, {"num": "2364", "word": "take off", "phonetic": "teɪk ɔːf", "trans": "軌道に乗る，（売り上げが）急に伸びる", "ex_eng": "At first, the new product looked as though it might not take off, but then in March, sales began to soar.", "ex_trans": "その新製品は最初は軌道に乗らないように思われたが，3月になって売り上げが急に伸び始めた。"}, {"num": "2365", "word": "take on", "phonetic": "teɪk ɑːn", "trans": "(性質など)を帯びる [=assume] , (仕事など)を引き受ける", "ex_eng": "The leaves are taking on their brilliant hues.", "ex_trans": "木々の葉が素晴らしい色合いを帯びてきている。"}, {"num": "2366", "word": "tamper with ~", "phonetic": "tǽmpər wɪð", "trans": "～に(害を与えるような)手を加える", "ex_eng": "Somebody had tampered with the fire alarm, preventing it from going off.", "ex_trans": "誰かが火災報知機に手を加え, 鳴らないようにしていた。"}, {"num": "2367", "word": "tap into ~", "phonetic": "tæp ɪ́ntuː", "trans": "～を利用する, ～を活用する", "ex_eng": "The clothing store decided to launch a new youth brand in order to tap into the expanding teenage market.", "ex_trans": "その衣料品店は, 拡大するティーン市場を取り込むべく, 若者向けの新ブランドを立ち上げることにした。"}, {"num": "2368", "word": "taper off", "phonetic": "téɪpər ɔːf", "trans": "次第に減少する", "ex_eng": "At first, sales grew steadily, but then they began to taper off as the economy weakened.", "ex_trans": "初めのうち売り上げは着実に伸びたが, 不景気になると先細りになり始めた。"}, {"num": "2369", "word": "tear down", "phonetic": "ter daʊn", "trans": "(建物など)を取り壊す [=demolish] , (考え・議論など)を打ち砕く", "ex_eng": "She was strongly opposed to the plan to tear down the old city hall and build a new one.", "ex_trans": "古い市役所を取り壊して新築する計画に彼女は猛反対していた。"}, {"num": "2370", "word": "tear into ~", "phonetic": "ter ɪ́ntuː", "trans": "~を激しく非難する", "ex_eng": "Suddenly he began to tear into his girlfriend, accusing her of ruining his life.", "ex_trans": "突然彼は恋人をなじり始め, 自分の人生を台無しにしたと彼女を責めた."}, {"num": "2371", "word": "throw in the towel", "phonetic": "θroʊ ɪn ðə táʊəl", "trans": "敗北を認める", "ex_eng": "The boy threw in the towel during the table tennis match after his opponent gained a substantial lead.", "ex_trans": "卓球の試合中に対戦相手がかなりのリードを獲得した後，その男の子は敗北を認めた。"}, {"num": "2372", "word": "throw out", "phonetic": "θroʊ aʊt", "trans": "(提案などを)拒否する, (熱・煙などを)出す, (体の一部)をさっと(前に)出す", "ex_eng": "The appeals court judges reexamined the evidence of the lawsuit and threw out the lower court's verdict.", "ex_trans": "控訴裁判所の裁判官は，訴訟の証拠を再検討し，下級裁判所の判決を却下した。"}, {"num": "2373", "word": "thumb through ~", "phonetic": "θʌm θruː", "trans": "〜のページをぱらぱらめくる", "ex_eng": "While he waited for his dental appointment, he thumbed through some of the magazines in the waiting room.", "ex_trans": "歯医者の予約を待つ間，彼は待合室にあった雑誌を何冊かぱらぱらめくった。"}, {"num": "2374", "word": "tide A over", "phonetic": "taɪd óʊvər", "trans": "(金銭的援助で)Aに困難を乗り切らせる", "ex_eng": "The girl asked her parents for a loan to tide her over until her new job started.", "ex_trans": "その女の子は両親に，新しい仕事が始まるまでのしげるよう借金を頼んだ。"}, {"num": "2375", "word": "tip off", "phonetic": "tɪp ɔːf", "trans": "〜に密告する [=give away]", "ex_eng": "One of the terrorists tipped off the local police about the bomb.", "ex_trans": "テロリストの1人が爆弾のことを地元の警察に密告した。"}, {"num": "2376", "word": "tower over 〜", "phonetic": "táʊər óʊvər", "trans": "〜をはるかに超える", "ex_eng": "The scientist's achievements towered over those of his contemporaries.", "ex_trans": "その科学者の業績は彼と同時代の人たちの業績をはるかに超えていた。"}, {"num": "2377", "word": "trickle down", "phonetic": "tríkl daʊn", "trans": "(金・富などが) (富裕層から貧困層に) 徐々に行き渡る", "ex_eng": "The theory was that the richer wealthy people became, the ": "wer θruː", "trans": "擦り切れて穴が開く", "ex_eng": "The beggar's trousers were so old that they had worn through at the knees.", "ex_trans": "物乞いのズボンはとても古く, 膝が擦り切れて穴が開いていた。"}, {"num": "2387", "word": "weed out", "phonetic": "wiːd aʊt", "trans": "〜を排除する [=remove]", "ex_eng": "The background check was designed to weed out troublemakers from the organization.", "ex_trans": "その身元調査は, 組織から厄介者を排除することが目的だった。"}, {"num": "2388", "word": "weigh in", "phonetic": "weɪ ɪn", "trans": "意見を強く述べる, (意見を述べて)議論に強くかかわる", "ex_eng": "In the middle of the argument, her brother weighed in to support her.", "ex_trans": "口論の最中に, 彼女の兄が彼女を支持する意見をはっきり述べた。"}, {"num": "2389", "word": "whip up", "phonetic": "hwɪp ʌp", "trans": "(感情)をかき立てる [=rouse] , 〜を手早くこしらえる [=cook up]", "ex_eng": "The politician was accused of whipping up anger against the immigrant community.", "ex_trans": "その政治家は移民のコミュニティーに対する怒りをかき立てているとして糾弾された。"}, {"num": "2390", "word": "whisk away", "phonetic": "hwɪsk əw0éɪ", "trans": "〜をさっと持ち去る", "ex_eng": "Right after he showed them the painting, he whisked it away for safekeeping.", "ex_trans": "彼はその絵を彼らに見せるとすぐに, 保管のためにそれをさっさと片付けた。"}, {"num": "2391", "word": "whisk off", "phonetic": "hwɪsk ɔːf", "trans": "〜をさっと連れて行く", "ex_eng": "She was delighted when her father appeared and whisked her off to an expensive restaurant.", "ex_trans": "父親が現れて高級レストランにさっと連れて行ってくれたので彼女はうれしかった。"}, {"num": "2392", "word": "wind down", "phonetic": "waɪnd daʊn", "trans": "徐々に終わる", "ex_eng": "The party started to wind down around 7:30, far earlier than the planners had expected.", "ex_trans": "そのパーティーは, 立案者たちが予想していたよりもはるかに早く, 7時30分ごろに終わり始めた。"}, {"num": "2393", "word": "wipe out", "phonetic": "waɪp aʊt", "trans": "〜を撲滅する [=eradicate] , 〜をひどく疲れさせる", "ex_eng": "Thanks to the vaccine, the disease has now been almost completely wiped out in Africa.", "ex_trans": "ワクチンのおかげで, 今その病気はアフリカではほとんど完全に撲滅されている。"}, {"num": "2394", "word": "wolf down", "phonetic": "wʊlf daʊn", "trans": "〜をがっがっ食べる", "ex_eng": "She told her son not to wolf down his food so quickly.", "ex_trans": "彼女は息子に, そんなに急いで食べ物をがっがっ食べないようにと言った。"}, {"num": "2395", "word": "worm one's way out of ~", "phonetic": "wəːrm wʌnz weɪ aʊt ʌv", "trans": "〜をまんまと免れる", "ex_eng": "He wanted to worm his way out of visiting his wife's parents, but he could not think of a good excuse.", "ex_trans": "彼は妻の両親の家に行くのをうまい具合に逃れたかったが, いい言い訳が思い付かなかった。"}, {"num": "2396", "word": "wrap up", "phonetic": "ræp ʌp", "trans": "〜を終える", "ex_eng": "Let's wrap up our homework and hit the sack.", "ex_trans": "宿題を終わらせて寝よう。"}, {"num": "2397", "word": "wriggle out of ~", "phonetic": "ríɡl aʊt ʌv", "trans": "〜を何とかして逃れる", "ex_eng": "He had always managed to wriggle out of criminal charges before.", "ex_trans": "それまで彼はいつも何とか刑事告発をうまく逃れてきた。"}, {"num": "2398", "word": "write off", "phonetic": "raɪt ɔːf", "trans": "〜を重要でないと判断する, 〜を (失敗者などと) 見なす", "ex_eng": "He knew that his family had written him off as a failure many years before.", "ex_trans": "家族が何年も前に失敗者として自分に見切りをつけたことを彼は知っていた。"}, {"num": "2399", "word": "zero in on ~", "phonetic": "zíːroʊ ɪn ɑːn", "trans": "〜に照準を合わせる", "ex_eng": "Scientists zeroed in on the cause of the epidemic.", "ex_trans": "科学者たちはその伝染病の原因に狙いを定めた。"}, {"num": "2400", "word": "zip by", "phonetic": "zɪp baɪ", "trans": "びゅっと通り過ぎる", "ex_eng": "She tried to invite him to her birthday party, but he zipped by before she could say anything.", "ex_trans": "彼女は彼を誕生会に招待しようとしたが，彼女が何も言えないうちに彼はびゅっと通り過ぎた。"}];
        let wordCheckMap = JSON.parse(localStorage.getItem('tango_word_checked') || '{}');
        let dictCache = JSON.parse(localStorage.getItem('tango_dict_cache') || '{}');
        let lastReadNum = localStorage.getItem('tango_last_read_num') || null;
        let currentMode = 'all';
        let displayList = [];
        let currentIndex = 0;

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const uttr = new SpeechSynthesisUtterance(text);
                uttr.lang = 'en-US';
                uttr.rate = 0.9;
                window.speechSynthesis.speak(uttr);
            }
        }

        function getRawExEng() {
            return rawData[displayList[currentIndex]].ex_eng;
        }

        function setFilter(mode) {
            currentMode = mode;
            document.getElementById('filter-all').classList.toggle('active', mode === 'all');
            document.getElementById('filter-check').classList.toggle('active', mode === 'check');
            updateDisplayList();
        }

        function getHasCheckedNumSet() {
            const set = new Set();
            Object.keys(wordCheckMap).forEach(num => {
                const words = wordCheckMap[num];
                const hasActiveWord = Object.keys(words).some(w => words[w]);
                if (hasActiveWord) set.add(num);
            });
            return set;
        }

        function updateDisplayList() {
            const checkedNumSet = getHasCheckedNumSet();
            
            if (currentMode === 'all') {
                displayList = rawData.map((item, idx) => idx);
            } else {
                displayList = rawData.map((item, idx) => idx).filter(idx => checkedNumSet.has(rawData[idx].num));
            }
            
            document.getElementById('filter-check').innerText = `要復習のみ (${checkedNumSet.size})`;

            if (displayList.length === 0) {
                alert('チェックされた単語がありません。英文内の単語をタップしてマークしてください。');
                setFilter('all');
                return;
            }
            currentIndex = 0;
            renderCard();
            checkResumeButton();
        }

        function checkResumeButton() {
            const resumeBtn = document.getElementById('btn-resume');
            if (lastReadNum && currentMode === 'all') {
                document.getElementById('resume-num').innerText = lastReadNum;
                resumeBtn.style.display = 'block';
            } else {
                resumeBtn.style.display = 'none';
            }
        }

        function resumeLastPosition() {
            if (!lastReadNum) return;
            const targetIndex = displayList.findIndex(idx => rawData[idx].num === lastReadNum);
            if (targetIndex !== -1) {
                currentIndex = targetIndex;
                renderCard();
            }
        }

        async function fetchTranslation(word) {
            if (dictCache[word]) return dictCache[word];
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${word}&langpair=en|ja`);
                const data = await res.json();
                if (data && data.responseData) {
                    let trans = data.responseData.translatedText;
                    dictCache[word] = trans;
                    localStorage.setItem('tango_dict_cache', JSON.stringify(dictCache));
                    return trans;
                }
            } catch (e) {
                console.error(e);
            }
            return "（訳の取得に失敗しました）";
        }

        async function toggleWordCheck(num, cleanWord, element) {
            if (!wordCheckMap[num]) wordCheckMap[num] = {};
            wordCheckMap[num][cleanWord] = !wordCheckMap[num][cleanWord];
            
            localStorage.setItem('tango_word_checked', JSON.stringify(wordCheckMap));
            element.classList.toggle('word-checked', wordCheckMap[num][cleanWord]);
            
            renderWordTagList(num);

            const checkedNumSet = getHasCheckedNumSet();
            document.getElementById('filter-check').innerText = `要復習のみ (${checkedNumSet.size})`;
        }

        async function renderWordTagList(num) {
            const listDiv = document.getElementById('checked-words-list');
            const checkedWords = wordCheckMap[num] ? Object.keys(wordCheckMap[num]).filter(w => wordCheckMap[num][w]) : [];
            
            if (checkedWords.length === 0) {
                listDiv.innerHTML = '';
                return;
            }

            listDiv.innerHTML = '💡 <b>タップした単語の和訳:</b>';
            for (let word of checkedWords) {
                const cardEl = document.createElement('div');
                cardEl.className = 'word-translation-card';
                cardEl.innerHTML = `<span class="word-tag">${word}</span><span class="trans-text">読み込み中...</span>`;
                listDiv.appendChild(cardEl);

                fetchTranslation(word).then(trans => {
                    cardEl.querySelector('.trans-text').innerText = trans;
                });
            }
        }

        function renderCard() {
            if (displayList.length === 0) return;
            const item = rawData[displayList[currentIndex]];

            lastReadNum = item.num;
            localStorage.setItem('tango_last_read_num', lastReadNum);

            document.getElementById('card-num').innerText = item.num;
            document.getElementById('card-word').innerText = item.word;
            document.getElementById('card-phonetic').innerText = item.phonetic ? '[' + item.phonetic + ']' : '';

            const exContainer = document.getElementById('card-ex-eng');
            exContainer.innerHTML = '';
            
            const words = item.ex_eng.split(' ');
            words.forEach(w => {
                const cleanWord = w.replace(/[^a-zA-Z]/g, "").toLowerCase();
                const span = document.createElement('span');
                span.className = 'clickable-word';
                span.innerText = w + ' ';
                
                if (cleanWord && wordCheckMap[item.num] && wordCheckMap[item.num][cleanWord]) {
                    span.classList.add('word-checked');
                }
                
                if (cleanWord) {
                    span.onclick = () => toggleWordCheck(item.num, cleanWord, span);
                }
                exContainer.appendChild(span);
            });

            renderWordTagList(item.num);

            document.getElementById('target-trans').innerText = item.trans || '（訳なし）';
            document.getElementById('target-trans').style.display = 'none';

            document.getElementById('target-ex-trans').innerText = item.ex_trans || '（例文訳なし）';
            document.getElementById('target-ex-trans').style.display = 'none';

            document.getElementById('btn-trans').style.display = 'block';
            document.getElementById('btn-ex-trans').style.display = 'none';

            checkResumeButton();
        }

        function showTrans() {
            document.getElementById('target-trans').style.display = 'block';
            document.getElementById('btn-trans').style.display = 'none';
            document.getElementById('btn-ex-trans').style.display = 'block';
        }

        function showExTrans() {
            document.getElementById('target-ex-trans').style.display = 'block';
            document.getElementById('btn-ex-trans').style.display = 'none';
        }

        function nextCard() {
            if (currentIndex < displayList.length - 1) {
                currentIndex++;
                renderCard();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        updateDisplayList();
    </script>
